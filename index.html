  /* 特性联动（synergy）：若技能有 synergy 标签且玩家选了对应 trait，触发 bonus */
  var _synergy=false;
  if(def.synergy && a.passive && a.passive.type===def.synergy.trait){
    _synergy=true;
    if(def.synergy.trait==='armorBreak' && a.passive.armorStacks!=null){
      a.passive.armorStacks=Math.min(5,(a.passive.armorStacks||0)+1);
      pushLog(a.side,'💥 破阵共鸣·层数翻倍！');
    } else if(def.synergy.trait==='bloodthirst' && !a.noHeal){
      const h=Math.round(a.maxHp*0.05); a.hp=Math.min(a.maxHp,a.hp+h);
      pushLog(a.side,'🩸 嗜血共鸣·回复 '+h+' 生命');
    } else if(def.synergy.trait==='lethalRhythm'){
      a.passive.critDmgBonus=(a.passive.critDmgBonus||0.30)+0.20;
      pushLog(a.side,'🎯 旋律共鸣·本次必暴+50%暴伤');
    } else if(def.synergy.trait==='dualCast'){
      a._dualFree=true; // 双重施法时此技能不扣 MP
    }
  }
  /* 技能职业限制（origin）：不符时伤害/治疗×0.8；通用技不限 */
  var _originPenalty=1.0;
  if(a.side==='player' && def.origin && def.origin.length){
    const o=(G.account&&G.account.origin)||'';
    if(def.origin.indexOf(o)<0){ _originPenalty=0.8; }
  }
  if(def.type==='dmg'){
    let power=(magical?a.matk:a.atk)*mult*_originPenalty;
    if(a.skillDmg) power*=(1+a.skillDmg);
    if(a.eliteBossDmg&&(t.isElite||t.isBoss)) power*=(1+a.eliteBossDmg);
    const r=dealDamage(a,t,power,magical);
    if(r.miss) pushLog(a.side,'✨ '+a.name+' 施放【'+def.name+'】'+lv+'级 对 '+t.name+' 落空！');
    else pushLog(a.side,'✨ '+a.name+' 施放【'+def.name+'】'+lv+'级 对 '+t.name+' 造成 '+r.dmg+(r.crit?' 暴击!':''));
    /* 影袭连击：技能也追加 1 段 50% 伤害；若 synergy 淬毒刃则额外上毒 */
    if(!r.miss && a.passive && a.passive.type==='shadowStrike'){
      const r2=dealDamage(a,t,Math.round(power*(a.passive.extraMul||0.5)),magical);
      if(!r2.miss){
        pushLog(a.side,'✨ '+a.name+' 影袭连击追加 '+r2.dmg+(r2.crit?' 暴击!':''));
        if(_synergy && sk.id==='poison_edge'){
          const dotPower=magical ? a.matk : a.atk;
          t.buffs.push({type:'dot',dmg:Math.round(dotPower*0.4),turns:2});
          pushLog(a.side,'🐍 影袭共鸣·追加段上毒！');
        }
      }
    }
    if(def.slow) t.buffs.push({type:'slow',val:def.slow,turns:def.slowTurns});
    if(def.vuln) t.buffs.push({type:'vuln',val:def.vuln,turns:def.vulnTurns||2});
    if(def.hits&&def.hits>1){
      for(let h=1;h<def.hits;h++){
        const r2=dealDamage(a,t,power,magical);
        if(!r2.miss){ pushLog(a.side,'   → 第'+(h+1)+'击 '+r2.dmg+(r2.crit?' 暴击!':'')); }
      }
    }
    /* 玻璃大炮 synergy·火球术：暴击时溅射相邻敌人 30% 伤害 */
    if(_synergy && r.crit && sk.id==='fireball' && G.battle){
      const splash=Math.round(r.dmg*0.30);
      const enemies=(G.battle.enemies||[]).filter(function(e){ return e!==t && e.hp>0; });
      if(splash>0 && enemies.length){
        const e=enemies[Math.floor(Math.random()*enemies.length)];
        e.hp=Math.max(0, e.hp-splash);
        pushLog(a.side,'💥 玻璃大炮共鸣·溅射 '+e.name+' '+splash+' 伤害！');
      }
    }
  } else if(def.type==='dot'){
    /* BUG-4 fix: 只有 def.vuln 存在时才推易伤（旧码无条件 push→poison_edge 无 vuln→NaN 软锁） */
    /* BUG-5 fix: 使用等级加成后的 mult（旧码用 def.mult→dot 技能完全不升级） */
    const dotPower = (magical ? a.matk : a.atk) * mult;
    t.buffs.push({type:'dot', dmg: dotPower, turns: def.turns});
    if(def.vuln){
      /* BUG-7 fix: 若已有更强易伤则不覆盖（旧码 find 取首个→低阶吞高阶） */
      const oldV = t.buffs.find(function(b){ return b.type==='vuln'; });
      if(!oldV || (def.vuln||0) > (oldV.val||0)) {
        if(oldV) oldV.val = def.vuln;
        else t.buffs.push({type:'vuln', val:def.vuln, turns:def.turns});
      }
    }
    pushLog(a.side,'☠️ '+a.name+' 施放【'+def.name+'】'+lv+'级，'+t.name+' 陷入枯朽');
  } else if(def.type==='heal'){
    const heal=_noHeal?0:Math.round(a.maxHp*def.heal*(1+(a.healEff||0))*_originPenalty);
    a.hp=Math.min(a.maxHp,a.hp+heal);
    a._healDone = heal;
    /* synergy·teamMercy + heal_light：过量治疗转护盾 */
    if(_synergy && sk.id==='heal_light'){
      const overheal=Math.max(0, (a.hp+heal)-a.maxHp);
      if(overheal>0){ a.shield=Math.min(Math.round(a.maxHp*0.3), (a.shield||0)+overheal); }
    }
    /* 续命触发：治疗时概率过量转护盾 */
    if(a.side==='player' && a.triggerMercy && Math.random()<a.triggerMercy){
      const oh2=Math.max(0, (a.hp+heal)-a.maxHp);
      if(oh2>0){ const add=Math.min(Math.round(a.maxHp*0.2), oh2); a.shield=(a.shield||0)+add; pushLog(a.side,'⚡ 续命触发·过量转 '+add+' 护盾'); }
    }
    /* purify：清除自身负面效果（原描述"清除负面"之前未实现） */
    if(sk.id==='purify' || sk.id==='uni_cleanse'){
      a.buffs=(a.buffs||[]).filter(function(b){ return !isDebuff(b.type); });
      /* synergy·benediction + purify：全队攻击+15%（2回合） */
      if(_synergy && G.battle){
        const party=Array.isArray(G.battle.player)?G.battle.player:[G.battle.player];
        party.forEach(function(al){ if(al.hp>0) al.buffs.push({type:'atkBoost',val:0.15,turns:3}); });
        pushLog(a.side,'✨ 真言共鸣·全队攻击+15%！');
      }
    }
    pushLog(a.side,'🌟 '+a.name+' 施放【'+def.name+'】，恢复 '+heal+' 生命');
  }
  /* BUG-6 fix: 非 heal 类型技能若有 .heal 字段也应回血（如 silent_hymn 的 rider） */
  if(def.heal && def.type!=='heal' && def.type!=='dot'){
    const healRider = _noHeal ? 0 : Math.round(a.maxHp * def.heal * (1 + (a.healEff||0)) * _originPenalty);
    if(healRider > 0) {
      a.hp = Math.min(a.maxHp, a.hp + healRider);
    }
  } else if(def.type==='buff'){
    if(def.val) a.buffs.push({type:'atkBoost',val:def.val,turns:def.turns});
    if(def.spdBoost) a.buffs.push({type:'spdBoost',val:def.spdBoost,turns:def.turns});
    /* 专注：额外 +10% 暴击率 */
    if(sk.id==='uni_focus') a.buffs.push({type:'critBuff',val:0.10,turns:def.turns});
    pushLog(a.side,'📢 '+a.name+' 施放【'+def.name+'】'+lv+'级，能力提升！');
  } else if(def.type==='debuff'){
    if(def.vuln) t.buffs.push({type:'vuln',val:def.vuln,turns:def.vulnTurns||2});
    if(def.taunt) t.buffs.push({type:'taunt',taunter:a,turns:def.taunt});
    if(def.slow) t.buffs.push({type:'slow',val:def.slow,turns:def.slowTurns||2});
    pushLog(a.side,'🎯 '+a.name+' 施放【'+def.name+'】，'+t.name+' 受到减益效果！');
  }
  /* 护盾赋予释放者自身；眩晕/降攻/禁疗施加于目标（控制/诅咒类技能） */
  if(def.shield){ const sp=(a.shieldPct||0); var sh=Math.round(a.maxHp*def.shield*(1+sp)); /* synergy·teamBulwark + uni_guard：盾量×1.3 */ if(_synergy && sk.id==='uni_guard') sh=Math.round(sh*1.3); a.shield = Math.min(Math.round(a.maxHp*0.5), (a.shield||0) + sh); }
  if(def.stun)  t.buffs.push({type:'stun', turns:(def.stunTurns||1)+1}); /* +1：processStartBuffs 会先 turns-- 再判 stun，故需多 1 回合才生效 */
  if(def.debuffAtk) t.buffs.push({type:'atkDown', val:def.debuffAtk, turns:def.debuffTurns||2});
  if(def.noHeal)    t.buffs.push({type:'noHeal', turns:def.debuffTurns||2});
  if(def.taunt)     t.buffs.push({type:'taunt', taunter:a, turns:def.taunt}); /* 嘲讽：强制攻击施法者 */
  /* 通用·破绽 / 通用·战栗 的 vuln/slow 已在 dmg 分支中通过 def.vuln/def.slow 处理 */
  /* cdr 生效点（GDD 05b §12 #12）：cdBase 由 playerUnit 预算好；外部构造的技能对象回退 def.cd */
  sk.cd=(typeof sk.cdBase==='number' && sk.cdBase>0) ? sk.cdBase : def.cd;
  /* 共鸣触发：施法时概率 CD 重置 */
  if(a.side==='player' && a.triggerDual && Math.random()<a.triggerDual && sk.cd>0){
    sk.cd=0; pushLog(a.side,'⚡ 共鸣触发·技能 CD 重置！');
  }
  /* License 系统：registered/restricted/illicit 各有代价（原为纯装饰标签，现激活为 gameplay 惩罚） */
  if(a.side==='player'){
    if(def.license==='registered'){ a.mp-=1; if(a.mp<0)a.mp=0; }
    else if(def.license==='restricted'){ a.buffs.push({type:'vuln',val:0.10,turns:2,src:'license'}); }
    else if(def.license==='illicit' && Math.random()<0.20){ a.buffs.push({type:'noHeal',turns:2,src:'license'}); }
  }
  /* 未录钩子：施法后（此处已写入 CD，效果可将其清零 / 改写治疗与护盾结果） */
  if(_hc){ fireHook(a,'postCast',_hc); a._curSkill=null; }
}
/* src = 攻击者（可选）。⑧缚龙牌的「受到非龙裔伤害 +N%」需要知道来源；
   DoT / 真名伤害等无源伤害不传 src，此时按"来源未知"处理、不施加该惩罚（宁可漏判不误判）。 */
function applyDamage(t,dmg,src){
  let rem=dmg;
  /* 未录钩子：承伤前（锻痕受伤加成 / 盾破惩罚等，在减伤与吸收之前结算） */
  if(t.uniq && t.uniq.length && rem>0){ rem=fireHook(t,'incoming',{t:t,dmg:rem,a:src||null,b:G.battle}).dmg; }
  if(t.dmgReduce) rem=Math.round(rem*(1-t.dmgReduce));
  /* 玻璃大炮：受到伤害 +20%（最大生命 -25% 已在 playerUnit 落地） */
  if(t.dmgTakenMul) rem=Math.round(rem*(1+t.dmgTakenMul));
  /* 坦克·团队壁垒：友方坦克为受击友方分担减伤（单机时即自身额外减伤 20%） */
  if(t.side==='player' && G.battle && G.battle.player){
    const party = Array.isArray(G.battle.player)?G.battle.player:[G.battle.player];
    const tank = party.find(function(u){ return u!==t && u.passive && u.passive.type==='teamBulwark' && u.hp>0; })
              || (t.passive && t.passive.type==='teamBulwark' ? t : null);
    if(tank) rem=Math.round(rem*(1-0.20));
    /* 铁证·不破壁垒（未录 mythic_bulwark_armor）：队友受击时坦克替受 50% */
    const guard = party.find(function(u){ return u!==t && u.uniq && u.uniq.indexOf('myth_bulwark_armor')>=0 && u.hp>0 && !u._bulwarkBroken; });
    if(guard && t!==guard){
      const split=Math.round(rem*0.50);
      rem-=split; guard.hp=Math.max(1, guard.hp-split);
    }
    /* 荆棘不动：自身承伤再 -15% */
    if(t.passive && t.passive.type==='thorns' && (t.passive.reduce||0)>0) rem=Math.round(rem*(1-t.passive.reduce));
  }
  if(t.shield>0){const ab=Math.min(t.shield,rem);t.shield-=ab;rem-=ab;}
  t.hp-=rem; if(t.hp<0)t.hp=0;
  /* 荆棘不动：反弹部分伤害给攻击者（直扣血、置位防止互弹死循环） */
  if(rem>0 && t.passive && t.passive.type==='thorns' && src && !src._reflecting){
    src._reflecting=true;
    const tr=t.passive.reflect||0.20;
    const er=t.reflectDmg||0;
    const rv=Math.round(rem*(tr+er));
    if(rv>0 && src.hp>0){ src.hp=Math.max(0, src.hp-rv); pushLog('sys','🌵 '+t.name+' 荆棘反弹 '+rv+' 伤害'); }
    src._reflecting=false;
  }
  /* 荆棘触发：受击时装备概率额外反弹 */
  if(rem>0 && t.side==='player' && t.triggerThorns && Math.random()<t.triggerThorns && src){
    const tv=Math.round(rem*0.50); if(tv>0 && src.hp>0){ src.hp=Math.max(0, src.hp-tv); pushLog('sys','⚡ 荆棘触发·额外反弹 '+tv+' 伤害'); }
  }
  /* 治疗·团队续命：每场首次任一友方 <30% 生命，拉回 60% 并净化负面（每场 1 次） */
  if(rem>0 && G.battle && G.battle.player){
    const party = Array.isArray(G.battle.player)?G.battle.player:[G.battle.player];
    const healer = party.find(function(u){ return u.passive && u.passive.type==='teamMercy' && u.hp>0; });
    if(healer && healer.passive && !healer.passive.reviveUsed){
      const low = party.find(function(al){ return al.hp>0 && al.hp < al.maxHp*0.30; });
      if(low){
        low.hp=Math.round(low.maxHp*0.60);
        low.buffs=(low.buffs||[]).filter(function(b){ return !isDebuff(b.type); });
        healer.passive.reviveUsed=true;
        pushLog('sys','💚 无照慈悲·续命！'+low.name+' 被拉回 60% 生命并净化负面');
      }
    }
  }
}
/* ===== 职业被动：友方集合 / 护盾 / debuff 辅助（为后续组队预留，单机时友方=[玩家自己]） ===== */
function alliesOf(b, self){
  const arr=[];
  if(!b||!b.player) return arr;
  if(Array.isArray(b.player)) b.player.forEach(function(u){ if(u!==self && u.hp>0) arr.push(u); });
  else if(b.player!==self && b.player.hp>0) arr.push(b.player);
  return arr;
}
function alliesInclSelf(b, self){
  const arr=alliesOf(b, self);
  if(self && self.hp>0) arr.unshift(self);
  return arr;
}
function isDebuff(t){ return ['stun','slow','vuln','atkDown','noHeal','dot'].indexOf(t)>=0; }
function grantTeamShield(b, src, pct){
  const sp=(src.shieldPct||0);
  alliesInclSelf(b, src).forEach(function(al){
    if(al.hp<=0) return;
    const add=Math.round(al.maxHp*pct*(1+sp));
    al.shield=Math.min(Math.round(al.maxHp*0.5), (al.shield||0)+add);
  });
}
function checkBattleEnd(){
  const b=G.battle; if(b.over) return;
  const allDead = b.enemies.every(function(e){ return e.hp<=0; });
  if(allDead){b.over=true;b.result='win';endBattle();}
  else if(b.player.hp<=0){b.over=true;b.result='lose';endBattle();}
}
function endBattle(){
  clearInterval(G.battleTimer);G.battleTimer=null;
  const b=G.battle;
  let chain=false;
  if(b.result==='win'){
    const names=b.enemies.map(function(e){return e.name;}).join('、');
    pushLog('sys','🏆 击败了 '+names+'！');
    G.player.hp=b.player.hp; G.player.mp=b.player.mp;
    if(G.tower&&G.tower.active){ towerEndBattle(); return; }
    const boss=b.enemies.some(function(e){return e.isBoss;});
    /* BOSS击杀：解锁地图进度 */
    if(boss){
      G.encounter=0;G.eliteDone=false;G.bossDone=false;
      G.mapEliteAt=rand(6,9);G.mapBossAt=rand(15,30);
      const nextIdx=Math.min(MAPS.length-1, G.mapId+1);
      if(nextIdx>G.unlocked){ G.unlocked=nextIdx; pushLog('sys','🔓 解锁新地图：【'+MAPS[nextIdx].name+'】'); }
      pushLog('sys','🔁 地图巡回，怪物再度涌动（精英/BOSS位置已重置）……');
    }
    chain = !!G.autoChain;
  } else {
    pushLog('sys','☠️ 你倒下了……');
    const s=totalStats();G.player.hp=Math.round(s.hp*0.3);G.player.mp=Math.round(s.mp*0.5);
  }
  if(chain){
    /* 胜利后不切回地图，无弹窗，直接接战 */
    G.battle=null;
    save();
    setTimeout(function(){ if(G.autoChain) nextEncounter(); }, 450);
  } else {
    G.battle=null;
    save();
    showNormalView();
  }
}

/* ==================== 地图 / 遭遇 ==================== */
function enterMap(idx){
  if(!G){ toast('请先登录账号'); return; }
  /* #15 进阶闸门：冲下一难度前必须先把当前难度的词缀毕业度打到 65% */
  const gate = mapGateCheck(idx);
  if(!gate.ok){
    toast(gate.reason);
    if(gate.gate){
      const w = gate.detail && gate.detail.weakest;
      pushLog('sys','⛔ 【'+MAPS[idx].name+'】进入被拦下：难度 '+gate.gateTier+' 的词缀毕业度 '
        +Math.round(gate.pct*100)+'% < 65%。'+(w?'最缺：'+slotLabel(w)+'。':'')
        +'回上一档继续搜刮词缀，或到锻造铺重铸现有装备。',
        {hl:true, color:'#ff9f3a'});
      renderAll();
    }
    return;
  }
  G.mapId=idx;G.mapTier=MAPS[idx].tier;
  G.tower.active=false; /* 进入地图时退出试炼塔状态 */
  G.encounter=0;G.autoChain=true;G.eliteDone=false;G.bossDone=false;
  G.mapEliteAt=null;G.mapBossAt=null;
  pushLog('sys','🗺️ 进入【'+MAPS[idx].name+'】，连续遭遇已开启（击杀后自动接战，状态不回复）');
  nextEncounter();
}
function nextEncounter(){
  if(!G) return;
  if(G.battle) return;
  G.encounter++;
  /* 精英于第 6-9 次（10 次内）随机；BOSS 于第 15-30 次随机 */
  if(G.mapEliteAt==null) G.mapEliteAt=rand(6,9);
  if(G.mapBossAt==null) G.mapBossAt=rand(15,30);
  const pool=MAPS[G.mapId].pool;
  const rollNormal=function(){ return MONSTERS[pool[rand(0,pool.length-1)]]; };
  const incense=incenseActive();
  let defs, label;
  if(!G.bossDone && G.encounter===G.mapBossAt){
    /* BOSS 固定单只（引魂香不影响 BOSS 战） */
    defs=[MONSTERS[MAPS[G.mapId].boss]]; G.bossDone=true;
    label='BOSS战 · 第'+G.encounter+'次遭遇';
    /* GDD 05b §11.5C：BOSS 只给风险提示、绝不阻断——BOSS 是解锁下一图的钥匙，
       在这里加门会造成「毕业度不够→打不了 BOSS→不解锁→只能原地刷」的假死锁观感 */
    const gd=affixGradDetail(G.mapTier);
    if(gd.pct < GRAD_GATE){
      pushLog('sys','⚠️ 词缀毕业度 '+Math.round(gd.pct*100)+'%（建议 65%+），此战风险极高',
        {hl:true, color:'#e6443b'});
    }
  } else if(!G.eliteDone && G.encounter===G.mapEliteAt){
    /* 精英可带 0~2 只普通随从（引魂香生效时必带 1~2 只） */
    defs=[MONSTERS[MAPS[G.mapId].elite]];
    const adds = incense ? rand(1,2) : (Math.random()<0.25?1:0);
    for(let i=0;i<adds;i++) defs.push(rollNormal());
    G.eliteDone=true;
    label='精英战 · 第'+G.encounter+'次遭遇';
  } else {
    /* 普通遭遇：前5次保底单只；后续按地图阶梯解锁群怪 */
    var n;
    if(incense){
      n=rand(2,3);
    } else if(G.encounter<=5){
      n=1; /* 新号保护 */
    } else {
      var t=G.mapTier||0;
      if(t<=2){ n=Math.random()<0.20?2:1; }
      else if(t<=5){ n=Math.random()<0.35?rand(2,3):1; }
      else { n=Math.random()<0.50?rand(2,3):1; }
    }
    defs=[]; for(let i=0;i<n;i++) defs.push(rollNormal());
    label='遭遇 '+G.encounter+(incense?'（引魂香·群涌）':'');
  }
  startBattle(defs,label);
}

/* 引魂香：点燃后 10 分钟内遭遇怪物数量提升 */
function incenseActive(){
  return !!(G.incenseUntil && Date.now() < G.incenseUntil);
}
function incenseRemain(){
  if(!G.incenseUntil) return 0;
  return Math.max(0, G.incenseUntil - Date.now());
}
function useIncense(){

/* 击杀敌人即时奖励：每打死一只怪立刻给经验和道具，不想战后才结算 */
function killEnemy(enemy){
  const isElite=enemy.isElite,isBoss=enemy.isBoss;
  const gf=(totalStats().goldFind)||0;
  /* 金币 */
  const noGold = !isBoss && hasMythic('myth_oz_ring');
  if(!noGold){
    const g=Math.round((isBoss?rand(150,300):isElite?rand(50,100):rand(10,30))*(1+gf));
    G.player.gold+=g;
    if(g) pushLog('sys','💰 获得 '+g+' 金币', {hl:true, color:'#c9a227'});
  }
  /* 材料 */
  const mats=isBoss?rand(8,15):isElite?rand(3,6):rand(0,2);
  if(mats){ matAdd('common',mats); pushLog('sys','🪨 获得 '+mats+' 材料', {color:'#9aa0a6'}); }
  /* 装备掉落（每只怪独立判断，爆率约原值×0.6以补偿即时化） */
  if(Math.random()<(isBoss?0.6:isElite?0.5:0.20)){
    const rar=isBoss?(Math.random()<0.5?'epic':'legendary'):isElite?selectEliteRarity():null;
    const it=genEquip(G.mapTier,rar);
    G.player.inventory.push(it); const ro=rarObj(it.rarity)||RARITY[0];
    pushLog('sys','🎁 获得【'+ro.name+'】'+it.name, {hl:true, color:ro.color});
  }
  /* 技能书（每只独立，爆率约原值×0.7） */
  if((isBoss?Math.random()<0.4:isElite?Math.random()<0.2:Math.random()<0.04)){
    const pool=Object.keys(SKILLS).filter(k=>SKILLS[k].tier==='base');
    if(pool.length){ const sk=pool[rand(0,pool.length-1)]; giveBook(sk); }
  }
  if((isBoss?Math.random()<0.2:isElite?Math.random()<0.07:Math.random()<0.015)){
    const pool=Object.keys(SKILLS).filter(k=>SKILLS[k].tier==='mid');
    if(pool.length){ const sk=pool[rand(0,pool.length-1)]; giveBook(sk); }
  }
  /* BOSS专属 */
  if(isBoss){
    const bossKey=enemy.monKey||Object.keys(MONSTERS).find(k=>MONSTERS[k].boss&&MONSTERS[k].name===enemy.name);
    if(bossKey&&BOSS_DROPS[bossKey]) rollBossLootInstant(bossKey);
    /* 特性石：Boss 低概率掉落（可改换职业特性） */
    if(Math.random()<0.10){ G.player.inventory.push(genTraitStone()); pushLog('sys','💎 稀有掉落！特性石（可改换职业特性）', {hl:true, color:'#ff9f3a'}); }
  }
  /* 高级书 / 光环 */
  if(isElite&&Math.random()<0.04){
    const auras=Object.keys(SKILLS).filter(k=>SKILLS[k].type==='aura');
    if(auras.length){ const sk=auras[rand(0,auras.length-1)]; giveBook(sk); pushLog('sys','✨ 精英掉落光环技能书【'+SKILLS[sk].name+'】'); }
  }
  if((isBoss&&Math.random()<0.10)||(isElite&&Math.random()<0.03)){
    const pool=Object.keys(SKILLS).filter(k=>SKILLS[k].tier==='high');
    if(pool.length){ const sk=pool[rand(0,pool.length-1)]; giveBook(sk); pushLog('sys','🌟 稀世掉落！高级技能书【'+SKILLS[sk].name+'】'); }
  }
  /* 药水瓶 */
  if(Math.random()<(isBoss?0.45:isElite?0.18:0.05)){
    const lvl=clamp(G.mapTier*2+((isBoss||isElite)?1:rand(0,1)),0,FLASK_TIERS.length-1);
    const fl=genFlask(lvl,Math.random()<0.5?'hp':'mp',false);
    G.player.inventory.push(fl); pushLog('sys','🧪 获得 '+fl.name, {color:'#7fd6a0'});
  }
  /* 经验：即时获得 */
  let exp=isBoss?130:isElite?60:22;
  const eMult=expScale(G.mapTier);
  gainExp(Math.round(exp*eMult));
  /* 药水瓶充能 */
  ['hp','mp'].forEach(function(k){
    const f=G.player.flasks&&G.player.flasks[k];
    if(f&&f.charge<f.cap){
      const g=Math.round((isBoss?60:isElite?25:9)*(1+flaskAffix(f,'killCharge')));
      f.charge=Math.min(f.cap,f.charge+g);
    }
  });
  save();
}

}

function generateLoot(enemies){
  if(!Array.isArray(enemies)) enemies=[enemies];
  const dm=1;
  const gf=(totalStats().goldFind)||0;
  const loot={gold:0,materials:0,items:[],books:[],flasks:[]};
  enemies.forEach(function(enemy){
    const isElite=enemy.isElite,isBoss=enemy.isBoss;
    /* 未录代价（三指·脱籍戒）：击杀非 BOSS 不再掉金币 */
    const noGold = !isBoss && hasMythic('myth_oz_ring');
    if(!noGold) loot.gold+=Math.round((isBoss?rand(150,300):isElite?rand(50,100):rand(10,30))*(1+gf));
    loot.materials+=isBoss?rand(8,15):isElite?rand(3,6):rand(0,2);
    if(Math.random()<(isBoss?1:isElite?0.8:0.35)*dm){
      const rar=isBoss?(Math.random()<0.5?'epic':'legendary'):isElite?selectEliteRarity():null;
      loot.items.push(genEquip(G.mapTier,rar));
    }
    /* 技能书掉落：基础技（较高概率）/ 中级技（较低概率），均不含高级（高级走特殊掉落）；含无武器要求的通用技 */
    if((isBoss?Math.random()<0.6:isElite?Math.random()<0.3:Math.random()<0.06)*dm){
      const baseSk=Object.keys(SKILLS).filter(k=>SKILLS[k].tier==='base');
      if(baseSk.length) loot.books.push(baseSk[rand(0,baseSk.length-1)]);
    }
    if((isBoss?Math.random()<0.3:isElite?Math.random()<0.10:Math.random()<0.02)*dm){
      const midSk=Object.keys(SKILLS).filter(k=>SKILLS[k].tier==='mid');
      if(midSk.length) loot.books.push(midSk[rand(0,midSk.length-1)]);
    }
    /* BOSS 专属掉落：单次击杀至多 1 件（未录 5%/20次保底 > 专属书 5% > 敕造 3%/10次保底） */
    if(isBoss){
      /* key 直传（enemyUnit.monKey）；旧存档/异常兜底才回退到名字匹配 */
      const bossKey = enemy.monKey ||
        Object.keys(MONSTERS).find(k=>MONSTERS[k].boss && MONSTERS[k].name===enemy.name);
      if(bossKey && BOSS_DROPS[bossKey]) rollBossLoot(bossKey, loot);
    }
    /* 未录（掌典·禁页杖）：被标记"已归档"的目标陨落时必掉 1 件随机装备 */
    if(enemy._archived && enemy.hp<=0){
      loot.items.push(genEquip(G.mapTier,null));
      pushLog('sys','📕 已归档目标陨落，强制掉落 1 件装备');
    }
    /* 全地图精英：5% 掉落随机光环技能书 */
    if(isElite && Math.random()<0.05*dm){
      const auras=Object.keys(SKILLS).filter(k=>SKILLS[k].type==='aura');
      const pick=auras[rand(0,auras.length-1)];
      loot.books.push(pick);
      pushLog('sys','✨ 精英掉落光环技能书【'+SKILLS[pick].name+'】');
    }
    /* 高级技能书：Boss 12% / 精英 4% 掉随机高级书（独立于普通池与专属掉落） */
    if((isBoss&&Math.random()<0.12*dm) || (isElite&&Math.random()<0.04*dm)){
      const highSk=Object.keys(SKILLS).filter(k=>SKILLS[k].tier==='high');
      if(highSk.length){
        const pick=highSk[rand(0,highSk.length-1)];
        loot.books.push(pick);
        pushLog('sys','🌟 稀世掉落！高级技能书【'+SKILLS[pick].name+'】');
      }
    }
    /* 药水瓶：按地图难度产出（难度t → 等级2t/2t+1；精英/BOSS 更易掉且偏高一级） */
    if(Math.random()<(isBoss?0.55:isElite?0.22:0.07)*dm){
      const lvl=clamp(G.mapTier*2+((isBoss||isElite)?1:rand(0,1)),0,FLASK_TIERS.length-1);
      loot.flasks.push(genFlask(lvl, Math.random()<0.5?'hp':'mp', false));
    }
  });
  return loot;
}

/* ==================== 经验衰减（GDD 05b §9，候选 B′） ====================
   Δ = player.level − ML_map(当前地图 tier)：
     Δ ≤ −10 → 1.15（鼓励越级挑战；此时怪 scale 高出一档，风险已是天然限流，不可刷）
     Δ  <  0 → 1.00
     Δ ≥  0 → max(0.05, 0.70 − 0.15Δ)   即 0.70 / 0.55 / 0.40 / 0.25 / 0.10 / 0.05
   为什么不是指数衰减（候选 A，Δ=0 直接腰斩到 0.50）：放置游戏里"挂机 2 小时回来发现后
   1.5 小时几乎白挂"= 惩罚不可见 + 不可逆 = 纯挫败。线性带留出 Δ=1~2 的缓冲窗，
   而且"每超 1 级少 15%"是一句话能讲清、玩家能口算的规则。 */
function expScale(mapTier){
  const ML = ML_map(mapTier);
  const d  = ((G && G.player && G.player.level) || 1) - ML;
  if(d <= -10) return 1.15;
  if(d <   0)  return 1.0;
  return Math.max(0.05, 0.70 - 0.15*d);
}
/* 爆物横幅已废弃：掉落改为战斗信息栏高亮行（见 applyLoot） */
function gainExp(x){
  /* GDD 04b §2.5 A：玩家等级硬上限 Lv60（满级后经验条封顶，不再溢出升级） */
  if(G.player.level>=MAX_LEVEL){ G.player.exp=Math.min(G.player.exp+x, G.player.expNext); return; }
  G.player.exp+=x;
  while(G.player.exp>=G.player.expNext){
    if(G.player.level>=MAX_LEVEL){ G.player.exp=G.player.expNext; break; }
    G.player.exp-=G.player.expNext;
    G.player.level++;
    G.player.expNext=Math.round(G.player.expNext*1.20);
    G.player.attrPoints+=3; /* 每级3自由属性点 */
    pushLog('sys','⬆️ 升到 '+G.player.level+' 级！获得 3 属性点');
    const s=totalStats();G.player.hp=s.hp;G.player.mp=Math.round(s.mp);
    /* 15 级觉醒：达到阈值且尚未选择特性 → 标记待觉醒（回到地图时弹面板） */
    if(G.player.level>=LEVEL_AWAKEN && !G.player.trait) G._pendingAwaken=true;
  }
}

function applyEquip(uid){
  INSPECT=null;
  if(G.battle){ toast('战斗中无法更换装备，请退出战斗后再操作'); renderContent(); return; }
  const idx=G.player.inventory.findIndex(i=>i.uid===uid);if(idx<0)return;
  const it=G.player.inventory[idx],slot=it.slot;
  const check=canEquip(it);
  if(!check.ok){
    toast('不满足需求！'+check.reqs.map(r=>(r.attr==='lv'?'等级'+r.need:ATTRS[r.attr].name+r.need)).join(' '));
    return;
  }
  const prev=G.player.equip[slot];
  G.player.equip[slot]=it;G.player.inventory.splice(idx,1);
  if(prev) G.player.inventory.push(prev);
  syncMythicSkills(); /* 敕令共鸣：未录装备自动授予绑定技能（skillLevel 再额外 +1） */
  /* 武器更换时自动卸下不再匹配的技能 */
  if(slot==='weapon') purgeInvalidSkills();
  const s=totalStats();if(G.player.hp>s.hp)G.player.hp=s.hp;
  pushLog('sys','📦 装备了 '+it.name);
  if(it.mythic&&it.mythic.skill&&SKILLS[it.mythic.skill]) pushLog('sys','🔴 敕令共鸣：【'+SKILLS[it.mythic.skill].name+'】+1 级并改写其行为', {hl:true, color:'#e6443b'});
  save();renderAll();
}

function applyUseBook(invIndex){
  INSPECT=null;
  const it=G.player.inventory[invIndex];
  if(!it||it.type!=='book')return;
  const sk=it.skill,cur=G.player.skills[sk]||0;
  if(cur>=10){toast('该技能已满级(10)');return;}
  const req=skillReq(sk), p=G.player;
  if(p.str<req.str||p.agi<req.agi||p.int<req.int){
    const need=[]; if(req.str) need.push('力量 '+req.str); if(req.agi) need.push('敏捷 '+req.agi); if(req.int) need.push('智力 '+req.int);
    toast('属性不足，无法学习【'+SKILLS[sk].name+'】。需要：'+need.join('、'));
    return;
  }
  G.player.skills[sk]=cur+1;
  G.player.inventory.splice(invIndex,1);
  pushLog('sys','📖 学会/升级【'+SKILLS[sk].name+'】至 '+(cur+1)+' 级');
  save();renderAll();
}

  const p=G.player;

function allocAttr(attr){
  if(G.player.attrPoints<=0){toast('没有可分配的属性点');return;}
  G.player.attrPoints--;
  G.player.pendingPts[attr]=(G.player.pendingPts[attr]||0)+1;
  renderAll();
}
function undoAlloc(attr){
  if((G.player.pendingPts[attr]||0)<=0) return;
  G.player.pendingPts[attr]--;
  G.player.attrPoints++;
  renderAll();
}
function confirmAlloc(){
  const pp=G.player.pendingPts;
  var total=pp.str+pp.agi+pp.con+pp.int+pp.spi;
  if(total<=0){toast('没有待确认的分配');return;}
  G.player.str+=pp.str; G.player.agi+=pp.agi; G.player.con+=pp.con; G.player.int+=pp.int; G.player.spi+=pp.spi;
  pp.str=pp.agi=pp.con=pp.int=pp.spi=0;
  G.player.allocLocked=true;
  toast('✅ 已确认分配 '+total+' 点（可继续加，不可减）');
  save();renderAll();
}
function resetAlloc(){
  if(!G.player.allocLocked){toast('属性尚未确认锁定');return;}
  if(G.player.level>=30){
    var idx=G.player.inventory.findIndex(function(i){return i.type==='respecStone';});
    if(idx<0){toast('需要回溯石（商店购买）');return;}
    G.player.inventory.splice(idx,1);
    /* 退回5点到attrPoints */
    var returned=0;
    ['str','agi','con','int','spi'].forEach(function(k){
      var take=Math.min(5-returned, G.player[k]-10);
      if(take>0){ G.player[k]-=take; returned+=take; }
    });
    G.player.attrPoints+=returned;
    G.player.allocLocked=false;
    toast('退回 '+returned+' 属性点（回溯石-1）');
  } else {
    var oldStr=G.player.str,oldAgi=G.player.agi,oldCon=G.player.con,oldInt=G.player.int,oldSpi=G.player.spi;
    G.player.str=10;G.player.agi=10;G.player.con=10;G.player.int=10;G.player.spi=10;
    var back=(oldStr+oldAgi+oldCon+oldInt+oldSpi)-50;
    G.player.attrPoints+=back;
    G.player.allocLocked=false;
    toast('🔄 已重置，退回 '+back+' 属性点（Lv30前免费）');
  }
  G.player.pendingPts={str:0,agi:0,con:0,int:0,spi:0};
  save();renderAll();
}

/* ==================== 存档（本地 + 云端同步） ==================== */
/* 实时自动存档：每次操作即时存 + 战斗中每约2秒存，保证不丢档；
   若已登录云端，则同时推送到服务器（server.js），实现云端/服务器存档。 */
/* ---- 密码摘要：优先 WebCrypto SHA-256，降级为内置散列（离线模式用） ---- */
async function hashPass(pass, salt){
  const txt = salt+'|'+pass+'|edict';
  try{
    if(typeof crypto!=='undefined' && crypto.subtle && typeof TextEncoder!=='undefined'){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
    }
  }catch(e){}
  let h1=0x811c9dc5>>>0, h2=0x27d4eb2f>>>0;
  for(let i=0;i<txt.length;i++){
    const c=txt.charCodeAt(i);
    h1=Math.imul(h1^c, 16777619)>>>0;
    h2=Math.imul(h2+c+i, 2654435761)>>>0;
  }
  return ('00000000'+h1.toString(16)).slice(-8)+('00000000'+h2.toString(16)).slice(-8);
}

/* ==================== 存档导出 / 导入（本地模式迁移用） ==================== */
/* 把本机账号、登录态与角色存档打包成 JSON 下载；导入时整体写回并刷新。
   用途：在不同浏览器 / 源（如隧道网址 ↔ 本地双击）之间迁移角色。       */
function exportSave(){
  try{
    const data = { app:'edict', ver:2, ts:Date.now(), keys:{} };
    const keep = [SAVE_KEY, ACCOUNTS_KEY, SESSION_KEY];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k) continue;
      if(keep.indexOf(k)>=0 || k.indexOf(SAVE_KEY+'::')===0){
        try{ data.keys[k]=localStorage.getItem(k); }catch(e){}
      }
    }
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); const d=new Date();
    const pad=function(n){ return (''+n).padStart(2,'0'); };
    a.href=url; a.download='edict_save_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} }, 1000);
    toast('已导出存档（账号 + 角色）');
  }catch(e){ if(typeof toast==='function') toast('导出失败：'+(e&&e.message||e)); }
}
function importSaveFromFile(file){
  const reader=new FileReader();
  reader.onload=function(){
    try{
      const data=JSON.parse(reader.result);
      if(!data || !data.keys) throw new Error('文件格式不正确');
      const ok = (typeof confirm!=='undefined') ? confirm('导入将覆盖本机同名账号与角色存档，确定继续？\n（建议先点「导出存档」备份当前进度）') : true;
      if(!ok) return;
      let n=0; for(const k in data.keys){ try{ localStorage.setItem(k, data.keys[k]); n++; }catch(e){} }
      toast('已导入 '+n+' 条存档，即将刷新…');
      setTimeout(function(){ location.reload(); }, 800);
    }catch(e){ if(typeof toast==='function') toast('导入失败：'+(e&&e.message||e)); }
  };
  reader.onerror=function(){ if(typeof toast==='function') toast('读取文件失败'); };
  reader.readAsText(file);
}
function importSavePick(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=function(){ if(inp.files&&inp.files[0]) importSaveFromFile(inp.files[0]); };
  inp.click();
}

function saveSlot(i){
  try{

    for(let j=0;j<localStorage.length;j++){ const k=localStorage.key(j); if(!k) continue; if(keep.indexOf(k)>=0 || k.indexOf(SAVE_KEY+'::')===0){ try{ keys[k]=localStorage.getItem(k); }catch(e){} } }

function loadSlot(i, force){
  const slots=loadSlotsRaw(); const s=slots[i];
  if(!s||!s.keys){ if(typeof toast==='function') toast('该存档槽为空'); return; }

    slotReadPending=i; renderSlotsPanel();

    return;
  }

  let n=0; for(const k in s.keys){ try{ localStorage.setItem(k, s.keys[k]); n++; }catch(e){} }

/* ==================== 账号系统（纯单机 · 本地存档） ====================
   单机模式：账号与存档均保存在本机 localStorage，无云端、无服务器。
   仍需登录（本机账号库校验），未登录不创建游戏状态。                  */
const Auth = {
  /* 纯本地存档（单槽位，无账号） */
  writeLocal(g){ if(!g) return; try{ localStorage.setItem(SAVE_KEY, JSON.stringify(g)); }catch(e){ console.error('Auth.writeLocal failed:', e.message); } },
  saveGame(g){ if(!g) return; try{ localStorage.setItem(SAVE_KEY, JSON.stringify(g)); }catch(e){ console.error('Auth.saveGame failed:', e.message); } },
  loadSave(){ try{ const raw=localStorage.getItem(SAVE_KEY); if(raw){ const d=JSON.parse(raw); if(d&&d.player) return d; } }catch(e){} return null; }
};
/* 兼容旧调用点 */
const CloudSave = {
  _timer:null,
  get user(){ return ''; },
  writeLocal(g){ Auth.writeLocal(g); },
  save(g){ Auth.saveGame(g); },
  load(){ return Auth.loadSave(); },
  logout(){ try{ if(G) Auth.saveGame(G); }catch(e){} }
};
function save(){ if(!G) return;
  try{
    const js=JSON.stringify(G);
    /* 写前自动备份：上一版完好存档留着，万一新存档损坏可回退 */
    const prev=localStorage.getItem(SAVE_KEY);
    if(prev) try{ localStorage.setItem(SAVE_KEY+'_bak', prev); }catch(e){}
    localStorage.setItem(SAVE_KEY, js);
  }catch(e){ toast('⚠️ 保存失败：'+e.message); }
}
/* 实时自动保存：每 20s 兜底 + 离开页面时尽力保存（战斗中变化已用 scheduleSave 防抖即时存） */

window.addEventListener('beforeunload', function(){ try{ save(); }catch(e){} });

/* 预加载雪碧图大图压缓存 + 进游戏前阻塞等待（等雪碧图下载完才放行，杜绝冷请求空位） */
var _preloadTotal=0, _preloadDone=0, _preloadReady=false;
function preloadAtlas(){
  if(_preloadReady) return;
  var urls=[];
  try{
    if(typeof ATLAS_MON!=='undefined' && ATLAS_MON.url) urls.push(ATLAS_MON.url);
    if(typeof ATLAS_ALPHA!=='undefined' && ATLAS_ALPHA.url) urls.push(ATLAS_ALPHA.url);
  }catch(e){}
  _preloadTotal=urls.length;
  if(_preloadTotal===0){ _preloadReady=true; return; }
  for(var i=0;i<urls.length;i++){
    var img=new Image();
    img.onload=img.onerror=function(){ _preloadDone++; if(_preloadDone>=_preloadTotal) _preloadReady=true; };
    img.src=urls[i];
  }
  // 30 秒兜底超时：GitHub Pages 偶发卡大文件，超时后强制放行（图片在后台继续加载）
  setTimeout(function(){ if(!_preloadReady){ _preloadDone=_preloadTotal; _preloadReady=true; } }, 30000);
  // 后台顺带预热缩略图（不阻塞，版本号与 monsterSVG 一致用 ?v=7）
  if(typeof ATLAS_MON!=='undefined' && ATLAS_MON.map){
    Object.keys(ATLAS_MON.map).forEach(function(k){
      var t=new Image(); t.src='assets/monsters_thumb/'+k+'.png?v=9';
    });
  }
}
/* 阻塞等待雪碧图下载完毕才进游戏；首次显示加载读条，8 秒后可用跳过按钮 */
function ensureAtlasReady(cb){
  if(_preloadReady){ cb(); return; }
  var ov=gateEl('gateLoading'), bar=gateEl('gateLoadFill'), skipEl=null;
  if(ov){ ov.style.display='flex'; }
  var fakeTick=0, skipShown=false, resolved=false;
  function done(){
    if(resolved) return; resolved=true;
    if(bar) bar.style.width='100%';
    setTimeout(function(){ if(ov) ov.style.display='none'; cb(); }, 250);
  }
  var check=setInterval(function(){
    if(_preloadReady){ clearInterval(check); done(); return; }
    var realPct=_preloadTotal>0 ? Math.round(_preloadDone/_preloadTotal*80):0;
    fakeTick++;
    var fakePct=Math.min(80, fakeTick*3);
    var pct=Math.max(realPct, fakePct);
    if(bar) bar.style.width=pct+'%';
    // 8 秒后显示跳过按钮
    if(!skipShown && fakeTick>44){
      skipShown=true;
      if(ov){
        skipEl=document.createElement('div');
        skipEl.textContent='跳过等待，直接进入';
        skipEl.style.cssText='margin-top:18px;font-size:12px;color:rgba(136,153,187,.6);cursor:pointer;letter-spacing:1px;';
        skipEl.onclick=function(){ clearInterval(check); _preloadDone=_preloadTotal; _preloadReady=true; done(); };
        skipEl.onmouseenter=function(){ skipEl.style.color='#aabbdd'; };
        skipEl.onmouseleave=function(){ skipEl.style.color='rgba(136,153,187,.6)'; };
        ov.appendChild(skipEl);
      }
    }
  }, 180);
}

/* ==================== 官网公告 / 更新 / 论坛 ==================== */
function applyCompat(){
  if(!G.account) G.account={mode:'local', origin:'warrior', originName:'铁誓者', createdAt:Date.now()};
  if(typeof G.player.str==='undefined'){ G.player.str=8; G.player.agi=8; G.player.int=8; G.player.attrPoints=0; }
  if(typeof G.player.con==='undefined'){ G.player.con=8; }
  if(typeof G.player.spi==='undefined'){ G.player.spi=8; }
  if(typeof G.folds==='undefined') G.folds={};
  if(typeof G.navTab==='undefined') G.navTab='char';
  if(typeof G.autoChain==='undefined') G.autoChain=false;
  if(typeof G.unlocked==='undefined') G.unlocked=0;
  if(typeof G.eliteDone==='undefined') G.eliteDone=false;
  if(typeof G.bossDone==='undefined') G.bossDone=false;
  if(typeof G.mapEliteAt==='undefined') G.mapEliteAt=null;
  if(typeof G.mapBossAt==='undefined') G.mapBossAt=null;
  if(!G.consumables) G.consumables={incense:0};
  if(typeof G.incenseUntil==='undefined') G.incenseUntil=0;
  /* 词缀毕业度门禁（GDD 05b §11.4）：单向棘轮，通过一次永久通过。
     旧档必须用 G.unlocked 回填——否则老玩家读档后会被一道刚上线的门倒锁在已通关的图外。 */
  if(!G.gradeGate || typeof G.gradeGate.passedTier!=='number') G.gradeGate={passedTier:0};
  G.gradeGate.passedTier=Math.max(G.gradeGate.passedTier, G.unlocked||0);
  /* 锻造材料：旧档 p.materials 为数字，迁移为按品质分类的对象 */
  if(!G.player.materials || typeof G.player.materials!=='object'){
    const old=(typeof G.player.materials==='number')?G.player.materials:0;
    G.player.materials={common:old, refined:0, blue:0, purple:0, orange:0};
  }
  if(!G.forge) G.forge={};
  /* 未录（第六档）：旧档补齐独一性与整局永久加成字段，并回填敕令共鸣授予的技能 */
  if(!G.ownedMythic)    G.ownedMythic={};
  if(!G.bossKillStreak) G.bossKillStreak={};
  /* 图鉴发现记录（方案B）：旧档此前无此字段 → 自动标记已解锁地图(mapIdx<=unlocked)的怪为已发现 */
  if(!G.seenMonsters || !Array.isArray(G.seenMonsters)) G.seenMonsters=[];
  if(G.seenMonsters.length===0 && G.unlocked>0){
    for(const k in MONSTER_MAP){ if(MONSTER_MAP[k] && MONSTER_MAP[k].mapIdx<=G.unlocked) G.seenMonsters.push(k); }
  }
  /* 🔴 GDD 05b §6：mythicStr / mythicHp 两个「整局永久叠加」字段已废弃。
     字段保留但恒为 0（旧档兼容 + 防止别处读到 undefined），读到 >0 时清零并告知玩家。
     不返还属性点：该收益本就是设计错误，不是玩家的合法资产。 */
  const _hadPerm = (G.player.mythicStr>0) || (G.player.mythicHp>0);
  G.player.mythicStr=0; G.player.mythicHp=0;
  if(typeof G.player._godMode!=='boolean') G.player._godMode=false;
  if(typeof G.player.allocLocked==='undefined') G.player.allocLocked=false;
  if(!G.player.pendingPts) G.player.pendingPts={str:0,agi:0,con:0,int:0,spi:0};
  if(_hadPerm){
    try{ pushLog('sys','⚙️ 未录已依新律重铸：整局永久力量/生命已回收，改为战斗内层数机制（锻痕 / 缚龙）。',
      {hl:true, color:'#e6443b'}); }catch(e){}
  }
  if(typeof G.dragonTally!=='number') G.dragonTally=0;  /* 龙裔击杀收藏计数（零数值收益） */
  /* ilv 回填（GDD 05b §3.1）：旧档装备没有 ilv，用 itemIlv 的反推逻辑一次性落盘，
     否则重铸时会按 ML_map(0)=6 只开出 T5，把老装备无声废掉。 */
  try{
    const fillIlv=function(it){
      if(!it || it.type) return;
      if(typeof it.ilv==='number' && isFinite(it.ilv)) return;
      it.ilv=itemIlv(it);
    };
    (G.player.inventory||[]).forEach(fillIlv);
    for(const sl in (G.player.equip||{})) fillIlv(G.player.equip[sl]);
  }catch(e){}
  /* 未录 id 对齐 GDD §9.5 key 列：迁移本地试玩期存档里的旧 m_* id，否则效果查表落空会变哑装备 */
  try{
    const IDMAP={m_rust_crown:'myth_rust_crown',m_oz_ring:'myth_oz_ring',m_edna_amulet:'myth_edna_charm',
      m_varuk_hammer:'myth_forge_hammer',m_sevlan_staff:'myth_codex_staff',m_null_ring:'myth_erase_seal',
      m_wellspring_cup:'myth_ink_cup',m_vaerith_tag:'myth_dragon_brand',m_maerus_seal:'myth_seal_ring',
      m_first_edict:'myth_name_wheel'};
    const fixId=function(it){ if(it && it.mythic && IDMAP[it.mythic.id]) it.mythic.id=IDMAP[it.mythic.id]; };
    (G.player.inventory||[]).forEach(fixId);
    for(const sl in (G.player.equip||{})) fixId(G.player.equip[sl]);
  }catch(e){}
  if(G.player.level>MAX_LEVEL) G.player.level=MAX_LEVEL; /* Lv60 硬上限：夹回超限旧档 */
  /* uid 计数器续接存档中的最大值，避免刷新后新物品与旧物品撞号 */
  try{
    let mx=0;
    G.player.inventory.forEach(i=>{if(i.uid>mx)mx=i.uid;});
    for(const k in (G.player.equip||{})){ const it=G.player.equip[k]; if(it&&it.uid>mx)mx=it.uid; }
    for(const k in (G.player.flasks||{})){ const f=G.player.flasks[k]; if(f&&f.uid>mx)mx=f.uid; }
    if(itemUid<=mx) itemUid=mx+1;
  }catch(e){}
  /* 药水瓶与法力：旧存档补齐 */
  if(!G.player.flasks) G.player.flasks={hp:null, mp:null};
  if(!G.player.flasks.hp) G.player.flasks.hp=genFlask(0,'hp',true);
  if(!G.player.flasks.mp) G.player.flasks.mp=genFlask(0,'mp',true);
  if(typeof G.player.mp!=='number'){ const st=totalStats(); G.player.mp=Math.round(st.mp); }
  /* 装备/库存页签已合并为「背包」 */
  if(G.navTab==='equip'||G.navTab==='bag') G.navTab='char';
  /* 阶位命名分化（A方案）：旧档中带 armorType+tierIdx 的装备按新命名表重算名字（敕造专属除外，已穿戴不强制脱下） */
  try{
    const renameFix=function(it){ if(it && !it.type && !it.unique && it.armorType && it.tierIdx!=null){ it.name=equipName(it); } };
    (G.player.inventory||[]).forEach(renameFix);
    for(const k in (G.player.equip||{})) renameFix(G.player.equip[k]);
  }catch(e){}
  /* 武器重做：旧档中的 sword/axe/hammer 映射到新类名，并重算名字（去掉材质词） */
  try{
    const wmap={sword:'one_sword', axe:'one_axe', hammer:'warhammer'};
    const w=G.player.equip && G.player.equip.weapon;
    if(w && wmap[w.wType]){ w.wType=wmap[w.wType]; if(!w.unique) w.name=equipName(w); }
  }catch(e){}
  if(G.battle){ G.battle=null; G.battleTimer=null; } /* 刷新时清除残留战斗 */
  try{ syncMythicSkills(); }catch(e){} /* 敕令共鸣：读档后回填未录授予的绑定技能 */
  /* 技能槽系统兼容（v2.1）：旧档无 equippedSkills / equippedAuras 字段时，自动回填空数组。
     不会自动装填——需玩家手动从技能页装备技能。 */
  if(!Array.isArray(G.player.equippedSkills)) G.player.equippedSkills=[];
  if(!Array.isArray(G.player.equippedAuras)) G.player.equippedAuras=[];
  if(typeof G.player.whetstones!=='number') G.player.whetstones=0;
  if(!G.tower) G.tower = {highest:0, current:1, active:false};
  if(!Array.isArray(G.player.runes)) G.player.runes=[];
  G.player.runes = [];
}

function chooseTrait(key){

  pushLog('sys','🌟 特性已选定：'+(t.name||key), {hl:true, color:'#ff9f3a'});

  closeAwakening(); renderAll();

function useTraitStone(uid){
  if(!G.player || G.player.level<LEVEL_AWAKEN){ toast('需达到 Lv.'+LEVEL_AWAKEN+' 才能改换特性'); return; }

/* ==================== 怪物图鉴 ==================== */
/* 怪物→地图/类型 反查：MONSTERS 不存自身所属地图，由 MAPS 推导 */
const MONSTER_MAP = (function(){
  const m={};
  MAPS.forEach(function(mp,idx){
    mp.pool.forEach(function(k){ m[k]={mapIdx:idx, type:'normal'}; });
    if(mp.elite) m[mp.elite]={mapIdx:idx, type:'elite'};
    if(mp.boss) m[mp.boss]={mapIdx:idx, type:'boss'};
  });
  return m;
})();
const MONSTER_SKILL_LABEL = {dmg:'伤害', dot:'持续', buff:'增益', heal:'治疗'};
const FAMILY_LABELS = {polluted:'污染兽', humanoid:'人型', undead:'亡灵圣械', construct:'构装体', arcane:'秘术造物', nameless:'无名者', abyssal:'渊墨', drakeborn:'龙裔', sealbound:'敕印者', primordial:'初敕'};
const MONSTER_TYPE_BADGE = {normal:{t:'普通', c:'#8a8578'}, elite:{t:'精英', c:'#c79bff'}, boss:{t:'BOSS', c:'#ff6b5e'}};
function monSkillPool(type){
  if(type==='boss')  return {keys:['mboss_smash','mboss_quake','mboss_barrier','mboss_drain','mboss_wrath','mboss_decay'], lv:2};
  if(type==='elite') return {keys:['me_crush','me_venom','me_regen','me_fury','me_maul','mb_bite','mb_claw'], lv:2};
  return {keys:['mb_bite','mb_claw','mb_slam','mb_spit','mb_howl'], lv:1};
}
let BESTIARY_SEL = null;
function bestiaryDetailHTML(k){
  const def=MONSTERS[k]; if(!def) return '';
  const info=MONSTER_MAP[k]||{};
  const lore=MONSTER_LORE[k]||{};
  const idx=info.mapIdx;
  const mp=(typeof idx==='number'&&MAPS[idx])?MAPS[idx]:null;
  const ownSkills=MONSTER_SKILL_SET[k]||monSkillPool(info.type||'normal').keys;
  const skillLv=info.type==='boss'||info.type==='elite'?2:1;
  const badge=MONSTER_TYPE_BADGE[info.type]||MONSTER_TYPE_BADGE.normal;
  const fam=(FAMILY_LABELS&&FAMILY_LABELS[def.family])||def.family||'—';
  const lvl=mp?ML_map(idx):'?';
  const skillHTML=ownSkills.map(function(sk){
    const s=MONSTER_SKILLS[sk]; if(!s) return '';
    const lab=MONSTER_SKILL_LABEL[s.type]||s.type;
    const tip=esc(s.name)+' · '+lab+(s.desc?'：'+esc(s.desc):'');
    return '<span class="bs-chip" title="'+tip+'">'+esc(s.name)+
      ' <i style="opacity:.65;font-style:normal;font-size:10px;">'+lab+'</i></span>';
  }).join('');
  return '<div class="bsd-wrap">'+
    '<div class="bsd-img">'+monsterSVG(def,160)+'</div>'+
    '<div class="bsd-info">'+
      '<div class="bsd-name">'+esc(def.name)+' <span class="bs-badge" style="background:'+badge.c+'">'+badge.t+'</span> <span class="bs-fam">'+fam+'</span></div>'+
      '<div class="bsd-sub">刷出于 '+(mp?esc(mp.name):'—')+' · T'+(mp?mp.tier:'?')+' → Lv'+lvl+' · 技能等级 lv'+skillLv+'</div>'+
      '<div class="bsd-lore">'+
        (lore.height?'<div class="bs-row"><span class="bs-k">身长</span>'+esc(lore.height)+'</div>':'')+
        (lore.weight?'<div class="bs-row"><span class="bs-k">体重</span>'+esc(lore.weight)+'</div>':'')+
        (lore.trait?'<div class="bs-row"><span class="bs-k">特点</span>'+esc(lore.trait)+'</div>':'')+
        (lore.story?'<div class="bs-story">'+esc(lore.story)+'</div>':'')+
      '</div>'+
      '<div class="bsd-skills"><span class="bs-k">专属技能</span><br>'+skillHTML+'</div>'+
    '</div></div>';
}
function bestiarySelect(k){
  BESTIARY_SEL=k;
  const d=document.getElementById('bsDetail');
  if(d){
    if(G.seenMonsters && G.seenMonsters.indexOf(k)>=0){ d.innerHTML=bestiaryDetailHTML(k); }
    else { d.innerHTML='<div class="bsd-locked">🔒 尚未遭遇该怪物，击败后自动收录至图鉴。</div>'; }
  }
  const cells=document.querySelectorAll('.bs-cell');
  for(let i=0;i<cells.length;i++) cells[i].classList.remove('bs-cell-sel');
  const el=document.querySelector('.bs-cell[data-k="'+k+'"]');

}
function tabBestiary(){
  if(!MONSTER_LORE) return '<p style="color:var(--dim)">图鉴数据未加载</p>';
  const seen=G.seenMonsters||[];
  const total=Object.keys(MONSTERS).length;
  const cnt=Object.keys(MONSTER_MAP).filter(function(k){ return seen.indexOf(k)>=0; }).length;
  const firstSeen=Object.keys(MONSTER_MAP).find(function(k){ return seen.indexOf(k)>=0; });
  BESTIARY_SEL=firstSeen||null;
  const groups=MAPS.map(function(mp,idx){
    const keys=Object.keys(MONSTER_MAP).filter(function(k){ return MONSTER_MAP[k].mapIdx===idx; });
    if(!keys.length) return '';
    const cells=keys.map(function(k){
      const def=MONSTERS[k]; if(!def) return '';
      const info=MONSTER_MAP[k];
      const badge=MONSTER_TYPE_BADGE[info.type]||MONSTER_TYPE_BADGE.normal;
      const isSeen=seen.indexOf(k)>=0;
      const selCls=(k===firstSeen)?' bs-cell-sel':'';
      if(!isSeen){
        return '<div class="bs-cell locked" data-k="'+k+'"><div class="bs-cell-emoji">❓</div><div class="bs-cell-name">？？？</div></div>';
      }
      return '<div class="bs-cell'+selCls+'" data-k="'+k+'" onclick="bestiarySelect(\''+k+'\')">'+
        '<div class="bs-cell-emoji">'+monsterSVG(def,56,false,true)+'</div>'+
        '<div class="bs-cell-name">'+esc(def.name)+'</div>'+
        '<div class="bs-cell-badge" style="background:'+badge.c+'">'+badge.t+'</div>'+
      '</div>';
    }).join('');
    return '<div class="bs-group"><div class="bs-group-h">📍 '+esc(mp.name)+
      ' <span style="color:var(--dim);font-size:12px;font-weight:400;">T'+mp.tier+' · 刷出 Lv'+ML_map(idx)+'</span></div>'+
      '<div class="bs-grid">'+cells+'</div></div>';
  }).join('');
  return '<h3 style="color:var(--gold-soft);font-size:15px;margin-bottom:4px;">📖 怪物图鉴</h3>'+
    '<p style="color:var(--dim);font-size:12px;margin-bottom:12px;">已收录 '+cnt+' / '+total+' 种 · 击败怪物自动收录，未遭遇显示「？？？」</p>'+
    '<div class="bs-layout">'+
      '<div class="bs-list">'+groups+'</div>'+
      '<div class="bs-detail" id="bsDetail">'+(firstSeen?bestiaryDetailHTML(firstSeen):'<div class="bsd-hint">👈 点选左侧怪物查看全貌</div>')+'</div>'+
    '</div>';
}

  '</div>';

  html+='</div>';
  html+='<div class="bag-main">';

var bagCats=[['equip','\u88c5\u5907',equips.length],['book','\u6280\u80fd\u4e66',books.length],['flask','\u836f\u6c34',flasks.length],['stone','\u7279\u6027\u77f3',stones.length]];

const STAT_LABEL = {atk:'攻击', def:'防御', hp:'生命', spd:'攻速', crit:'暴击',
  critP:'攻击暴击', critS:'法术暴击', critDmg:'暴击伤害', str:'力量', agi:'敏捷', int:'智力',
  lifesteal:'吸血', dmgReduce:'减伤', goldFind:'财富'};
const PCT_STATS = ['crit','critP','critS','critDmg','lifesteal','dmgReduce','goldFind'];
function statText(k,v){
  if(PCT_STATS.indexOf(k)>=0) return (STAT_LABEL[k]||k)+' '+(v*100).toFixed(0)+'%';
  return (STAT_LABEL[k]||k)+' '+v;
}
function cmpColHTML(it, title, titleColor){

    '<div class="cmp-sub">未装备</div></div>';

  h+='<div class="cmp-line" style="color:'+ro.color+';font-weight:600;">'+esc(it.name)+'</div>';
  h+='<div class="cmp-sub">'+(it.rarityName||ro.name)+
     (it.wType&&WEAPON_TYPES[it.wType]?' · '+WEAPON_TYPES[it.wType].name:'')+
     (it.armorType&&ARMOR_TYPES[it.armorType]?' · '+ARMOR_TYPES[it.armorType].name:'')+'</div>';
  for(const k in (it.base||{})) h+='<div class="cmp-line">'+statText(k,it.base[k])+'</div>';
  (it.affixes||[]).forEach(a=>{ h+='<div class="cmp-line" style="color:var(--green)">· '+esc(a.name)+'</div>'; });
  if(it.setId&&SETS[it.setId]) h+='<div class="cmp-sub">套装：'+SETS[it.setId].name+'</div>';
  const reqs=[];
  if(it.reqLv) reqs.push('Lv'+it.reqLv);
  if(it.reqStr) reqs.push('力'+it.reqStr);
  if(it.reqAgi) reqs.push('敏'+it.reqAgi);
  if(it.reqInt) reqs.push('智'+it.reqInt);
  if(it.reqCon) reqs.push('体'+it.reqCon);
  if(it.reqSpi) reqs.push('精'+it.reqSpi);
  if(reqs.length) h+='<div class="cmp-sub" style="margin-top:3px;">需求：'+reqs.join(' / ')+'</div>';
  h+='</div>';
  return h;
}

function moveCmp(ev){
  const el=document.getElementById('cmpTip'); if(!el||el.style.display==='none') return;
  const pad=14, w=el.offsetWidth, h=el.offsetHeight;
  let x=ev.clientX+pad, y=ev.clientY+pad;
  if(x+w>window.innerWidth-8) x=ev.clientX-w-pad;
  if(y+h>window.innerHeight-8) y=Math.max(8, window.innerHeight-h-8);
  el.style.left=x+'px'; el.style.top=y+'px';
}

    var v=val||0, p=v*100, disp=p>=10?p.toFixed(0):p.toFixed(1);
    return csRow(icon,label,disp+'%',color);

function repairAll(){
  var cost=0,count=0;
  for(const slot in G.player.equip){const it=G.player.equip[slot];if(it&&it.wear>0){count++;cost+=RARITY.findIndex(r=>r.key===it.rarity)*20+50;it.wear=0;}}
  if(count===0){toast('装备无需修理');return;}
  if(G.player.gold<cost){toast('金币不足（需 '+cost+'）');for(const s2 in G.player.equip){const i2=G.player.equip[s2];if(i2)i2.wear=Math.max(0,(i2.wear||0)-10);}return;}
  G.player.gold-=cost;pushLog('sys','⚒ 修理 '+count+' 件装备，花费 '+cost+' 金币',{color:'#c9a227'});save();renderAll();
}
function tabForge(){
  const ft=(G.forge&&G.forge.tab)||'decomp';
  let html='<h3 style="color:var(--gold-soft);font-size:15px;margin-bottom:12px;">🔨 锻造铺</h3>';
  /* 一键修理 */
  var anyWear=false; for(const sl in G.player.equip){if(G.player.equip[sl]&&G.player.equip[sl].wear>0){anyWear=true;break;}}
  if(anyWear){
    var maxWear=0, worstItem=''; for(const s2 in G.player.equip){const i2=G.player.equip[s2];if(i2&&i2.wear>maxWear){maxWear=i2.wear;worstItem=i2.name;}}
    html+='<div style="background:var(--panel2);border:1px solid '+(maxWear>=50?'var(--orange)':'var(--line)')+';border-radius:10px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:8px;">'+

    const cost1Txt=cost1?Object.keys(cost1.shards).map(t=>SHARD_TYPES[t].icon+SHARD_TYPES[t].name+cost1.shards[t]).join(' ')+' · 💰'+cost1.gold:'—';
    /* 显示当前词缀列表，单词条重铸随机替换其中一个 */

      '<div class="di-icon" style="color:'+ri.color+'">'+itemBadgeSVG(it,30)+'</div>'+
      '<div class="di-name" style="color:'+ri.color+'">'+it.name+'<span style="color:var(--dim);font-size:10px;"> · '+o.where+'</span>'+
        '<div style="font-size:9.5px;margin-top:3px;">'+affTxt+'</div></div>'+

        '<button class="btn btn-sm '+(ok1?'btn-purple':'')+'" '+(ok1?'':'disabled')+' onclick="doReforgeOne('+it.uid+')" title="随机刷新一个词条，材料翻倍">单词条</button>'+
      '</div></div>';
  });
  html+='</div>';
  return html;
}




function rollRuneDrop(rarity){
  if(!rarity) rarity = Math.random()<0.6?'normal':(Math.random()<0.7?'rare':'epic');
  var keys=Object.keys(RUNE_TYPES), k=keys[rand(0,keys.length-1)];
  var r={type:k, rarity:rarity, val:RUNE_TYPES[k].vals[rarity]||0.03};
  G.player.runes.push(r);
  pushLog('sys','💎 获得'+RUNE_RARITY[rarity].name+'符文【'+RUNE_TYPES[k].icon+' '+RUNE_TYPES[k].name+'】',{color:RUNE_TYPES[k].color});
}
function socketEquip(it){

  if(it.socketOpen){toast('该装备已开孔');return;}
  if(matGet('refined')<5){toast('需要精炼印屑×5');return;}

}
function embedRune(it, runeIdx){
  if(!it||!it.socketOpen){toast('请先开凿符文孔');return;}
  if(!Array.isArray(it.runes)) it.runes=[];
  if(it.runes.length>=1){toast('已有符文，将覆盖（旧符文销毁）');}
  var r=G.player.runes[runeIdx]; if(!r) return;
  it.runes=[r]; G.player.runes.splice(runeIdx,1);
  pushLog('sys','💎 '+'镶嵌'+RUNE_TYPES[r.type].icon+' '+RUNE_TYPES[r.type].name+'至 '+it.name); save(); renderContent();
}
function runeComboEffect(){
  var cnt={}; for(var s in G.player.equip){var it=G.player.equip[s]; if(it&&it.runes&&it.runes.length>0){var t=it.runes[0].type; cnt[t]=(cnt[t]||0)+1;}}
  var eff={atk:0,spd:0,skillDmg:0,lifesteal:0,cdr:0,dmgReduce:0,spdPct:0};
  for(var t in cnt){ var n=cnt[t], rt=RUNE_TYPES[t]; if(!rt) continue;
    var m=n>=7?2.5:n>=5?2.0:n>=3?1.5:1;
    eff[rt.stat]=(eff[rt.stat]||0)+rt.vals.epic*m; /* 取最高品质值×组合倍率 */
  }
  return eff;
}

const TOWER_EQUIPS = [
  {floor:5,  slot:"hands",name:"试炼者护手",rarity:"rare"},
  {floor:10, slot:"feet", name:"试炼者之靴",rarity:"rare"},
  {floor:15, slot:"head", name:"试炼者头环",rarity:"epic"},
  {floor:20, slot:"amulet",name:"试炼者牌符",rarity:"epic"},
  {floor:25, slot:"ring",  name:"试炼者印戒",rarity:"epic"},
  {floor:30, slot:"weapon",name:"试炼者终末",rarity:"legendary"},
];
function towerUnlocked(){ return G.unlocked>0||(G.gradeGate&&G.gradeGate.passedTier>0); }
function towerEnemy(floor){
  var scale=1+floor*0.05;
  var hp=Math.round((30+floor*12)*scale), atk=Math.round((8+floor*2.5)*scale);
  return {name:"试炼层"+floor+"守卫",emoji:"⚔️",hp:hp,atk:atk,def:Math.round((4+floor)*scale),
    matk:Math.round(atk*0.6),mdef:Math.round((3+floor*0.7)*scale),spd:8+Math.floor(floor/2),
    crit:0.05+floor*0.003,hit:0.85,eva:0.05,isBoss:(floor%5===0),isElite:(floor%5!==0&&floor>=3)};
}
function startTower(){
  if(!towerUnlocked()){toast("击败任意BOSS后方可进入试炼塔");return;}
  G.tower.current=G.tower.current||1; G.tower.active=true;
  var floor=G.tower.current, en=towerEnemy(floor);
  pushLog("sys","🗼 进入试炼塔第 "+floor+" 层");
  startBattle(en,"试炼塔第"+floor+"层");
}
function towerEndBattle(){
  if(!G.tower||!G.tower.active) return;
  var b=G.battle; if(!b||b.result!=="win") {
    G.tower.active=false; G.player.hp=Math.round(totalStats().hp*0.2);
    G.player.mp=Math.round(totalStats().mp*0.3);
    pushLog("sys","☠️ 试炼失败，止步第 "+G.tower.current+" 层",{hl:true,color:"var(--crimson)"});
    G.tower.current=1; save(); return;
  }
  var floor=G.tower.current;
  var gold=Math.round(rand(8+floor*3,15+floor*4)*(1+(totalStats().goldFind||0)));
  G.player.gold+=gold; pushLog("sys","💰 获得 "+gold+" 金币",{color:"#c9a227"});
  TOWER_EQUIPS.forEach(function(te){
    if(te.floor===floor){ var it=genEquip(Math.min(9,Math.floor(floor/3)),te.rarity,te.slot); it.name=te.name;
      G.player.inventory.push(it); var ro=rarObj(it.rarity)||RARITY[0];
      pushLog("sys","🗼 获得塔专属装备【"+it.name+"】",{hl:true,color:ro.color}); }
  });
  G.tower.current++; if(G.tower.current>G.tower.highest) G.tower.highest=G.tower.current-1;
  G.player.hp=Math.min(Math.round(totalStats().hp*0.95),Math.round(G.player.hp+totalStats().hp*0.3));
  G.player.mp=Math.min(Math.round(totalStats().mp*0.95),Math.round(G.player.mp+totalStats().mp*0.5));
  save();
  G.battle=null; if(G.battleTimer){clearInterval(G.battleTimer);G.battleTimer=null;}
  setTimeout(function(){ if(G.tower.active) startTower(); },600);
}
function towerQuit(){ G.tower.active=false; G.tower.current=1; save(); showNormalView(); pushLog("sys","🚪 退出试炼塔"); }

/* 行动读条：ATB 蓄力进度（time/100），攻速/施法速度越快涨得越快 */
function castBarHTML(u,isPlayer){
  const pct=Math.max(0,Math.min(100,u.time||0));
  let label='普通攻击';
  if(isPlayer&&u.skills&&u.skills.length){
    const rd=u.skills.filter(sk=>sk.cd<=0&&u.mp>=sk.cost).sort((a,b)=>(b.def.mult||0)-(a.def.mult||0));
    if(rd.length) label='技能 · '+rd[0].def.name;
  }
  return '<div class="cast-wrap">'+
    '<div class="cast-bar"><div class="cast-fill'+(isPlayer?'':' cast-enemy')+'" style="width:'+pct+'%"></div></div>'+
    '<div class="cast-label">'+label+' · '+Math.round(pct)+'%</div></div>';
}

/* 战斗单位增益图标条：独立 SVG 图标 + 剩余回合数角标 */
function buffBarHTML(u){
  if(!u || !u.buffs || !u.buffs.length) return '';
  const NAME={atkBoost:'攻击提升',spdBoost:'攻速提升',slow:'迟缓',vuln:'易伤',dot:'持续伤害',shield:'护盾',stun:'眩晕',atkDown:'攻击削弱',noHeal:'禁疗'};
  const ICON={atkBoost:'buff_atk',spdBoost:'buff_spd',slow:'buff_slow',vuln:'buff_vuln',dot:'buff_dot',shield:'buff_shield',stun:'stun',atkDown:'buff_atk',noHeal:'wither_curse'};
  const items=u.buffs.map(function(b){
    const k=ICON[b.type]||'buff_atk';
    const t=(b.turns!=null)?b.turns:'';
    const nm=NAME[b.type]||b.type;
    return '<div class="buff-ico" title="'+esc(nm)+(t!==''?'（'+t+'回合）':'')+'">'+svgIcon(k,13)+
      (t!==''?'<span class="bt">'+t+'</span>':'')+'</div>';
  }).join('');
  return '<div class="buff-bar">'+items+'</div>';
}

/* ==================== 战斗屏渲染（多敌双栏） ==================== */
function renderSkillBar(b){
  const p=b.player, es=G.player.equippedSkills||[], ea=G.player.equippedAuras||[];
  let html='<div class="skill-bar battle-skillbar-wrap">';
  /* 5 主动技能 */
  for(let i=0;i<5;i++){
    const id=es[i];
    if(id){
      const def=SKILLS[id];
      const sk=p.skills?p.skills.find(function(s){return s.id===id;}):null;
      const cd=sk?sk.cd:0, cdBase=sk?(sk.cdBase||def.cd):def.cd;
      const cdPct=cd>0?Math.round(cd/cdBase*360):0;
      html+='<div class="skill-slot" title="'+def.name+' Lv'+(sk?sk.lv:0)+' CD'+def.cd+'回→'+(sk?sk.cd:0)+'">'+
        (def.icon||'✨')+
        (cd>0?'<div class="cd-ring active" style="--cd-pct:'+cdPct+'deg"></div>':'')+
        (cd>0?'<div class="cd-text">'+cd+'</div>':'')+
      '</div>';
    } else {
      html+='<div class="skill-slot empty" title="空槽位"></div>';
    }
  }
  /* 分隔 */
  html+='<div style="width:2px;height:30px;background:var(--line);margin:0 4px;flex-shrink:0"></div>';
  /* 2 光环 */
  for(let i=0;i<2;i++){
    const id=ea[i];
    if(id){
      const def=SKILLS[id];
      html+='<div class="skill-slot aura" title="'+def.name+'（光环·常驻生效）">'+
        (def.icon||'🌟')+
        '<div class="aura-ring"></div>'+
      '</div>';
    } else {
      html+='<div class="skill-slot empty aura" title="空光环槽"></div>';
    }
  }
  html+='</div>';
  return html;
}

/* 战斗只读背包（需求2）：展示身上穿戴 + 背包 + 最近掉落，不可更换 */
function openBattleBag(){
  const worn=[];
  Object.keys(G.player.equip).forEach(function(slot){
    const it=G.player.equip[slot]; if(it) worn.push(esc(it.name));
  });
  const inv=G.player.inventory.map(function(it){
    if(it.type==='book') return '📖 '+esc(it.name);
    if(it.type==='flask') return '🧪 '+esc(it.name);
    return '🛡️ '+esc(it.name||'装备');
  });
  let html='<div class="bb-section"><div class="bb-h">身上穿戴</div>'+(worn.length?worn.join('、'):'（无）')+'</div>'+
    '<div class="bb-section"><div class="bb-h">背包物品（'+inv.length+'）</div>'+(inv.length?inv.join('、'):'（空）')+'</div>';
  if(G.lastLoot){
    const loot=G.lastLoot, ls=[];
    if(loot.gold) ls.push('💰'+loot.gold);
    if(loot.materials) ls.push('🪨'+loot.materials);
    loot.items.forEach(it=>ls.push('🛡️'+it.name));
    loot.books.forEach(sk=>ls.push('📖'+SKILLS[sk].name));
    (loot.flasks||[]).forEach(f=>ls.push('🧪'+f.name));
    html+='<div class="bb-section"><div class="bb-h">最近掉落</div>'+(ls.length?ls.join('、'):'（无）')+'</div>';
  }
  html+='<div style="text-align:center;margin-top:16px;"><button class="btn btn-sm" onclick="closeBattleBag()">关闭</button></div>';
  const overlay=document.createElement('div'); overlay.id='battleBagModal'; overlay.className='bag-modal';
  overlay.innerHTML='<div class="bag-modal-box">'+html+'</div>';
  overlay.onclick=function(e){ if(e.target===overlay) closeBattleBag(); };
  document.body.appendChild(overlay);
}
function closeBattleBag(){ const m=document.getElementById('battleBagModal'); if(m) m.remove(); }

/* ==================== 悬浮战斗日志 ==================== */
var _flDrag=false, _flW=320, _flH=180, _flCollapsed=false;
function floatLogShow(){ const el=document.getElementById('floatLog'); el.classList.add('show'); el.style.width=_flW+'px'; el.style.height=_flH+'px'; }
function floatLogHide(){ document.getElementById('floatLog').classList.remove('show'); }
function floatLogToggle(){
  _flCollapsed=!_flCollapsed;
  const el=document.getElementById('floatLog');
  const min=el.querySelector('.fl-min');
  if(_flCollapsed){ el.classList.add('collapsed'); min.textContent='+'; }
  else{ el.classList.remove('collapsed'); min.textContent='−'; floatLogApplySize(); }
}
function floatLogApplySize(){
  const el=document.getElementById('floatLog');
  el.style.width=_flW+'px'; el.style.height=_flH+'px';
}
function floatLogResizeStart(e){
  _flDrag=true; e.preventDefault();
  document.addEventListener('mousemove', floatLogResizeMove);
  document.addEventListener('mouseup', floatLogResizeEnd);
}
function floatLogResizeMove(e){
  if(!_flDrag) return;
  _flW=Math.max(200, Math.min(window.innerWidth*.5, e.clientX-12));
  _flH=Math.max(100, Math.min(window.innerHeight*.55, e.clientY-12));
  floatLogApplySize();
}
function floatLogResizeEnd(){ _flDrag=false;
  document.removeEventListener('mousemove', floatLogResizeMove);
  document.removeEventListener('mouseup', floatLogResizeEnd);
}
/* 把 battleLog 内容灌入悬浮窗 */
function floatLogRender(){
  if(_flCollapsed) return;
  const flEl=document.getElementById('flBody');
  if(!flEl) return;
  flEl.innerHTML=G.log.slice(-50).map(function(l){
    const cls='log-'+(l.side==='sys'?'s':l.side==='player'?'p':'e')+(l.hl?' log-hl':'');
    const inner=l.color?'<span style="color:'+l.color+';font-weight:700;">'+l.text+'</span>':l.text;
    return '<div class="'+cls+'">'+inner+'</div>';
  }).join('');
  flEl.scrollTop=flEl.scrollHeight;
}
function toggleFold(key){
  G.folds[key]=!G.folds[key];
  const el=document.getElementById('sec_'+key);
  const arr=document.getElementById('arr_'+key);
  if(el) el.style.display=G.folds[key]?'none':'';
  if(arr) arr.classList.toggle('open',G.folds[key]!==false);
}

function showErrBanner(msg){
  let b=document.getElementById('errBanner');
  if(!b){
    b=document.createElement('div');
    b.id='errBanner';
    b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#c0392b;color:#fff;font:13px/1.6 monospace;padding:10px 14px;white-space:pre-wrap;box-shadow:0 2px 12px rgba(0,0,0,.5)';
    (document.body||document.documentElement).appendChild(b);
  }
  b.textContent='⚠ 运行错误：'+(msg||'未知错误')+'  （请把这行红字发给我）';
}
window.onerror=function(m,src,line,col){ showErrBanner((m||'未知错误')+(line?(' @行'+line+':'+col):'')); return false; };

/* ==================== 教程引导系统 ==================== */
var _tutIdx=0, _tutSteps=[], _tutActive=false;
const TUT_STEPS = [
  {sel:'#sbRightBody', tab:'char', msg:'这是你的角色面板。每个属性都有清晰的颜色标注——力量/敏捷/智力决定了你能使用的武器和技能强度。\n\n每升一级获得属性点，可自由分配。'},
  {sel:'#sbRightBody', tab:'skills', msg:'技能页面顶部有5个主动技能槽和2个光环槽。\n\n点击已学技能的"装备"按钮，将其放入槽位。战斗中只会使用你已装备的技能。'},
  {sel:'#sbRightBody', tab:'bag', msg:'背包是装备管理中心。顶部的"身上装备"展示当前穿戴——点击任意一件可在右侧查看详情并卸下。\n\n下方的分类标签可切换装备/技能书/药水。'},
  {sel:'#sidebarLeft', tab:'map', msg:'地图界面选择你想挑战的区域。进入战斗后自动连战——击败普通怪物升级，击败精英获得高品质装备，击败 BOSS 解锁下一张地图。'},
  {sel:'#centerArea', tab:null, msg:'这是主战斗区。进入关卡后，下方显示敌方怪物（可能多只），右下角技能栏用环形动画显示 CD 冷却状态。\n\n击杀怪物立刻获得经验和道具，不必担心中途战败白打。'},
];
function tutEl(id){ return document.getElementById(id); }
function tutorialHide(){ tutEl('tutOverlay').style.display='none'; }
function tutorialShow(){ tutEl('tutOverlay').style.display='block'; }
function tutorialSkip(){
  tutorialHide(); localStorage.setItem('edict_tutorial_done','1');
  localStorage.setItem('edict_forge_tutorial_done','1'); _tutActive=false;
}
function tutorialStart(){
  _tutIdx=0; _tutActive=true;
  tutorialShow(); tutorialRender();
}
/* 重看教程：绕过 done 标记，便于测试 */
function tutorialReplay(){
  try{ localStorage.removeItem('edict_tutorial_done'); }catch(e){}
  _tutIdx=0; _tutActive=true;
  tutorialShow(); tutorialRender();
}
function tutorialNext(){
  _tutIdx++;
  if(_tutIdx>=TUT_STEPS.length){ tutorialSkip(); return; }
  tutorialRender();
}
function tutorialRender(){
  const st=TUT_STEPS[_tutIdx];
  /* 切换标签 */
  if(st.tab){
    if(st.tab==='map'){ G.navTab='map'; }
    else if(st.tab==='skills'){ G.navTab='skills'; }
    else if(st.tab==='bag'){ G.navTab='char'; charSubTab='bag'; }
    else if(st.tab==='char'){ G.navTab='char'; charSubTab='stats'; }
    renderAll();
  }
  const bub=tutEl('tutBubble');
  const el=document.querySelector(st.sel);
  const r=el?el.getBoundingClientRect():null;
  const valid=el && r && r.width>0 && r.height>0;
  /* 先重置四遮罩（兜底：避免上次布局残留） */
  ['tutTop','tutBot','tutLeft','tutRight'].forEach(function(id){ tutEl(id).style.display=''; });
  if(valid){
    const shTop=Math.max(0,r.top-2), shBot=r.top+r.height+2, shLeft=Math.max(0,r.left-2), shRight=r.left+r.width+2;
    tutEl('tutTop').style.cssText='top:0;left:0;right:0;height:'+shTop+'px';
    tutEl('tutBot').style.cssText='top:'+shBot+'px;left:0;right:0;bottom:0';
    tutEl('tutLeft').style.cssText='top:'+shTop+'px;left:0;width:'+shLeft+'px;height:'+(shBot-shTop)+'px';
    tutEl('tutRight').style.cssText='top:'+shTop+'px;left:'+shRight+'px;right:0;height:'+(shBot-shTop)+'px';
    /* 气泡位置：右侧 → 下方 → 左侧回退 */
    if(shRight+340<window.innerWidth-20){
      bub.style.cssText='top:'+Math.max(20,shTop-20)+'px;left:'+(shRight+16)+'px';
    } else if(shBot+260<window.innerHeight-20){
      bub.style.cssText='top:'+(shBot+12)+'px;left:'+Math.max(20,shLeft)+'px';
    } else {
      bub.style.cssText='top:'+Math.max(20,r.top-260)+'px;left:'+Math.max(20,shLeft)+'px';
    }
  } else {
    /* 兜底：目标拿不到时整屏变暗 + 气泡居中，不挖错位洞 */
    tutEl('tutTop').style.cssText='top:0;left:0;right:0;bottom:0';
    tutEl('tutBot').style.display='none';
    tutEl('tutLeft').style.display='none';
    tutEl('tutRight').style.display='none';
    bub.style.cssText='top:50%;left:50%;transform:translate(-50%,-50%)';
  }
  tutEl('tutStep').textContent=(_tutIdx+1)+'/'+TUT_STEPS.length;
  tutEl('tutText').textContent=st.msg;
  tutEl('tutNextBtn').textContent=_tutIdx>=TUT_STEPS.length-1?'完成':'下一步 →';
}
/* 锻造教学（动态触发） */
function forgeTutorialMaybe(){
  if(localStorage.getItem('edict_forge_tutorial_done')==='1') return;
  const m=G.player.materials||{};
  const has=m.refined>0||m.blue>0||m.purple>0||m.orange>0;
  if(!has) return;
  if(_tutActive){ tutorialSkip(); } /* 冲突时先关掉前一个 */
  _tutIdx=-1; _tutActive=true;
  G.navTab='forge'; renderAll();
  setTimeout(function(){
    const el=document.querySelector('#centerArea');
    if(el){
      tutorialShow();
      const r=el.getBoundingClientRect();
      tutEl('tutTop').style.cssText='top:0;left:0;right:0;height:'+(r.top-2)+'px';
      tutEl('tutBot').style.cssText='top:'+(r.top+r.height+2)+'px;left:0;right:0;bottom:0';
      tutEl('tutLeft').style.cssText='top:'+(r.top-2)+'px;left:0;width:'+(r.left-2)+'px;height:'+(r.height+4)+'px';
      tutEl('tutRight').style.cssText='top:'+(r.top-2)+'px;left:'+(r.left+r.width+2)+'px;right:0;height:'+(r.height+4)+'px';
      tutEl('tutBubble').style.cssText='bottom:80px;left:50%;transform:translateX(-50%)';
      tutEl('tutStep').textContent='锻造';
      tutEl('tutText').textContent='击杀怪物可获得印屑碎片。在锻造铺可以用碎片锻造新装备，或重铸已有装备的词缀。消耗更高品质的碎片可提升装备稀有度，是后期提升战力的核心途径。';
      tutEl('tutNextBtn').textContent='知道了';
      tutEl('tutNextBtn').onclick=function(){ tutorialSkip(); localStorage.setItem('edict_forge_tutorial_done','1'); };
    }
  },400);
}
/* 窗口resize时重新定位遮罩 */
window.addEventListener('resize',function(){ if(_tutActive) tutorialRender(); });

/* ==================== 管理员调试面板（F2 开关） ==================== */
let _dbgVisible = false;
function dbgToggle(){
  _dbgVisible = !_dbgVisible;
  const el = document.getElementById('debugPanel');
  if(el) el.style.display = _dbgVisible ? 'block' : 'none';
}
document.addEventListener('keydown', function(e){ if(e.key==='F2'){ e.preventDefault(); dbgToggle(); } });

function dbgCmd(cmd, val){
  if(!G || !G.player) return;
  switch(cmd){
    case 'gold': G.player.gold += (val||10000); toast('💰 金币 +'+(val||10000)); break;
    case 'level': G.player.level = Math.min(MAX_LEVEL, Math.max(1, val||10)); G.player.exp=0; G.player.attrPoints += (G.player.level-1)*2; G.player.hp=totalStats().hp; toast('📈 等级设为 ' + G.player.level); if(G.player.level>=LEVEL_AWAKEN && !G.player.trait) maybeAwaken(); break;
    case 'level60': G.player.level=MAX_LEVEL; G.player.exp=0; G.player.attrPoints=118; G.player.str=10;G.player.agi=10;G.player.con=10;G.player.int=10;G.player.spi=10; G.player.hp=totalStats().hp; toast('📈 已升至满级 Lv60，118 点自由属性'); if(!G.player.trait) maybeAwaken(); break;
    case 'mats': const m=G.player.materials; m.common+=50; m.refined+=30; m.blue+=20; m.purple+=10; m.orange+=5; toast('🔧 材料 +50/30/20/10/5'); break;
    case 'unlock': G.unlocked = Math.min(MAPS.length-1, G.unlocked+1); toast('🗺 解锁至地图 ' + G.unlocked); break;
    case 'godmode': G.player._godMode = !G.player._godMode; toast(G.player._godMode?'👑 无敌模式 开':'👑 无敌模式 关'); break;
    case 'clearInv': G.player.inventory=[]; G.player.runes=[]; toast('🗑 清空背包'); break;
    case 'respec': G.player.str=10; G.player.agi=10; G.player.con=10; G.player.int=10; G.player.spi=10; G.player.attrPoints=G.player.level*3; toast('🔄 属性已重置'); break;
    case 'unlockbest': if(!G.seenMonsters) G.seenMonsters=[]; Object.keys(MONSTER_MAP).forEach(function(k){ if(G.seenMonsters.indexOf(k)<0) G.seenMonsters.push(k); }); save(); toast('📖 图鉴已全解锁'); break;
  }
  renderAll();
}
