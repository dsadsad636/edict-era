<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📜 敕印 · 持牌者</title>
<style>
/* ==================== 全局 & 星空主题 ==================== */
:root{
  --bg:#08090f; --panel:#0e101a; --panel2:#141724; --panel3:#1a1e30;
  --line:#252b42; --gold:#c9a227; --gold-soft:#e7cd7a; --crimson:#c0392b;
  --ink:#d9d4c8; --dim:#6b7085; --blue:#4a9eff; --green:#45d98e;
  --purple:#b06bff; --orange:#ff9f3a; --red:#e6443b; --str-color:#e85d4c; --agi-color:#45d98e; --int-color:#4a9eff;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%; overflow:hidden;}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; font-size:13px; line-height:1.5;
  /* 星空背景 */
  background-image:
    radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,.6) 0, transparent 100%),
    radial-gradient(1px 1px at 35% 8%, rgba(255,255,255,.4) 0, transparent 100%),
    radial-gradient(1.5px 1.5px at 55% 25%, rgba(201,162,39,.5) 0, transparent 100%),
    radial-gradient(1px 1px at 72% 12%, rgba(255,255,255,.5) 0, transparent 100%),
    radial-gradient(1px 1px at 88% 20%, rgba(74,158,255,.4) 0, transparent 100%),
    radial-gradient(1px 1px at 18% 65%, rgba(255,255,255,.3) 0, transparent 100%),
    radial-gradient(1.5px 1.5px at 48% 78%, rgba(176,107,255,.4) 0, transparent 100%),
    radial-gradient(1px 1px at 82% 68%, rgba(255,255,255,.4) 0, transparent 100%),
    radial-gradient(1px 1px at 95% 55%, rgba(69,217,142,.3) 0, transparent 100%),
    radial-gradient(600px 400px at 50% -10%, #15182a 0%, var(--bg) 70%);
}
#app{display:grid; height:100vh; grid-template-columns:220px 1fr 300px; grid-template-rows:auto 1fr;
  grid-template-areas:"topbar topbar topbar" "left center right";}

/* ==================== 顶栏 ==================== */
#topbar{
  display:flex; align-items:center; gap:14px; padding:8px 16px;
  border-bottom:1px solid var(--line); background:rgba(14,16,26,.92);
  backdrop-filter:blur(8px); z-index:10;
}
.brand{font-size:17px; font-weight:700; color:var(--gold-soft); letter-spacing:3px;
  text-shadow:0 0 12px rgba(201,162,39,.3);}
.player-tag{
  display:flex; align-items:center; gap:8px; padding:4px 12px 4px 8px;
  border:1px solid var(--line); border-radius:20px; background:var(--panel2);
}
.avatar-icon{font-size:22px;}
.tag-name{color:var(--gold-soft); font-weight:600; font-size:13px;}
.tag-progress{color:var(--dim); font-size:11px;}
.top-actions{margin-left:auto; display:flex; gap:6px;}

/* 按钮通用 */
.btn{
  background:linear-gradient(180deg, var(--panel2) 0%, var(--panel) 100%); color:var(--ink);
  border:1px solid var(--line); padding:7px 16px; border-radius:8px;
  cursor:pointer; font-size:13px; letter-spacing:.5px;
  transition:all .15s; user-select:none; position:relative;
}
.btn::after{
  content:''; position:absolute; inset:1px 1px auto 1px; height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
  border-radius:6px 6px 0 0; pointer-events:none;
}
.btn:hover{border-color:var(--gold); color:var(--gold-soft); transform:translateY(-1px); box-shadow:0 3px 12px rgba(0,0,0,.3);}
.btn:active{transform:translateY(0);}
.btn.on{background:linear-gradient(180deg,#d4a82a,#a07818); color:#1a1208; border-color:#e8c840; font-weight:700; box-shadow:0 2px 10px rgba(201,162,39,.25);}
.btn.on::after{background:linear-gradient(90deg, transparent, rgba(255,255,255,.15), transparent);}
.btn.danger{background:rgba(192,57,43,.12); border-color:rgba(192,57,43,.35); color:var(--crimson);}
.btn.danger:hover{background:rgba(192,57,43,.22); border-color:var(--crimson); color:#ff7060;}
.btn-sm{padding:4px 12px; font-size:12px; border-radius:6px;}
.btn-red{background:linear-gradient(180deg,#c0392b,#96281b); color:#fff; border:none; box-shadow:0 2px 8px rgba(192,57,43,.3);}
.btn-blue{background:linear-gradient(180deg,#2980b9,#1a5276); color:#fff; border:none; box-shadow:0 2px 8px rgba(41,128,185,.3);}
.btn-purple{background:linear-gradient(180deg,#8e44ad,#6c3483); color:#fff; border:none; box-shadow:0 2px 8px rgba(142,68,173,.3);}
.btn-green{background:linear-gradient(180deg,#27ae60,#1e8449); color:#fff; border:none; box-shadow:0 2px 8px rgba(39,174,96,.3);}

/* ==================== 主区（三栏布局） ==================== */
#main{display:contents;}
#topbar{grid-area:topbar;}
#sidebarLeft{grid-area:left;}
#centerArea{grid-area:center; min-height:0;}
#sidebarRight{grid-area:right;}
#chatDock{display:none;}
#app.battle-mode{grid-template-columns:1fr; grid-template-rows:auto 1fr; grid-template-areas:"topbar" "center";}
#app.battle-mode #sidebarLeft,#app.battle-mode #sidebarRight,#app.battle-mode #chatDock{display:none;}

/* ---- 侧边栏（左/右通用） ---- */
.sidebar{
  width:auto; min-width:0;
  display:flex; flex-direction:column;
  background:rgba(14,16,26,.92); border-right:1px solid var(--line);
  overflow-y:auto; overflow-x:hidden;
}
.sidebar-right{
  border-left:1px solid var(--line); border-right:none;
}
.sb-header{
  padding:16px 14px 10px; text-align:center;
  border-bottom:1px solid var(--line); background:rgba(0,0,0,.2);
}
.sb-title{font-size:13px; font-weight:700; color:var(--gold-soft); letter-spacing:2px;}
.sb-sub{font-size:10px; color:var(--dim); margin-top:2px;}
.sb-nav{padding:8px 0; flex:1;}
.sb-item{
  display:flex; align-items:center; gap:10px; padding:11px 16px;
  cursor:pointer; color:var(--dim); font-size:13px;
  border-left:3px solid transparent; transition:.15s;
  user-select:none;
}
.sb-item:hover{color:var(--ink); background:rgba(255,255,255,.04);}
.sb-item.active{
  color:var(--gold-soft); background:rgba(201,162,39,.08);
  border-left-color:var(--gold); font-weight:600;
}
.sb-icon{font-size:18px; width:22px; text-align:center; flex-shrink:0;}
.sb-player-card{
  margin:10px 12px 14px; padding:12px; border-radius:12px;
  background:rgba(0,0,0,.25); border:1px solid var(--line);
  text-align:center;
}
.sb-avatar{width:80px;height:80px;margin:0 auto 8px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
.sb-pname{font-size:13px;font-weight:700;color:var(--gold-soft);}
.sb-plv{font-size:11px;color:var(--dim);margin-top:2px;}

/* ---- 好友栏（左栏） ---- */
.sb-friends{margin:10px 12px 0; border:1px solid var(--line); border-radius:12px; background:rgba(0,0,0,.22); display:flex; flex-direction:column; min-height:0; max-height:42%;}
.sb-friends-head{display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border-bottom:1px solid var(--line); font-size:12px; font-weight:700; color:var(--gold-soft);}
.sb-fbtn{background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:2px 8px; font-size:11px; cursor:pointer;}
.sb-fbtn:hover{border-color:var(--gold); color:var(--gold-soft);}
.sb-friends-body{flex:1; overflow-y:auto; padding:6px 8px; min-height:0;}
.sb-fitem{display:flex; align-items:center; gap:7px; padding:5px 6px; border-radius:8px; cursor:pointer; font-size:12px; color:var(--ink);}
.sb-fitem:hover{background:rgba(255,255,255,.05);}
.sb-fdot{width:8px; height:8px; border-radius:50%; flex-shrink:0; background:var(--dim);}
.sb-fdot.on{background:var(--green); box-shadow:0 0 6px rgba(69,217,142,.6);}
.sb-fname{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sb-fdel{color:var(--dim); font-size:13px; padding:0 3px; border:none; background:none; cursor:pointer;}
.sb-fdel:hover{color:var(--crimson);}
.sb-freq{padding:6px 6px; border-radius:8px; background:rgba(201,162,39,.07); border:1px solid rgba(201,162,39,.25); margin-bottom:5px; font-size:12px;}
.sb-freq .sb-frow{display:flex; align-items:center; gap:6px;}
.sb-freq .sb-fname{flex:1;}
.sb-freq .sb-fact{font-size:11px; padding:2px 7px; border-radius:5px; cursor:pointer; border:1px solid var(--line); color:var(--ink); background:var(--panel2);}
.sb-freq .sb-fact.ok:hover{border-color:var(--green); color:var(--green);}
.sb-freq .sb-fact.no:hover{border-color:var(--crimson); color:var(--crimson);}
.sb-fempty{color:var(--dim); font-size:11px; text-align:center; padding:10px 4px; line-height:1.6;}

/* ---- 右栏底部状态（填充空白） ---- */
.sb-right-body{flex:1; overflow-y:auto; padding:12px; min-height:0;}
.sb-stat-block{background:rgba(0,0,0,.22); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px;}
.sb-stat-block h4{margin:0 0 8px; font-size:12px; color:var(--gold-soft); letter-spacing:1px; font-weight:700; border-bottom:1px dashed var(--line); padding-bottom:5px;}
.sb-stat-row{display:flex; justify-content:space-between; font-size:12px; padding:3px 0; color:var(--ink);}
.sb-stat-row span:first-child{color:var(--dim);}
.sb-bar{height:7px; border-radius:4px; background:rgba(255,255,255,.06); overflow:hidden; margin:3px 0 8px;}
.sb-bar>i{display:block; height:100%; border-radius:4px;}
.sb-recent{font-size:11px; color:var(--dim); line-height:1.7; max-height:120px; overflow:hidden;}
.sb-recent b{color:var(--gold-soft);}

/* ---- 聊天 / 在线 / 组队 独立区域（底部 dock） ---- */
.dock-col{display:flex; flex-direction:column; min-height:0;}
.dock-online{width:250px; flex-shrink:0; border-right:1px solid var(--line);}
.dock-h{padding:8px 12px; font-size:12px; color:var(--gold-soft); font-weight:600; border-bottom:1px solid var(--line); letter-spacing:1px; flex-shrink:0;}
.dock-list{flex:1; overflow-y:auto; padding:6px 10px; min-height:0;}
.dock-list div{padding:2px 0; color:#aab3c2; font-size:12px;}
.dock-party{border-top:1px solid var(--line); padding:8px 10px; flex-shrink:0; max-height:46%; overflow-y:auto;}
.dock-chat{flex:1; min-width:0;}
.dock-chrow{display:flex; gap:6px; padding:6px 10px; border-bottom:1px solid var(--line); flex-shrink:0;}
.dock-log{flex:1; overflow-y:auto; padding:6px 12px; min-height:0; font-size:12px; line-height:1.5;}
.dock-log div{padding:1px 0; word-break:break-word;}
.dock-inputrow{padding:6px 10px 8px; flex-shrink:0;}
.dock-input{width:100%; box-sizing:border-box; background:#11141d; border:1px solid var(--line); border-radius:7px; color:#cdd6e0; padding:6px 10px; font-size:12.5px;}
.dock-input:focus{outline:none; border-color:var(--gold);}
.dock-sel{background:#11141d; color:#cdd6e0; border:1px solid var(--line); border-radius:6px; font-size:12px; padding:5px;}
.dock-target{flex:1; min-width:0; background:#11141d; border:1px solid var(--line); border-radius:6px; color:#cdd6e0; padding:5px 8px; font-size:12px;}

/* ---- 官网落地页：公告 / 更新 / 论坛 ---- */
.gate-wrap{display:flex; justify-content:center; align-items:flex-start; width:min(460px,94vw); max-height:90vh; overflow-y:auto; padding:20px 0; box-sizing:border-box;}
.news-tabs{display:flex; border-bottom:1px solid var(--line);}
.news-tab{flex:1; text-align:center; padding:12px 4px; font-size:13px; cursor:pointer; color:var(--dim); border-bottom:2px solid transparent; transition:.15s;}
.news-tab:hover{color:var(--ink);}
.news-tab.active{color:var(--gold-soft); border-bottom-color:var(--gold); font-weight:600;}
.news-body{flex:1; overflow-y:auto; padding:14px 16px; min-height:0;}
.news-item{padding:10px 0; border-bottom:1px dashed var(--line);}
.news-item:last-child{border-bottom:none;}
.news-item .ni-title{font-size:13px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:6px;}
.news-item .ni-date{font-size:10.5px; color:var(--dim); margin-left:auto;}
.news-item .ni-text{font-size:11.5px; color:var(--dim); line-height:1.7; margin-top:4px;}
.news-foot{padding:8px 12px; font-size:10.5px; color:var(--dim); text-align:center; border-top:1px solid var(--line);}
/* 论坛交互 */
.forum-compose{display:flex; gap:8px; margin-bottom:12px; align-items:flex-start;}
.forum-input{flex:1; min-height:46px; resize:vertical; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:8px; color:var(--ink); font-size:12px; padding:7px 9px; font-family:inherit;}
.forum-input:focus{outline:none; border-color:var(--gold);}
.forum-post-btn{background:var(--gold); color:#1a1206; border:none; border-radius:8px; padding:8px 14px; font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap;}
.forum-post-btn:hover{filter:brightness(1.08);}
.forum-thread{padding:10px 8px; border-bottom:1px dashed var(--line); cursor:pointer; border-radius:8px;}
.forum-thread:hover{background:rgba(255,255,255,.04);}
.forum-thread .ft-title{font-size:13px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:6px;}
.forum-thread .ft-text{font-size:11.5px; color:var(--dim); line-height:1.7; margin-top:6px; white-space:pre-wrap;}
/* 弹窗（添加好友等，避免沙箱 iframe 拦截 window.prompt） */
.modal-mask{position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:9999;}
.modal-box{width:320px; max-width:88vw; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 18px 16px; box-shadow:0 16px 50px rgba(0,0,0,.5);}
.modal-title{font-size:15px; font-weight:800; color:var(--gold-soft);}
.modal-sub{font-size:11.5px; color:var(--dim); margin:5px 0 11px;}
.modal-input{width:100%; box-sizing:border-box; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:9px; color:var(--ink); font-size:13px; padding:9px 11px; font-family:inherit;}
.modal-input:focus{outline:none; border-color:var(--gold);}
.modal-err{color:var(--crimson); font-size:11px; min-height:15px; margin-top:6px;}
.modal-actions{display:flex; justify-content:flex-end; gap:9px; margin-top:8px;}
.modal-btn{background:var(--gold); color:#1a1206; border:none; border-radius:9px; padding:8px 16px; font-size:12.5px; font-weight:700; cursor:pointer;}
.modal-btn:hover{filter:brightness(1.08);}
.modal-btn.ghost{background:transparent; color:var(--dim); border:1px solid var(--line);}
.modal-btn.ghost:hover{color:var(--ink); border-color:var(--gold);}
.slot-row{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; background:rgba(255,255,255,.03);}
.slot-name{font-size:13.5px; font-weight:700; color:var(--ink);}
.slot-name.dim{color:var(--dim); font-weight:500;}
.slot-time{font-size:11px; color:var(--dim); margin-top:2px;}
.slot-acts{display:flex; gap:8px;}
.slot-confirm{background:var(--crimson); color:#fff;}
/* 论坛回帖（楼中楼交流） */
.forum-thread.open{background:rgba(255,255,255,.04);}
.ft-head{display:flex; align-items:center; justify-content:space-between; gap:8px; cursor:pointer;}
.ft-meta{font-size:10.5px; color:var(--dim); white-space:nowrap; flex-shrink:0;}
.ft-text{font-size:11.5px; color:var(--dim); line-height:1.7; margin-top:8px; white-space:pre-wrap;}
.ft-replies{margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; display:flex; flex-direction:column; gap:7px;}
.ft-reply{background:rgba(0,0,0,.2); border:1px solid var(--line); border-radius:9px; padding:7px 9px; font-size:11.5px;}
.ft-rname{color:var(--gold-soft); font-weight:700; margin-right:7px;}
.ft-rtext{color:var(--ink); line-height:1.6; white-space:pre-wrap;}
.ft-noreply{font-size:11px; color:var(--dim);}
.forum-reply-row{display:flex; gap:8px; margin-top:9px; align-items:center;}
.forum-reply-row .forum-input{min-height:34px;}
.gate-charname-row{display:flex; gap:8px; margin:6px 0;}
.gate-btn-sm{padding:4px 12px; font-size:12px; white-space:nowrap; margin:6px 0 0;}
.gate-btn-sm.checking{opacity:.6;}

/* ---- 响应式：窄屏折叠右栏与新闻 ---- */
@media (max-width: 1100px){
  #app{grid-template-columns:200px 1fr;}
  #sidebarRight{display:none;}
  #app.battle-mode #centerArea{grid-column:1 / -1;}
  .gate-wrap{width:min(440px,94vw);}
}
@media (max-width: 760px){
  #app{grid-template-columns:1fr; grid-template-areas:"topbar" "center" "chat";}
  #sidebarLeft{display:none;}
  .dock-online{width:150px;}
}
#centerArea{
  flex:1; min-width:0; display:flex; flex-direction:column;
  overflow-y:auto; overflow-x:hidden; position:relative;
}

/* ==================== 标签页导航（侧边栏内使用，保留兼容） ==================== */
.nav-tabs{
  display:flex; gap:2px; padding:8px 12px 0; background:rgba(14,16,26,.85);
  border-bottom:1px solid var(--line);
}
.nav-tab{
  padding:8px 18px; font-size:13px; cursor:pointer; color:var(--dim);
  border:1px solid transparent; border-bottom:none; border-radius:8px 8px 0 0;
  transition:.15s; position:relative; top:1px;
}
.nav-tab:hover{color:var(--ink); background:var(--panel2);}
.nav-tab.active{
  color:var(--gold-soft); background:var(--panel2);
  border-color:var(--line); font-weight:600;
}

/* ==================== 内容区（中间栏内） ==================== */
#content{flex:1; overflow-y:auto; overflow-x:hidden; padding:16px 20px 24px; min-width:0;}

/* ---- 搜索框 ---- */
.search-box{
  display:flex; align-items:center; gap:6px; margin-bottom:14px;
  background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:6px 12px;
}
.search-box input{
  flex:1; background:none; border:none; outline:none; color:var(--ink); font-size:13px;
}
.search-box input::placeholder{color:var(--dim);}

/* ---- 分类标题 ---- */
.cat-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 4px 6px; cursor:pointer; user-select:none;
}
.cat-title{font-size:14px; font-weight:600; color:var(--ink);}
.cat-arrow{color:var(--dim); font-size:12px; transition:.2s; width:16px; text-align:center;}
.cat-arrow.open{transform:rotate(180deg);}

/* ---- 卡片网格 ---- */
.card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:8px; margin-bottom:16px;}
.item-card{
  background:var(--panel2); border:1px solid var(--line); border-radius:10px;
  padding:8px 6px 6px; text-align:center; cursor:pointer; transition:.15s; position:relative;
}
.item-card:hover{border-color:var(--gold); transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.3);}
.card-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:34px; line-height:1; margin-bottom:4px; flex-shrink:0;}
.card-count{
  position:absolute; bottom:2px; right:4px; background:var(--crimson); color:#fff;
  font-size:10px; font-weight:700; min-width:16px; height:16px; line-height:16px;
  border-radius:8px; padding:0 4px;
}
.card-name{font-size:10.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-ellipsis;}

/* 装备卡片特殊样式 */
.equip-card .card-name{color:var(--ink); font-weight:500; font-size:10px;}
.equip-card.r-common{border-left:3px solid #6b7077;}
.equip-card.r-uncommon{border-left:3px solid var(--green);}
.equip-card.r-rare{border-left:3px solid var(--blue);}
.equip-card.r-epic{border-left:3px solid var(--purple);}
.equip-card.r-legendary{border-left:3px solid var(--orange);}
.equip-card.r-unrecorded{border-left:3px solid var(--red);}

/* 技能书卡片 */
.book-card{border-left:3px solid var(--purple);}

/* 背包分格（紧凑方格） */
.inv-grid{display:grid; grid-template-columns:repeat(5, 1fr); gap:4px; margin-bottom:14px;}
.inv-cell{
  position:relative; aspect-ratio:1/1; background:var(--panel3);
  border:1px solid var(--line); border-radius:8px;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  padding:0; cursor:pointer; transition:.15s; overflow:hidden;
}
.inv-cell:hover{border-color:var(--gold); transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.45); background:var(--panel2);}
.inv-cell .cell-icon{flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; overflow:hidden;}
.inv-cell .cell-icon .item-badge{width:100%!important; height:100%!important; object-fit:contain; border-radius:0; border:none; background:none; box-shadow:none;}
.inv-cell .cell-name{position:absolute; bottom:0; left:0; right:0; font-size:8px; font-weight:700; color:#fff; background:rgba(0,0,0,.7); padding:2px 1px; white-space:nowrap; text-align:center; line-height:1.3; overflow:visible;}
.inv-cell .cell-q{position:absolute; top:3px; left:5px; font-size:9px; color:var(--dim); pointer-events:none;}
.inv-cell .cell-count{position:absolute; bottom:3px; right:4px; background:var(--crimson); color:#fff; font-size:10px; font-weight:700; min-width:16px; height:16px; line-height:16px; border-radius:8px; padding:0 4px;}
.inv-cell.empty{opacity:.32; cursor:default; border-style:dashed;}
.inv-cell.empty:hover{transform:none; border-color:var(--line); box-shadow:none;}
.inv-cell.r-common{--rar:#6b7077;}
.inv-cell.r-uncommon{--rar:var(--green);}
.inv-cell.r-rare{--rar:var(--blue);}
.inv-cell.r-epic{--rar:var(--purple);}
.inv-cell.r-legendary{--rar:var(--orange);}
.inv-cell.r-unrecorded{--rar:var(--red);}
/* 四角稀有度角标（替代整圈高亮边框） */
.inv-cell .rar-c{position:absolute; inset:5px; pointer-events:none; border-radius:8px;
  background:
    linear-gradient(var(--rar),var(--rar)) left top / 10px 2px no-repeat,
    linear-gradient(var(--rar),var(--rar)) left top / 2px 10px no-repeat,
    linear-gradient(var(--rar),var(--rar)) right top / 10px 2px no-repeat,
    linear-gradient(var(--rar),var(--rar)) right top / 2px 10px no-repeat,
    linear-gradient(var(--rar),var(--rar)) left bottom / 10px 2px no-repeat,
    linear-gradient(var(--rar),var(--rar)) left bottom / 2px 10px no-repeat,
    linear-gradient(var(--rar),var(--rar)) right bottom / 10px 2px no-repeat,
    linear-gradient(var(--rar),var(--rar)) right bottom / 2px 10px no-repeat;
  opacity:.92;
}
/* 背包分类标签 */
.bag-tabs{display:flex; gap:6px; margin:2px 0 10px; flex-wrap:wrap;}
.bag-tab{flex:1; min-width:84px; padding:7px 8px; font-size:12px; cursor:pointer; background:var(--panel2); color:var(--dim); border:1px solid var(--line); border-radius:8px; transition:.15s; display:flex; align-items:center; justify-content:center; gap:6px;}
.bag-tab:hover{border-color:var(--gold); color:var(--ink);}
.bag-tab.on{background:linear-gradient(135deg,rgba(201,162,39,.22),rgba(201,162,39,.08)); border-color:var(--gold); color:var(--gold-soft); font-weight:600;}
.bag-tab-n{font-size:10px; background:rgba(0,0,0,.32); border-radius:8px; padding:1px 6px; color:inherit;}
/* 确认弹窗（装备/使用/卸下 二次确认） */
.confirm-box{width:340px;}
.confirm-item{display:flex; gap:14px; align-items:flex-start; margin:4px 0 6px; padding:12px; background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:12px;}
.confirm-icon{width:54px; height:54px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.confirm-body-wrap{flex:1; min-width:0;}
.confirm-name{font-size:14px; font-weight:700; margin-bottom:5px;}
.confirm-stats{font-size:11.5px; color:var(--ink); line-height:1.7;}
.confirm-cmp{margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:11px; line-height:1.7;}
.confirm-cmp .cc{color:var(--dim);}
.confirm-warn{margin-top:8px; font-size:11px; color:var(--crimson);}

/* ---- 装备对比浮窗（悬停展示，无涨跌染色） ---- */
.cmp-tip{
  position:fixed; z-index:120; display:none; pointer-events:none;
  background:rgba(13,15,25,.97); border:1px solid var(--gold); border-radius:10px;
  padding:10px 12px; font-size:11px; line-height:1.6; max-width:440px;
  box-shadow:0 10px 34px rgba(0,0,0,.65);
}
.cmp-cols{display:flex; gap:16px;}
.cmp-col{min-width:150px; max-width:200px;}
.cmp-col-title{font-weight:700; font-size:11.5px; margin-bottom:4px; padding-bottom:3px; border-bottom:1px dashed var(--line);}
.cmp-line{color:var(--ink);}
.cmp-sub{color:var(--dim); font-size:10px;}

/* ---- 战斗 buff 图标条 ---- */
.buff-bar{display:flex; gap:4px; justify-content:center; flex-wrap:wrap; min-height:22px; width:100%;}
.buff-ico{
  position:relative; width:20px; height:20px; border-radius:5px;
  display:flex; align-items:center; justify-content:center;
  background:var(--panel3); border:1px solid var(--line); font-size:12px;
}
.buff-ico .bt{
  position:absolute; bottom:-5px; right:-5px; font-size:8.5px; line-height:1;
  background:#05060a; border:1px solid var(--line); border-radius:6px;
  padding:1px 3px; color:#ffd66b; font-weight:700;
}

/* ==================== 战斗屏（中间栏全屏） ==================== */
.battle-screen{
  display:flex; flex-direction:column; height:100%; position:relative;
}
.battle-nav{
  display:flex; gap:6px; padding:10px 18px 0; background:rgba(12,16,26,.9);
  border-bottom:1px solid rgba(180,160,120,.12);
}
.battle-nav-btn{
  padding:9px 18px; font-size:13px; cursor:pointer; color:var(--dim);
  border:1px solid transparent; border-bottom:none; border-radius:10px 10px 0 0;
  background:none; transition:all .2s; letter-spacing:.5px;
}
.battle-nav-btn:hover{color:var(--ink); background:rgba(255,255,255,.04);}
.battle-nav-btn.active{color:var(--gold-soft); background:linear-gradient(180deg, rgba(201,162,39,.12), transparent); border-color:rgba(201,162,39,.25); font-weight:600; box-shadow:0 -2px 8px rgba(201,162,39,.08);}
.battle-body{flex:1; display:flex; align-items:center; justify-content:center; gap:32px; padding:20px 24px 56px; overflow:auto; position:relative;
  background-size:cover; background-position:center; background-repeat:no-repeat;}
.battle-skillbar-wrap{position:absolute; bottom:8px; right:14px; z-index:5;}

/* ---- 战斗单位面板（卡片化·精致金属边框） ---- */
.fighter-panel{
  width:280px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px;
  background:linear-gradient(180deg, rgba(22,26,40,.92) 0%, rgba(16,20,34,.95) 100%);
  border:1px solid rgba(180,160,120,.15); border-radius:18px;
  padding:18px 16px 16px; box-shadow:0 12px 36px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.03);
}
.fighter-name{font-size:16px; font-weight:700; letter-spacing:1.5px;}
.fighter-hp-bar{
  width:100%; height:26px; background:#000; border-radius:13px; overflow:hidden;
  border:1px solid #333; position:relative;
}
.fighter-hp-bar::after{
  content:''; position:absolute; inset:2px 2px auto 2px; height:8px;
  background:linear-gradient(180deg, rgba(255,255,255,.12), transparent);
  border-radius:8px 8px 0 0; pointer-events:none;
}
.filler-hp{height:100%; transition:width .35s; border-radius:12px;}
.hp-player{background:linear-gradient(90deg,#124068,#2176ae,#3498db);}
.hp-enemy{background:linear-gradient(90deg,#681818,#a82020,#d63a3a);}
.hp-text{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; color:#fff; text-shadow:0 1px 3px #000; letter-spacing:.5px;
}
.fighter-mp-bar{
  width:100%; height:10px; background:#111; border-radius:5px; overflow:hidden;
  border:1px solid #2a2a38; margin-top:0;
}
.filler-mp{height:100%; transition:width .35s; border-radius:4px;
  background:linear-gradient(90deg,#1a3a5a,#2e6a9e,#5b9bd5);}
.fighter-avatar{
  width:110px; height:110px; border-radius:20px; display:flex; align-items:center; justify-content:center;
  font-size:56px; background:transparent;
  border:2px solid var(--line); box-shadow:0 0 24px rgba(0,0,0,.5);
  position:relative;
}
.avatar-player{border-color:#3498db; box-shadow:0 0 28px rgba(52,152,219,.18), 0 0 8px rgba(52,152,219,.08);}
.avatar-enemy{border-color:#c0392b; box-shadow:0 0 28px rgba(192,57,43,.18), 0 0 8px rgba(192,57,43,.08);}
.elite-badge{
  position:absolute; top:-6px; left:-6px; background:var(--purple); color:#fff;
  font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px;
  animation:badgePulse 2s ease-in-out infinite;
}
.boss-badge{
  position:absolute; top:-6px; left:-6px; background:var(--orange); color:#1a1000;
  font-size:10px; font-weight:700; padding:3px 9px; border-radius:10px;
  animation:badgePulse 1.5s ease-in-out infinite;
}
@keyframes badgePulse{0%,100%{opacity:1;} 50%{opacity:.7;}}
.fighter-action{
  padding:7px 28px; border-radius:8px; font-size:13px; font-weight:600;
  color:var(--dim); background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06);
  cursor:default; min-width:150px; letter-spacing:1px;
}
.vs-mark{font-size:22px; font-weight:900; color:var(--gold-soft); opacity:.55; text-shadow:0 0 12px rgba(201,162,39,.3); letter-spacing:2px;}
.action-player{background:rgba(52,152,219,.08); border-color:rgba(52,152,219,.2); color:rgba(52,152,219,.6);}
.action-enemy{background:rgba(192,57,43,.06); border-color:rgba(192,57,43,.15); color:rgba(192,57,43,.5);}

/* ---- 行动读条（ATB） ---- */
.cast-wrap{width:100%;}
.cast-bar{width:100%; height:9px; background:#000; border:1px solid #333; border-radius:5px; overflow:hidden;}
.cast-fill{height:100%; background:linear-gradient(90deg,#c9a227,#ffe08a); transition:width .3s linear;}
.cast-fill.cast-enemy{background:linear-gradient(90deg,#96281b,#e07a5f);}
.cast-label{font-size:10px; color:var(--dim); margin-top:2px; text-align:center; letter-spacing:.5px;}

/* ---- 药水瓶能量条 ---- */
.flask-row{display:flex; align-items:center; gap:6px; font-size:10px; color:var(--dim); width:100%; margin-top:2px;}
.flask-bar{flex:1; height:7px; background:#000; border:1px solid #333; border-radius:4px; overflow:hidden;}
.flask-fill-hp{height:100%; background:linear-gradient(90deg,#7b241c,#e85d4c); transition:width .3s;}
.flask-fill-mp{height:100%; background:linear-gradient(90deg,#1a5276,#4a9eff); transition:width .3s;}
.flask-slot-card{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:12px; display:flex; gap:10px; align-items:center; margin-bottom:8px;}

/* VS 标记 */
.vs-mark{font-size:28px; color:var(--gold); font-weight:900; letter-spacing:4px; opacity:.6; align-self:center;}
/* 组队战斗：队友贡献榜 */
.party-battle-bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; width:100%; margin-bottom:10px;
  padding:8px 12px; border:1px solid var(--line, #2a2f45); border-radius:12px;
  background:linear-gradient(90deg, rgba(40,60,110,.18), rgba(40,60,110,.04)); font-size:12px; color:var(--ink, #cdd3e6);}
.pb-member{padding:3px 9px; border-radius:999px; border:1px solid var(--line, #2a2f45); background:rgba(255,255,255,.04); white-space:nowrap;}
.pb-member.me{border-color:var(--gold, #c9a24b); color:var(--gold-soft, #e8d9b0); background:rgba(201,162,75,.12);}
.pb-member i{font-style:normal; font-weight:700; color:var(--gold, #c9a24b); margin-left:4px;}
/* 多敌：右侧敌人横排（可换行） */
.enemy-group{display:flex; flex-wrap:wrap; gap:18px; align-items:flex-start; justify-content:flex-start; max-width:760px;}
/* 战斗屏容器需相对定位，承载胜利横幅浮层 */
.battle-screen{position:relative;}
/* 胜利横幅样式已移除 */
/* 引魂香生效徽标 */
.incense-badge{display:inline-flex; align-items:center; gap:4px; margin-left:8px; padding:3px 9px; border-radius:10px;
  background:rgba(142,68,173,.18); border:1px solid #8e44ad; color:#d9a8f0; font-size:11px; font-weight:700;}
/* 战斗只读背包浮层 */
.bag-modal{position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
  background:rgba(4,5,10,.66);}
.bag-modal-box{width:min(560px,92vw); max-height:82vh; overflow:auto; background:rgba(13,15,25,.98);
  border:1px solid var(--gold); border-radius:16px; padding:22px 24px; box-shadow:0 16px 50px rgba(0,0,0,.65);}
.bb-section{margin-bottom:14px; padding-bottom:12px; border-bottom:1px dashed var(--line);}
.bb-h{font-size:12px; color:var(--gold-soft); margin-bottom:6px; font-weight:700;}
.bb-section>div:last-child{font-size:12px; color:var(--ink); line-height:1.7;}
/* 地图可能掉落区 */
.map-drops{margin:10px 0 12px; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
  background:rgba(255,255,255,.03);}
.md-title{font-size:11.5px; color:var(--gold-soft); margin-bottom:6px; font-weight:700;}
.md-row{font-size:11px; color:var(--ink); line-height:1.7;}

/* ---- 战斗日志（悬浮窗·可缩放） ---- */
.float-log{
  display:none; position:fixed; bottom:12px; left:12px; z-index:50; width:320px; height:180px;
  min-width:200px; min-height:100px; max-width:50vw; max-height:55vh;
  background:rgba(14,16,26,.92); backdrop-filter:blur(8px);
  border:1px solid rgba(180,160,120,.15); border-radius:12px;
  box-shadow:0 8px 32px rgba(0,0,0,.5); overflow:hidden; flex-direction:column; display:none;
}
.float-log.show{display:flex;}
.fl-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 12px; background:rgba(0,0,0,.25); border-bottom:1px solid rgba(255,255,255,.06);
  font-size:12px; color:var(--dim); cursor:move; user-select:none;
}
.fl-btns{display:flex; gap:4px;}
.fl-btn{
  background:none; border:none; color:var(--dim); cursor:pointer;
  width:22px; height:22px; border-radius:5px; font-size:14px; line-height:22px; text-align:center;
  transition:.15s;
}
.fl-btn:hover{background:rgba(255,255,255,.1); color:var(--ink);}
.fl-body{
  overflow:auto; font-size:12px; line-height:1.7;
}
.fl-body .log-p{color:#9fc6ff;} .fl-body .log-e{color:#e08a86;} .fl-body .log-s{color:var(--gold-soft);}
.fl-body .log-hl{background:linear-gradient(90deg, rgba(201,162,39,.16), rgba(201,162,39,.02)); border-left:3px solid var(--gold); padding:2px 8px; margin:2px 0; border-radius:3px;}
.fl-body>div{padding:2px 12px;}
.fl-resize{
  position:absolute; bottom:0; right:0; width:16px; height:16px;
  cursor:nwse-resize;
}
.float-log.collapsed .fl-body,.float-log.collapsed .fl-resize{display:none;}
.float-log.collapsed{min-width:0; min-height:0; width:auto!important; height:auto!important;}
.float-log.collapsed .fl-head{border-bottom:none; border-radius:12px;}

/* ---- 战斗日志（旧嵌入式，保留兼容） ---- */
.battle-log{
  max-height:160px; overflow:auto; background:rgba(0,0,0,.4); border:1px solid var(--line);
  border-radius:8px; padding:8px 12px; margin-top:12px; font-size:12px;
}
.log-p{color:#9fc6ff;} .log-e{color:#e08a86;} .log-s{color:var(--gold-soft);}
.log-hl{background:linear-gradient(90deg, rgba(201,162,39,.16), rgba(201,162,39,.02)); border-left:3px solid var(--gold); padding:3px 6px; margin:2px 0; border-radius:4px; box-shadow:0 0 10px rgba(201,162,39,.12);}

/* ==================== 角色属性面板 ==================== */
.attr-row{display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px dashed var(--line);}
.attr-icon{width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0;}
.attr-str{background:rgba(232,93,76,.15); border:1px solid rgba(232,93,76,.3); color:var(--str-color);}
.attr-agi{background:rgba(69,217,142,.15); border:1px solid rgba(69,217,142,.3); color:var(--agi-color);}
.attr-int{background:rgba(74,158,255,.15); border:1px solid rgba(74,158,255,.3); color:var(--int-color);}
.attr-info{flex:1;}
.attr-name{font-size:13px; font-weight:600;}
.attr-val{font-size:18px; font-weight:700; color:var(--gold-soft);}
.attr-bar{height:6px; background:#000; border-radius:3px; overflow:hidden; margin-top:3px;}
.attr-fill{height:100%; border-radius:3px; transition:width .3s;}

/* ==================== 装备槽位（大卡片） ==================== */
.slot-grid-big{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-bottom:16px;}
.slot-card{
  background:var(--panel2); border:1px solid var(--line); border-radius:10px;
  padding:12px; cursor:pointer; transition:.15s; position:relative;
}
.slot-card:hover{border-color:var(--gold);}
.slot-card.empty{opacity:.6;}
.slot-label{font-size:13px; color:var(--dim); margin-bottom:4px;}
.slot-item-name{font-size:13px; font-weight:600;}
.slot-req{font-size:10.5px; margin-top:4px;}
.req-ok{color:var(--green);} .req-fail{color:var(--crimson);}

/* ==================== 技能行 ==================== */
.skill-card{
  background:var(--panel2); border:1px solid var(--line); border-radius:10px;
  padding:10px 12px; margin-bottom:8px; display:flex; align-items:center; gap:10px;
}
.skill-icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;}
.skill-info{flex:1;}
.skill-name{font-size:14px; font-weight:600; color:var(--gold-soft);}
.skill-desc{font-size:11.5px; color:var(--dim); margin-top:2px;}
.skill-lv{padding:2px 10px; border-radius:10px; font-size:11px; font-weight:700; color:#fff; flex-shrink:0;}
.skill-tier{display:inline-block; padding:0 6px; border-radius:8px; font-size:9.5px; font-weight:700; border:1px solid; margin-left:4px; vertical-align:middle; line-height:1.5;}
.skill-locked{opacity:.5; filter:grayscale(.65);}

/* ==================== 地图卡片 ==================== */
.map-card{
  background:var(--panel2); border:1px solid var(--line); border-radius:12px;
  padding:14px; margin-bottom:10px; display:flex; align-items:center; gap:12px;
  transition:.15s;
}
.map-card:hover{border-color:var(--gold);}
.map-emoji{font-size:32px;}
.map-info{flex:1;}
.map-name{font-size:15px; font-weight:700;}
.map-desc{font-size:11.5px; color:var(--dim); margin-top:2px;}

/* ==================== 商店商品 ==================== */
.shop-card{
  background:var(--panel2); border:1px solid var(--line); border-radius:10px;
  padding:12px; margin-bottom:8px; display:flex; align-items:center; gap:12px;
}
.shop-icon{font-size:32px;}
.shop-info{flex:1;}
.shop-name{font-size:14px; font-weight:600;}
.shop-desc{font-size:11.5px; color:var(--dim); margin-top:2px;}
.shop-price{font-size:13px; color:var(--gold-soft); font-weight:700;}

/* ==================== 需求标签 ==================== */
.req-tag{display:inline-flex; align-items:center; gap:3px; padding:1px 6px; border-radius:4px; font-size:10px; font-weight:600;}
.req-str{background:rgba(232,93,76,.15); color:var(--str-color);}
.req-agi{background:rgba(69,217,142,.15); color:var(--agi-color);}
.req-int{background:rgba(74,158,255,.15); color:var(--int-color);}
.req-con{background:rgba(216,168,74,.15); color:#d8a84a;}
.req-spi{background:rgba(176,107,216,.15); color:#b06bd8;}

/* ==================== Toast ==================== */
.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:var(--panel2); border:1px solid var(--gold); color:var(--gold-soft);
  padding:8px 20px; border-radius:10px; z-index:100; opacity:0; transition:.3s;
  pointer-events:none; font-weight:600;
}
.toast.show{opacity:1;}

/* ==================== 战斗技能栏 CD 转圈 ==================== */
.skill-bar{display:flex; gap:8px; padding:8px 14px; background:rgba(12,16,26,.85); backdrop-filter:blur(6px); border-radius:12px; border:1px solid rgba(180,160,120,.12); align-items:center; box-shadow:0 4px 20px rgba(0,0,0,.4);}
.skill-slot{position:relative; width:46px; height:46px; border-radius:50%; background:radial-gradient(circle at 55% 40%, var(--panel2), var(--bg)); border:2px solid rgba(180,160,120,.15); display:flex; align-items:center; justify-content:center; font-size:21px; cursor:default; flex-shrink:0; box-shadow:inset 0 1px 3px rgba(0,0,0,.5);}
.skill-slot.aura{border-color:rgba(201,162,39,.3); border-style:solid; animation:auraGlow 3s ease-in-out infinite;}
@keyframes auraGlow{0%,100%{box-shadow:inset 0 1px 3px rgba(0,0,0,.5), 0 0 6px rgba(201,162,39,.1);} 50%{box-shadow:inset 0 1px 3px rgba(0,0,0,.5), 0 0 14px rgba(201,162,39,.2);}}
.skill-slot.empty{border-style:dotted; opacity:0.3;}
.skill-slot .cd-ring{position:absolute; top:-3px; left:-3px; width:52px; height:52px; border-radius:50%; pointer-events:none;}
.skill-slot .cd-ring.active{
  background:conic-gradient(transparent 0deg, var(--gold-soft) calc(var(--cd-pct,0deg) + 10deg), var(--gold) var(--cd-pct,0deg));
  mask:radial-gradient(transparent 60%, black 61%);
  -webkit-mask:radial-gradient(transparent 60%, black 61%);
}
.skill-slot .cd-text{position:absolute; bottom:-3px; right:-3px; font-size:11px; background:var(--bg); color:var(--gold-soft); padding:1px 4px; border-radius:4px; font-weight:700; min-width:16px; text-align:center; border:1px solid rgba(201,162,39,.3);}
.skill-slot .aura-ring{position:absolute; top:-4px; left:-4px; width:54px; height:54px; border-radius:50%; border:1.5px solid rgba(201,162,39,.4);}
/* ==================== 空闲主页 ==================== */
.idle-home{text-align:center; padding:40px 20px;}
.idle-title{font-size:26px; color:var(--gold-soft); letter-spacing:4px; margin-bottom:8px;}
.idle-flavor{color:var(--dim); max-width:420px; margin:0 auto 24px; line-height:1.8;}
.map-buttons{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:20px;}
.last-loot-box{
  background:var(--panel2); border:1px solid var(--line); border-radius:12px;
  padding:14px 18px; display:inline-block; text-align:left; max-width:400px;
}
.loot-title{font-size:13px; font-weight:600; color:var(--gold-soft); margin-bottom:6px;}
.loot-detail{font-size:12px; color:var(--dim); line-height:1.7;}

/* ==================== 滚动条 ==================== */
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#2a2e42; border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:#3a3e54;}

/* ==================== 折叠区 ==================== */
.fold-section{margin-bottom:4px;}
.fold-content{overflow:hidden; transition:max-height .25s ease;}

/* ==================== 云端存档状态 / 账号弹窗 ==================== */
.cloud-pill{display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:14px;
  font-size:12px; background:rgba(255,255,255,.05); border:1px solid var(--line); color:var(--dim); cursor:pointer; white-space:nowrap;}
.cloud-pill.on{background:rgba(74,158,255,.15); border-color:rgba(74,158,255,.4); color:#9ccbff;}
.modal-mask{position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center; z-index:50;}
.modal-box{width:340px; max-width:90vw; background:#151824; border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:0 12px 40px rgba(0,0,0,.5);}
.modal-title{font-size:16px; color:var(--gold-soft); letter-spacing:2px; margin-bottom:14px; text-align:center;}
.modal-tabs{display:flex; gap:8px; justify-content:center; margin-bottom:12px;}
.modal-tab{padding:5px 16px; border-radius:8px; background:rgba(255,255,255,.05); color:var(--dim); cursor:pointer; font-size:13px;}
.modal-tab.active{background:var(--gold-soft); color:#1a1208;}
.modal-input{width:100%; box-sizing:border-box; padding:9px 12px; margin-bottom:10px; border-radius:8px;
  background:#0e111b; border:1px solid var(--line); color:#e8eaf0; font-size:14px; outline:none;}
.modal-input:focus{border-color:var(--gold-soft);}
.modal-msg{min-height:18px; font-size:12.5px; margin-bottom:8px; color:var(--crimson);}
.modal-btns{display:flex; gap:10px; justify-content:flex-end;}
.modal-hint{margin-top:12px; font-size:11.5px; color:var(--dim); line-height:1.6; border-top:1px solid var(--line); padding-top:10px;}
.modal-hint a{color:#9ccbff; cursor:pointer;}

/* ==================== 登录门禁（未登录不可进入游戏） ==================== */
#authGate{position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(1200px 700px at 50% -10%, #1b2338 0%, #0b0e17 55%, #05070d 100%);}
#authGate::before{content:''; position:absolute; inset:0; pointer-events:none; opacity:.55;
  background-image:radial-gradient(1.4px 1.4px at 12% 22%, #fff 50%, transparent 51%),
                   radial-gradient(1.2px 1.2px at 78% 16%, #cfe3ff 50%, transparent 51%),
                   radial-gradient(1.6px 1.6px at 32% 68%, #fff 50%, transparent 51%),
                   radial-gradient(1.1px 1.1px at 62% 78%, #ffe6b8 50%, transparent 51%),
                   radial-gradient(1.3px 1.3px at 88% 58%, #fff 50%, transparent 51%),
                   radial-gradient(1px 1px at 22% 88%, #b8d4ff 50%, transparent 51%);}
.gate-box{position:relative; width:420px; max-width:94vw; background:rgba(13,15,20,.94); backdrop-filter:blur(8px);

.gate-brand{text-align:center; font-size:52px; font-weight:700; letter-spacing:18px; color:#c9a253; line-height:1; margin-bottom:8px; font-family:Georgia,serif;}
.gate-brand-sub{text-align:center; font-size:10px; color:#5a5f6a; letter-spacing:5px; margin-bottom:14px; text-transform:uppercase;}
.gate-deco{display:flex; align-items:center; justify-content:center; gap:12px; margin:14px 0 18px;}
.gate-deco-line{width:64px; height:1px; background:linear-gradient(90deg,transparent,#c9a253);}
.gate-deco-line-r{width:64px; height:1px; background:linear-gradient(270deg,transparent,#c9a253);}
.gate-deco-diamond{width:7px; height:7px; border:1px solid #c9a253; transform:rotate(45deg); flex-shrink:0;}
.gate-sub{text-align:center; font-size:13px; color:#7a7f8a; letter-spacing:4px; margin-bottom:24px;}
.gate-landing{padding:48px 36px 0;}
.gate-foot{border-top:1px solid rgba(255,255,255,.06); padding:14px 20px; font-size:10px; color:#4a4f58; text-align:center; margin-top:20px;}
/* 资源加载读条 */
.gate-loading{position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(13,15,20,.96); border-radius:16px; z-index:5;}
.gate-loading-bar{width:65%; max-width:260px; height:5px; background:rgba(255,255,255,.08); border-radius:3px; overflow:hidden; margin-bottom:14px;}
.gate-loading-fill{height:100%; width:0%; background:linear-gradient(90deg, #4a7ab5, #7ab5e8, #4a7ab5); background-size:200% 100%;
  border-radius:3px; transition:width .25s; animation:loadShimmer 1.6s ease-in-out infinite;}
@keyframes loadShimmer{0%{background-position:100% 0} 100%{background-position:-100% 0}}
.gate-loading-text{font-size:13.5px; color:#8899bb; letter-spacing:2px;}
.gate-mode{display:flex; align-items:center; justify-content:center; gap:6px; font-size:11.5px; margin-bottom:16px;
  color:var(--dim); padding:6px 10px; border-radius:10px; background:rgba(255,255,255,.04); border:1px solid var(--line);}
.gate-mode b{color:#9ccbff; font-weight:600;}
.gate-mode.local b{color:var(--gold-soft);}
.gate-tabs{display:flex; gap:8px; justify-content:center; margin-bottom:14px;}
.gate-tab{flex:1; text-align:center; padding:8px 0; border-radius:9px; background:rgba(255,255,255,.05);
  color:var(--dim); cursor:pointer; font-size:13.5px; border:1px solid transparent; transition:.15s;}
.gate-tab:hover{color:#e8eaf0;}
.gate-tab.active{background:linear-gradient(180deg,#e8c886,#c9a253); color:#1a1208; font-weight:600;}
.gate-input{width:100%; box-sizing:border-box; padding:11px 13px; margin-bottom:11px; border-radius:9px;
  background:#0c0f18; border:1px solid var(--line); color:#e8eaf0; font-size:14px; outline:none; transition:.15s;}
.gate-input:focus{border-color:var(--gold-soft); box-shadow:0 0 0 3px rgba(201,162,83,.12);}
.gate-msg{min-height:20px; font-size:12.5px; color:var(--crimson); margin-bottom:6px; line-height:1.5;}
.gate-msg.ok{color:var(--green);}
.gate-btn{width:100%; padding:11px 0; border:none; border-radius:9px; cursor:pointer; font-size:14.5px; letter-spacing:2px;

.gate-btn:hover{filter:brightness(1.08);}
.gate-btn:disabled{opacity:.5; cursor:not-allowed;}
.gate-btn-ghost{background:rgba(255,255,255,.06); color:var(--dim); border:1px solid var(--line);}
.gate-btn-ghost:hover{color:#e8eaf0; border-color:var(--gold-soft); filter:none;}
.gate-remember{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); margin-bottom:12px; cursor:pointer;}
.origin-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:14px;}
.origin-card{padding:12px 6px; border-radius:11px; background:rgba(255,255,255,.04); border:1px solid var(--line);
  text-align:center; cursor:pointer; transition:.15s;}
.origin-card:hover{border-color:rgba(201,162,83,.5);}
.origin-card.sel{border-color:var(--gold-soft); background:rgba(201,162,83,.14);}
.origin-card .oi{display:block; width:26px; height:26px; margin:0 auto 6px; color:var(--gold-soft);}
.origin-card .on2{font-size:13px; color:#e8eaf0;}
.origin-card .od{font-size:10.5px; color:var(--dim); margin-top:3px;}

/* 出身选择：竖排手风琴 */
/* ---- 选择出身：横向展开收起手风琴 ---- */
#gateOrigin{ position:fixed; inset:0; z-index:60; display:flex; flex-direction:column;
  background:radial-gradient(120% 120% at 50% 0%, #1a160f 0%, #0c0b09 70%); }
.origin-page{ display:flex; flex-direction:column; width:100%; height:100%; box-sizing:border-box; }
.origin-topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px 22px; border-bottom:1px solid #2a2418; flex-shrink:0; }
.ob-left{ display:flex; gap:8px; }
.ob-right{ display:flex; align-items:center; gap:8px; }
.ob-namelabel{ font-size:12px; color:var(--dim); }
.ob-name{ width:150px; margin:0; }
.origin-acc-h{ display:flex; gap:12px; flex:1; min-height:0; padding:20px 26px; }
.origin-tab{ position:relative; flex:0 0 58px; border-radius:14px; overflow:hidden; cursor:pointer;
  background:linear-gradient(160deg,#1c1812,#141009); border:1px solid #2a2418;
  transition:flex .4s cubic-bezier(.4,0,.2,1), border-color .3s, background .3s;

.origin-tab:hover{ border-color:#5a4d2a; }
.origin-tab.open{ flex:1 1 auto; border-color:#b8923c; background:linear-gradient(160deg,#241f15,#171310);

.ot-strip{ width:58px; flex:0 0 58px; display:flex; align-items:center; justify-content:center;

.ot-panel{ display:none; flex:1; min-width:0; padding:18px 22px; }

.ot-panel-head{ display:flex; align-items:center; gap:12px; padding-bottom:12px; border-bottom:1px solid #2a2418; }
.ot-icon{ width:34px; height:34px; color:#e8c878; flex-shrink:0; }
.ot-name{ font-size:22px; font-weight:800; color:#e8c878; letter-spacing:2px; }
.ot-sub{ font-size:12px; color:var(--dim); margin-left:auto; }
.ot-panel-body{ display:flex; gap:22px; flex:1; min-height:0; padding-top:14px; }
.ot-left{ flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; gap:14px; overflow-y:auto; padding-right:6px; }
.ot-h{ font-size:12px; color:#c9bfa6; letter-spacing:3px; margin-bottom:7px; opacity:.85; }
.ot-story{ font-size:13px; line-height:1.85; color:#bdb39a; }
.ob-attrs{ display:flex; flex-wrap:wrap; gap:8px; }
.ob-attr{ font-size:13px; font-weight:600; padding:4px 10px; border-radius:8px; background:rgba(255,255,255,.04); border:1px solid #2a2418; }
.ob-skills{ display:flex; flex-wrap:wrap; gap:9px; }
.ob-skill{ display:flex; flex-direction:column; gap:2px; padding:7px 12px; border-radius:9px;

.ob-skill b{ font-size:13px; color:#e8c878; }
.ob-skill i{ font-size:11px; color:var(--dim); font-style:normal; line-height:1.4; }
.ot-right{ flex:0 0 380px; border-radius:12px; overflow:hidden;

.ob-passive{ display:flex; flex-direction:column; gap:3px; padding:9px 12px; border-radius:9px;

.ob-passive b{ font-size:13px; color:#ff9f3a; letter-spacing:1px; }
.ob-passive i{ font-size:11px; color:var(--dim); font-style:normal; line-height:1.5; }
/* 特性觉醒 / 改换面板 */
.awaken-panel{ width:min(520px,92vw); background:linear-gradient(160deg,#1c2230,#141821); border:1px solid rgba(255,159,58,.35); border-radius:16px; padding:22px 22px 18px; box-shadow:0 18px 60px rgba(0,0,0,.55); color:#e8eef7; }
.awaken-title{ font-size:21px; font-weight:800; color:#ff9f3a; letter-spacing:2px; text-align:center; }
.awaken-sub{ font-size:12px; color:var(--dim); text-align:center; margin:6px 0 16px; line-height:1.5; }
.awaken-opts{ display:flex; flex-direction:column; gap:12px; }
.awaken-opt{ text-align:left; padding:14px 16px; border-radius:12px; background:rgba(255,255,255,.04); border:1px solid var(--line); cursor:pointer; transition:.15s; }
.awaken-opt:hover{ border-color:rgba(255,159,58,.55); background:rgba(255,159,58,.08); transform:translateY(-1px); }
.awaken-opt.cur{ border-color:#ff9f3a; background:rgba(255,159,58,.12); }
.awaken-opt-name{ font-size:15px; font-weight:700; color:#ffd9a8; margin-bottom:4px; }
.awaken-opt-desc{ font-size:12px; color:var(--dim); line-height:1.55; }

.awaken-foot{ margin-top:16px; text-align:center; }
.origin-foot .gate-btn-big{ min-width:300px; }

}

/* ===== 教程引导层 ===== */
#tutOverlay{display:none; position:fixed; inset:0; z-index:999; pointer-events:none;}
.tut-shade{position:absolute; background:rgba(0,0,0,.72); pointer-events:all;}
.tut-bubble{
  position:absolute; z-index:2; pointer-events:auto; background:var(--panel2); border:1px solid var(--gold-soft);
  border-radius:14px; padding:18px 20px; min-width:280px; max-width:380px;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
}
.tut-step{font-size:11px; color:var(--gold-soft); margin-bottom:6px; font-weight:600;}
.tut-text{font-size:13.5px; color:var(--ink); line-height:1.7; margin-bottom:14px;}
.tut-actions{display:flex; gap:8px; justify-content:flex-end;}
.tut-btn{
  padding:7px 16px; border-radius:8px; border:none; cursor:pointer; font-size:13px;
  transition:.15s;
}
.tut-skip{background:transparent; color:var(--dim);}
.tut-skip:hover{color:var(--crimson);}
.tut-next{background:linear-gradient(135deg,#c9a227,#a07d1a); color:#1a1408; font-weight:600;}
.tut-next:hover{filter:brightness(1.1);}

/* ===== 锻造铺 ===== */
.sub-tab-row{display:flex; gap:8px; margin-bottom:14px;}
.sub-tab{padding:7px 16px; border:1px solid var(--line); border-radius:9px; font-size:13px; color:var(--dim); cursor:pointer; background:var(--panel2); transition:.15s;}
.sub-tab:hover{color:var(--blue); border-color:rgba(74,158,255,.5);}
.sub-tab.active{color:#fff; background:linear-gradient(135deg,#c98a2e,#a86a18); border-color:#c98a2e; font-weight:700;}
.sec-label{font-size:12px; color:var(--gold-soft); margin:14px 0 7px; font-weight:600;}
.rar-chips{display:flex; flex-wrap:wrap; gap:7px;}
.rar-chip{display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border:1px solid var(--line); border-radius:20px; font-size:12px; color:var(--dim); cursor:pointer; background:var(--panel); transition:.15s;}
.rar-chip:hover{border-color:rgba(201,162,83,.5); color:var(--gold-soft);}
.rar-chip.active{border-color:var(--gold-soft); background:rgba(201,162,83,.15); color:var(--gold-soft);}
.rar-dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
.decomp-controls{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px;}
.decomp-actions{margin-top:10px;}
.decomp-preview{margin-top:12px; font-size:12px; color:var(--dim); display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.decomp-preview b, .decomp-preview{color:var(--blue);}
.decomp-list{display:flex; flex-direction:column; gap:8px;}
.decomp-row{display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--panel);}
.di-icon{flex-shrink:0; width:30px; text-align:center;}
.di-name{flex:1; min-width:0; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.di-yield{flex-shrink:0; font-size:11px; color:var(--green);}
.forge-controls{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:14px;}
.slot-chips{display:flex; flex-wrap:wrap; gap:7px;}
.slot-chip{padding:5px 12px; border:1px solid var(--line); border-radius:8px; font-size:12px; color:var(--dim); cursor:pointer; background:var(--panel); transition:.15s;}
.slot-chip:hover{border-color:rgba(74,158,255,.5); color:var(--blue);}
.slot-chip.active{border-color:var(--blue); background:rgba(74,158,255,.15); color:#cfe6ff; font-weight:600;}
.recipe-box{margin:14px 0 6px; border:1px dashed var(--line); border-radius:10px; padding:12px; background:rgba(0,0,0,.18);}
.recipe-title{font-size:13px; color:var(--gold-soft); margin-bottom:8px; font-weight:700;}
.recipe-row{display:flex; align-items:center; gap:6px; font-size:12.5px; padding:3px 0; color:#e8eaf0;}
.recipe-row b{color:var(--blue);}
.recipe-row.lack{color:var(--crimson);}
.recipe-row.lack b{color:var(--crimson);}
.reforge-intro{font-size:12px; color:var(--dim); line-height:1.7; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:11px 13px; margin-bottom:14px;}
.reforge-intro b{color:var(--gold-soft);}
.btn-orange{background:linear-gradient(135deg,#e08a2c,#c0691a); color:#fff; border:none;}
.btn-orange:hover{filter:brightness(1.08);}
.btn-block{width:100%; margin-top:12px; padding:11px; font-size:14px; font-weight:700;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

/* ============== 暗黑奇幻精修层（在现有主题之上叠加；不动引擎/现有类名） ============== */
:root{
  --gold-glow: rgba(201,162,39,.30);
  --font-display: "Cinzel","Trajan Pro","Songti SC","STSong",Georgia,"Times New Roman",serif;
  --panel-grad: linear-gradient(158deg, rgba(30,34,54,.97), rgba(13,15,25,.97));
  --hairline-gold: rgba(201,162,39,.20);
}
/* 敕造纪元氛围：更沉的暗底 + 底部余烬微光 + 暗角 */
body{
  background-image:
    radial-gradient(900px 620px at 50% 122%, rgba(138,46,22,.20), transparent 60%),
    radial-gradient(760px 520px at 86% 8%, rgba(82,52,150,.13), transparent 60%),
    radial-gradient(620px 480px at 12% 92%, rgba(40,70,120,.10), transparent 60%),
    radial-gradient(1300px 900px at 50% 38%, #0c0e18 0%, #05060b 100%);
}
/* 衬线标题（史诗感） */
.brand,.sb-title,.sb-header .sb-title,.modal-title,.gate-title,.sb-sub{
  font-family: var(--font-display);
  letter-spacing: 2px;
}
.brand{ text-shadow: 0 0 16px var(--gold-glow), 0 1px 0 #000; }
/* 矢量图标统一 */
.gi{ width:1em; height:1em; fill:currentColor; vertical-align:-0.14em; flex-shrink:0; }
.sb-icon{ color: var(--gold-soft); }
/* 面板：渐变表面 + 金描边微光 */
.sidebar,.dock-col,.sb-stat-block{
  background-image: var(--panel-grad);
  border-color: var(--hairline-gold) !important;
}
#topbar,#chatDock{
  background-image: linear-gradient(180deg, rgba(20,22,36,.97), rgba(10,12,20,.97));
  border-color: var(--hairline-gold) !important;
}
/* 滚动条：暗紫金属感 */
*::-webkit-scrollbar{ width:9px; height:9px; }
*::-webkit-scrollbar-track{ background: rgba(0,0,0,.35); }
*::-webkit-scrollbar-thumb{
  background: linear-gradient(180deg,#3a3358,#241f38);
  border-radius:6px; border:1px solid rgba(201,162,39,.22);
}
*::-webkit-scrollbar-thumb:hover{ background: linear-gradient(180deg,#4a4170,#2e2748); }
/* 血/蓝/经验条流光 */
@keyframes gi-sheen{ 0%{ transform:translateX(-120%);} 55%,100%{ transform:translateX(260%);} }
.bar>i,.sb-bar>i{ position:relative; overflow:hidden; }
.bar>i::after,.sb-bar>i::after{
  content:""; position:absolute; top:0; left:0; width:42%; height:100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
  animation: gi-sheen 3.4s ease-in-out infinite;
}
/* 按钮：金描边 + 悬停微光 */
.btn{ border-color: rgba(201,162,39,.30); }
.btn:hover{ box-shadow: 0 0 12px var(--gold-glow); }
.btn.on{ box-shadow: 0 0 14px rgba(201,162,39,.45); }
/* 选中文字 */
::selection{ background: rgba(201,162,39,.32); color:#fff; }
/* 顶栏品牌图标 */
.brand .gi{ width:1.15em; height:1.15em; color: var(--gold-soft); }
/* 模态更具质感 */
.modal-box{
  background-image: var(--panel-grad);
  border:1px solid rgba(201,162,39,.32);
  box-shadow:0 26px 72px rgba(0,0,0,.72), 0 0 0 1px rgba(0,0,0,.5);
}
/* 侧栏头像框金边 */
.sb-avatar{ border:1px solid rgba(201,162,39,.3); box-shadow: inset 0 0 14px rgba(0,0,0,.5); }
/* 导航项激活态流光左边框 */
.sb-item.active{
  background: linear-gradient(90deg, rgba(201,162,39,.12), rgba(201,162,39,.02));
  box-shadow: inset 0 0 18px rgba(201,162,39,.06);
}

/* ===== 物品徽章（暗黑奇幻矢量重做：稀有度底色 + 内发光 + 矢量图标） ===== */
.item-badge{
  display:inline-flex; align-items:center; justify-content:center;
  border-radius:9px; position:relative; flex-shrink:0; vertical-align:middle;
  background:
    radial-gradient(circle at 50% 28%, color-mix(in srgb, var(--bc) 60%, #ffffff 8%), transparent 62%),
    linear-gradient(160deg, color-mix(in srgb, var(--bc) 88%, #000 8%), color-mix(in srgb, var(--bc) 52%, #000 46%));
  border:1px solid color-mix(in srgb, var(--bc) 72%, #ffffff 28%);
  box-shadow: inset 0 1px 2px rgba(255,255,255,.5), inset 0 -3px 7px rgba(0,0,0,.5), 0 2px 5px rgba(0,0,0,.5);
}
.item-badge::before{
  content:''; position:absolute; left:2px; right:2px; top:2px; height:40%;
  border-radius:7px 7px 12px 12px; background:linear-gradient(180deg, rgba(255,255,255,.3), transparent);
  pointer-events:none;
}

/* 爆物横幅样式已移除（掉落改战斗信息栏高亮行） */

/* 背包外框（双层边框 + 标题） */
.bag-box{
  border:2px solid rgba(180,160,120,.2); border-radius:12px;
  padding:10px 12px 8px; background:var(--panel3); box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);
}
.bag-box-title{font-size:11px; color:var(--dim); padding-bottom:8px; margin-bottom:4px; border-bottom:1px solid var(--line); letter-spacing:2px; text-align:center;}

/* 统一人物页：状态面板 */
.char-unified{display:flex; gap:16px; flex-wrap:wrap;}
.cs-section{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; flex:1; min-width:260px;}
.cs-sectitle{font-size:12px; font-weight:600; color:var(--gold-soft); margin-bottom:8px; letter-spacing:1px;}
.cs-row{display:flex; align-items:center; gap:8px; padding:4px 0; border-bottom:1px dashed rgba(255,255,255,.04); font-size:12px;}
.cs-icon{font-size:14px; width:20px; text-align:center; flex-shrink:0;}
.cs-label{flex:1; color:var(--dim); min-width:60px;}
.cs-base{color:var(--ink); min-width:22px; text-align:center;}
.cs-bonus{color:var(--green); font-weight:600; min-width:30px; text-align:center;}
.cs-total{color:var(--ink); font-weight:700; min-width:22px; text-align:center;}
.cs-val{font-weight:600; text-align:right;}
.cs-bar{width:44px; height:5px; background:rgba(0,0,0,.3); border-radius:3px; overflow:hidden; flex-shrink:0;}
.cs-fill{height:100%; border-radius:3px; transition:width .3s;}

/* 人物页子标签 */
.char-subs{display:flex; gap:6px; margin-bottom:12px;}
.char-subtab{flex:1; padding:8px 14px; border-radius:9px; cursor:pointer; font-size:13px; text-align:center; background:var(--panel2); border:1px solid var(--line); color:var(--dim); font-weight:600; transition:.15s;}
.char-subtab:hover{border-color:var(--gold); color:var(--ink);}
.char-subtab.on{background:linear-gradient(180deg, rgba(201,162,39,.15), rgba(201,162,39,.04)); border-color:rgba(201,162,39,.3); color:var(--gold-soft);}
/* 背包页装备槽（2列竖排，角色图右侧） */
.equip-slots{display:grid; grid-template-columns:1fr 1fr; gap:4px; flex:0 0 130px; width:130px; align-content:start;}
.e-slot{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:4px 2px; border-radius:8px; border:1px solid var(--line); background:var(--panel3);
  aspect-ratio:1/1; cursor:pointer; transition:.15s; gap:1px; min-height:54px;
}
.e-slot:hover{border-color:var(--gold); transform:translateY(-1px);}
.e-slot.sel{border-color:var(--gold-soft); box-shadow:0 0 0 2px rgba(201,162,39,.3);}
.e-filled{border-color:rgba(180,160,120,.2);}
.e-empty{cursor:default; opacity:.35; border-style:dashed;}
.e-empty:hover{transform:none; border-color:var(--line);}
.e-empty-icon{width:18px; height:18px; color:var(--dim);}
.e-slot-name{font-size:9px; color:var(--dim); font-weight:600; line-height:1; white-space:nowrap;}
.e-filled .e-slot-name{color:var(--ink);}

.bag-layout{display:flex;gap:16px;align-items:flex-start;}
.bag-main{flex:1;min-width:0;}
.bag-inspect{flex:0 0 300px;width:300px;position:sticky;top:8px;align-self:flex-start;
  background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:220px;
  box-shadow:0 6px 20px rgba(0,0,0,.35);}
.inspect-empty{color:var(--dim);text-align:center;padding:40px 10px;font-size:12px;line-height:1.8;}
.inspect-empty-icon{color:var(--line);margin-bottom:10px;}
.inspect-empty-icon svg{width:42px;height:42px;}
.inspect-head{display:flex;gap:12px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:10px;}
.inspect-icon{flex-shrink:0;width:50px;height:50px;display:flex;align-items:center;justify-content:center;}
.inspect-name{font-size:14px;font-weight:700;}
.inspect-sub{font-size:11px;color:var(--dim);margin-top:2px;}
.inspect-body{padding:6px 0;}
.inspect-stat{font-size:12px;color:var(--ink);margin:3px 0;}
.inspect-stat.aff{color:var(--green);}
.inspect-stat.set{color:var(--orange);font-size:11px;}
.inspect-desc{font-size:11.5px;color:var(--dim);line-height:1.6;margin-bottom:8px;}
.inspect-req{font-size:11px;color:var(--gold-soft);margin-top:6px;}
.inspect-cmp{margin:8px 0;padding:8px 10px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;}
.cmp-head{font-size:11px;color:var(--dim);margin-bottom:6px;}
.cmp-row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;color:var(--ink);}
.cmp-row.up span:last-child{color:var(--green);font-weight:600;}
.cmp-row.down span:last-child{color:var(--crimson);font-weight:600;}
.cmp-row.flat span:last-child{color:var(--dim);}
.inspect-cmp2{display:flex;gap:8px;margin:10px 0;}
.cmp2-col{flex:1;min-width:0;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:8px;}
.cmp2-name{font-size:11px;font-weight:600;padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid currentColor;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cmp2-col .inspect-stat{font-size:11px;line-height:1.5;}
.inspect-warn{font-size:11px;color:var(--crimson);margin-top:6px;}
.bag-act{width:100%;margin-top:12px;padding:10px;border-radius:8px;border:1px solid var(--gold);
  background:rgba(201,162,39,.18);color:var(--gold-soft);font-size:13px;font-weight:700;cursor:pointer;
  backdrop-filter:blur(2px);transition:background .15s,opacity .15s;}
.bag-act:hover{background:rgba(201,162,39,.34);}
.bag-act:disabled{background:rgba(120,120,120,.12);border-color:var(--line);color:var(--dim);cursor:not-allowed;}
.bag-act.danger{border-color:var(--crimson);background:rgba(192,57,43,.16);color:#f0a9a3;}
.bag-act.danger:hover{background:rgba(192,57,43,.30);}
.inv-cell.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,162,39,.45);}
@media(max-width:880px){ .bag-layout{flex-direction:column;} .bag-inspect{width:100%;flex-basis:auto;position:static;} }
/* 角色面板 - 身上装备 */
.char-equip-row{display:flex;align-items:center;gap:10px;padding:7px 8px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;cursor:pointer;background:rgba(255,255,255,.02);transition:border-color .15s,background .15s;}
.char-equip-row:hover{border-color:var(--gold);background:rgba(201,162,39,.07);}
.char-equip-row.empty{opacity:.7;cursor:default;}
.char-equip-row.empty:hover{border-color:var(--line);background:rgba(255,255,255,.02);}
.char-equip-ic{width:30px;height:30px;flex:0 0 30px;display:flex;align-items:center;justify-content:center;}
.char-equip-name{flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.char-equip-slot{flex:0 0 auto;font-size:10.5px;color:var(--dim);}
.char-equip-caret{flex:0 0 auto;font-size:10px;color:var(--gold-soft);}
.char-equip-detail{padding:10px 12px;margin:-2px 0 9px;border:1px solid var(--gold);border-radius:9px;background:rgba(201,162,39,.05);}
.e-wear-dot{width:6px;height:6px;border-radius:50%;margin-top:1px;}
/* 锻造铺 - 修理按钮 */
.repair-btn{background:linear-gradient(180deg,#8e9aab,#5a687a);color:#fff;border:none;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;margin-top:8px;transition:.15s;}
.repair-btn:hover{filter:brightness(1.1);}
/* 管理员调试面板 */
.debug-panel{display:none;position:fixed;top:80px;right:12px;z-index:99;width:200px;background:rgba(14,16,26,.95);border:1px solid var(--gold);border-radius:10px;padding:12px;font-size:11px;box-shadow:0 4px 20px rgba(0,0,0,.6);}
.debug-panel h4{color:var(--gold);margin:0 0 8px;font-size:13px;}
.debug-btn{display:block;width:100%;margin:3px 0;padding:5px 8px;background:var(--panel3);border:1px solid var(--line);border-radius:5px;color:var(--ink);cursor:pointer;text-align:left;font-size:11px;}
.debug-btn:hover{border-color:var(--gold);color:var(--gold-soft);}
.attr-btn{width:20px;height:20px;border-radius:5px;border:1px solid var(--line);background:var(--panel3);color:var(--ink);cursor:pointer;font-weight:700;font-size:12px;text-align:center;line-height:18px;margin:0 2px;}
.attr-btn-plus:hover{border-color:var(--green);color:var(--green);}
.attr-btn-minus:hover{border-color:var(--crimson);color:var(--crimson);}
.btn-gold{background:linear-gradient(135deg,#c9a227,#8b6914);color:#fff;border:none;}
/* ==================== 怪物图鉴 ==================== */
.bs-group{margin-bottom:18px;}
.bs-group-h{font-size:14px;font-weight:700;color:var(--gold-soft);margin:6px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line);}
.bs-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;transition:.15s;}
.bs-card:hover{border-color:var(--gold);}
.bs-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.bs-emoji{font-size:30px;flex-shrink:0;}
.bs-title{flex:1;min-width:0;}
.bs-name{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.bs-badge{font-size:10px;font-weight:700;color:#1a1d28;padding:1px 7px;border-radius:6px;}
.bs-fam{font-size:11px;color:var(--dim);background:rgba(255,255,255,.06);padding:1px 7px;border-radius:6px;}
.bs-sub{font-size:11px;color:var(--dim);margin-top:2px;}
.bs-lore{font-size:12.5px;line-height:1.7;color:var(--ink);}
.bs-row{margin:2px 0;}
.bs-k{display:inline-block;min-width:34px;color:var(--gold-soft);font-weight:600;margin-right:6px;font-size:11px;}
.bs-story{margin-top:6px;padding:8px 10px;background:rgba(0,0,0,.22);border-left:2px solid var(--gold);border-radius:0 8px 8px 0;color:var(--dim);font-size:12px;line-height:1.7;}
.bs-skills{margin-top:8px;line-height:1.9;}
.bs-skills .bs-k{margin-bottom:2px;}
.bs-chip{display:inline-flex;align-items:center;gap:4px;margin:0 5px 4px 0;padding:2px 9px;border-radius:14px;font-size:11.5px;background:rgba(74,158,255,.10);border:1px solid rgba(74,158,255,.25);color:#9fd0ff;}
/* 图鉴分栏格子式布局 */
.bs-layout{display:flex;gap:16px;align-items:flex-start;}
.bs-list{flex:1;min-width:0;}
.bs-detail{width:300px;flex-shrink:0;position:sticky;top:8px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:200px;max-height:78vh;overflow:auto;}
.bs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;}
.bs-cell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer;transition:.15s;}
.bs-cell:hover{border-color:var(--gold);transform:translateY(-2px);}
.bs-cell-sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(220,170,80,.35);}
.bs-cell.locked{cursor:default;opacity:.55;}
.bs-cell.locked:hover{border-color:var(--line);transform:none;}
.bs-cell-emoji{height:56px;display:flex;align-items:center;justify-content:center;margin-bottom:4px;}
.bs-cell-emoji img{width:56px;height:56px;object-fit:contain;}
.bs-cell-name{font-size:11px;color:var(--ink);line-height:1.3;min-height:28px;display:flex;align-items:center;justify-content:center;}
.bs-cell-badge{display:inline-block;font-size:9px;font-weight:700;color:#1a1d28;padding:1px 6px;border-radius:6px;margin-top:2px;}
.bsd-wrap{display:flex;gap:14px;}
.bsd-img{flex-shrink:0;width:160px;height:160px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.2);border-radius:10px;}
.bsd-img img{width:160px;height:160px;object-fit:contain;}
.bsd-info{flex:1;min-width:0;}
.bsd-name{font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.bsd-sub{font-size:11px;color:var(--dim);margin-top:2px;margin-bottom:8px;}
.bsd-lore{font-size:12.5px;line-height:1.7;color:var(--ink);}
.bsd-skills{margin-top:8px;line-height:1.9;}
.bsd-skills .bs-k{margin-bottom:2px;}
.bsd-hint,.bsd-locked{color:var(--dim);font-size:13px;text-align:center;padding:40px 10px;}
</style>
</head>
<body>

<div id="app" style="display:none;">
  <header id="topbar"></header>
  <main id="main">
    <!-- 左侧边栏：导航 / 好友 -->
    <aside class="sidebar" id="sidebarLeft">
      <div class="sb-header">
        <div class="sb-title">⚔️ 探索</div>
        <div class="sb-sub">地图 · 商店 · 队伍</div>
      </div>
      <nav class="sb-nav" id="sbNavLeft"></nav>
      <!-- 好友栏 -->
      <div class="sb-friends" id="sbFriends">

const ACC_SLOT_NAME = {hands:'护手', ring:'印戒', amulet:'牌符'};
/* 前缀：根据装备主词条的属性概括生成（如「勇敢的骑士长靴」「智慧的士兵头盔」） */
/* 🔒 GDD 02 A13 守卫：这里不得出现任何稀有度名（无印/注籍/批准/特许/敕造/未录） */
const PREFIX_BY_STAT = {
  atk: ['锐利的','破法的'], def: ['坚壁的','城防的'], hp: ['坚忍的','厚血的'],
  spd: ['疾行的','轻捷的'], critP:['狠戾的','裂甲的'], critS:['咒击的','秘刺的'],
  critDmg:['断罪的','重裁的'], str:['执戟的','悍勇的'], agi:['走脚的','灵巧的'],
  int: ['通咒的','释卷的'], lifesteal:['汲血的','噬印的'], dmgReduce:['铁律的','免检的'],
  goldFind:['抽成的','贪墨的'],
  /* GDD 05b 新增 stat 的命名（否则新词缀装备会全部退化成无前缀的光秃名字） */
  crit:['狠戾的','裂甲的'], con:['磐石的','铁骨的'], spi:['守心的','静气的'],
  atkPct:['开锋的','裂律的'], defPct:['固壁的','重铠的'], spdPct:['疾行的','风蹄的'],
  mdef:['矩防的','抗咒的'], skillDmg:['释卷的','咏印的'], eliteBossDmg:['判押的','缉捕的'],
  cdr:['回响的','速咏的'],
};
function mainAffixStat(it){
  if(!it.affixes || !it.affixes.length) return null;
  const cnt={};
  it.affixes.forEach(a=>{ if(a.stat!=='skillLv') cnt[a.stat]=(cnt[a.stat]||0)+1; });
  let best=null, bn=0;
  for(const k in cnt){ if(cnt[k]>bn){ bn=cnt[k]; best=k; } }
  return best;
}
function equipBaseName(it){
  if(it.slot==='weapon'){ const wt=WEAPON_TYPES[it.wType]; return wt?wt.name:(it.wType||'武器'); }
  if(it.armorType){
    const tiers = ARMOR_TIERS_BY_TYPE[it.armorType] || ARMOR_TIERS_BY_TYPE.plate;
    const t = (it.tierIdx!=null && tiers[it.tierIdx]) ? tiers[it.tierIdx] : tiers[0];
    const sn = ARMOR_SLOT_NAME[it.armorType];
    const slotN = it.slot==='feet' ? t.boot : (sn?sn[it.slot]:'装备');
    return t.name + slotN;
  }
  /* 兼容旧存档/无类型 */
  const g={head:'盔',armor:'甲',feet:'靴'};
  return (g[it.slot]||ACC_SLOT_NAME[it.slot]||'装备');
}
function equipName(it){
  const base=equipBaseName(it);
  const st=mainAffixStat(it);
  if(st && PREFIX_BY_STAT[st]){
    const arr=PREFIX_BY_STAT[st];
    const pre = (it.affixes && it.affixes.length>=2) ? arr[1] : arr[0];
    return pre + base;
  }
  return base;
}

/* 技能与当前武器是否匹配：weapons=null 不限；否则须装备指定类型武器 */
function skillWeaponOk(def){
  if(!def || !def.weapons) return true;
  const wp = G && G.player && G.player.equip && G.player.equip.weapon;
  return !!(wp && def.weapons.indexOf(wp.wType)>=0);
}
/* 卸下所有与当前武器不匹配的已装备主动技能 */
function purgeInvalidSkills(){
  if(!G||!G.player) return;
  const es=G.player.equippedSkills||[];
  for(let i=es.length-1;i>=0;i--){
    const d=SKILLS[es[i]];
    if(d && d.weapons && !skillWeaponOk(d)){
      pushLog('sys','⚠️ 武器更换，【'+d.name+'】已自动卸下（武器不匹配）');
      es.splice(i,1);
    }
  }
  G.player.equippedSkills=es;
}
/* 装备技能到主动栏 */
function equipSkill(id){
  const es=G.player.equippedSkills||[];
  if(es.indexOf(id)>=0){toast('该技能已装备'); return;}
  if(es.length>=5){toast('最多装备5个主动技能'); return;}
  const d=SKILLS[id]; if(!d||d.type==='aura'){toast('光环请使用光环栏装备'); return;}
  es.push(id); G.player.equippedSkills=es;
  toast('已装备【'+d.name+'】');
  save(); renderAll();
}
/* 卸下技能 */
function unequipSkill(id){
  const es=G.player.equippedSkills||[];
  const i=es.indexOf(id); if(i<0) return;
  es.splice(i,1); G.player.equippedSkills=es;
  save(); renderAll();
}

function auraBonuses(){

  if(!G || !G.player) return b;

const SKILL_ATTR_REQ = {base:3, mid:10, high:18};
function skillReq(id){
  const d=SKILLS[id]; if(!d) return {str:0, agi:0, int:0};

  return {str: d.attr==='str'?r:0, agi: d.attr==='agi'?r:0, int: d.attr==='int'?r:0};
}

function genBossUnique(bossKey){
  const d=BOSS_DROPS[bossKey]; if(!d || !d.equip) return null;
  const e=d.equip;
  const bt=bossTierOf(bossKey);
  return {
    uid:itemUid++, slot:e.slot, name:e.name, rarity:'legendary', rarityName:'敕造', unique:true,
    base:Object.assign({},e.base), affixes:e.affixes.map(a=>Object.assign({},a)), setId:null,
    wType:e.wType||undefined, armorType:e.armorType||undefined,
    tierIdx:(e.tierIdx!=null?e.tierIdx:undefined), reqLv:e.reqLv||undefined,
    ilv:ML_map(bt!=null?bt:0),   /* Boss 专属：ilv = 该 Boss 所在图的 ML_map（GDD 05b §3.1） */
    bossKey:bossKey,             /* 供 itemTier() 判定归属 tier */
  };
}

/* ==================== 未录（第六档）· 敕令共鸣系统 ====================
   设计依据：GDD 04b §9.3 / §9.4 / §9.5；技术方案：.workbuddy/T4_rarity_analysis.md §4
   三层结构：
     1) 数据层  BOSS_DROPS[bossKey].mythic —— 每个 Boss 唯一的一件红色未录
     2) 生成层  genMythic / rollBossLoot   —— 掉落、保底、独一性
     3) 效果层  UNIQ_EFFECTS + fireHook    —— 钩子总线，只在既有战斗流程的"边界"派发，
                不改写 castSkill / dealDamage / generateAffixes 的原有主体逻辑
   钩子点：battleStart / turnStart / preCast / postCast / preDamage / postDamage / onKill / incoming
   ==================================================================== */

/* ---- 独一性状态（按 bossKey 持久化；分解不回收，永不再掉） ---- */
function mythicState(){
  if(!G.ownedMythic)    G.ownedMythic={};
  if(!G.bossKillStreak) G.bossKillStreak={};
  return G;
}
function mythicOwned(bossKey){ return !!(G.ownedMythic && G.ownedMythic[bossKey]); }

/* ---- 生成一件未录实例：固定 base + 随机 5 条词缀（品质倍率 2.6） ---- */
function genMythic(bossKey){
  const d=BOSS_DROPS[bossKey]; if(!d || !d.mythic) return null;
  const m=d.mythic;
  const ri=rarObj('unrecorded');
  const bt=bossTierOf(bossKey);
  const ilv=ML_map(bt!=null?bt:(G.mapTier||0));   /* 未录：ilv = 该 Boss 所在图的 ML_map */
  return {
    uid:itemUid++, slot:m.slot, name:m.name,
    rarity:'unrecorded', rarityName:'未录', unique:true,
    base:Object.assign({}, m.base),
    affixes:generateAffixes(ri, ilv, m.slot, m.wType),
    setId:null, ilv:ilv,
    wType:m.wType||undefined, armorType:m.armorType||undefined,
    tierIdx:(m.tierIdx!=null?m.tierIdx:undefined),
    reqLv:Math.min(m.reqLv||1, MAX_LEVEL),
    mythic:{id:m.id, bossKey:bossKey, skill:m.skill, desc:m.desc, cost:m.cost},
  };
}

/* ---- Boss 特殊掉落：单次击杀至多 1 件（未录 > 专属书 > 敕造），其余仍走普通掉落 ---- */
function rollBossLoot(bossKey, loot){
  const bd=BOSS_DROPS[bossKey]; if(!bd) return false;
  mythicState();
  /* 1) 未录：基础 5%；同一 Boss 连续 20 次未出必掉；已拥有则完全跳过（独一性） */
  if(bd.mythic && !mythicOwned(bossKey)){
    const streak=G.bossKillStreak[bossKey]||0;
    const pity=streak>=20;
    if(pity || Math.random()<0.05){
      const it=genMythic(bossKey);
      if(it){
        loot.items.push(it);
        G.ownedMythic[bossKey]=true;
        G.bossKillStreak[bossKey]=0;
        pushLog('sys','🔴 未录降世！【'+it.name+'】'+(pity?'（保底）':''), {hl:true, color:'#e6443b'});
        return true;
      }
    }
    G.bossKillStreak[bossKey]=streak+1;
  }
  /* 2) Boss 专属技能书 5%（新 7 王暂无 book，见任务 #13） */
  if(bd.book && SKILLS[bd.book] && Math.random()<0.05){
    loot.books.push(bd.book);
    pushLog('sys','🔥 稀世掉落！BOSS 专属技能书【'+SKILLS[bd.book].name+'】');
    return true;
  }
  /* 3) 敕造专属（仅旧 3 王有 equip）：3%，连续 10 次未出保底 */
  if(bd.equip){
    const st=G.player.bossLegendaryStreak||0;
    if(st>=10 || Math.random()<0.03){
      const u=genBossUnique(bossKey);
      if(u){
        loot.items.push(u);
        pushLog('sys','🔥 稀世掉落！敕造装备【'+u.name+'】'+(st>=10?'（保底）':''));
        G.player.bossLegendaryStreak=0;
        return true;
      }
    }
    G.player.bossLegendaryStreak=st+1;
  }
  return false;
}
/* 即时版（killEnemy 用）：物品直接入背包而非走 loot 对象 */
function rollBossLootInstant(bossKey){
  const bd=BOSS_DROPS[bossKey]; if(!bd) return;
