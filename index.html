    }
    G.bossKillStreak[bossKey]=streak+1;
  }
  if(bd.book&&SKILLS[bd.book]&&Math.random()<0.05){ giveBook(bd.book); pushLog('sys','🔥 BOSS技能书【'+SKILLS[bd.book].name+'】'); }
  if(bd.equip){
    const st=G.player.bossLegendaryStreak||0;
    if(st>=10||Math.random()<0.03){ const u=genBossUnique(bossKey); if(u){ G.player.inventory.push(u);
      pushLog('sys','🔥 敕造装备【'+u.name+'】'+(st>=10?'（保底）':'')); G.player.bossLegendaryStreak=0; }
    } else { G.player.bossLegendaryStreak=st+1; }
  }
}

/* ---- 敕令共鸣（§9.4 授予 + 强化 + 改写） ----
   授予：装备时若未学过绑定技能，自动学到 1 级（否则 skillLv 类加成对未学技能无效）
   强化：skillLevel() 对绑定技能额外 +1 级（沿用其 10 级封顶）
   改写：UNIQ_EFFECTS 在战斗钩子点重写该技能的行为                                */
function syncMythicSkills(){
  if(!G || !G.player || !G.player.equip || !G.player.skills) return;
  for(const slot in G.player.equip){
    const e=G.player.equip[slot];
    if(e && e.mythic && e.mythic.skill && SKILLS[e.mythic.skill] && !G.player.skills[e.mythic.skill]){
      G.player.skills[e.mythic.skill]=1;
    }
  }
}
function equippedMythics(){
  const out=[]; if(!G || !G.player || !G.player.equip) return out;
  for(const slot in G.player.equip){ const e=G.player.equip[slot]; if(e && e.mythic && e.mythic.id) out.push(e.mythic); }
  return out;
}
function mythicIds(){ return equippedMythics().map(function(m){ return m.id; }); }
function hasMythic(id){ return equippedMythics().some(function(m){ return m.id===id; }); }

/* ---- 钩子总线：只对携带未录的单位派发；单件效果异常不打断战斗主流程 ---- */
function fireHook(u, hook, ctx){
  if(!u || !u.uniq || !u.uniq.length) return ctx;
  for(let i=0;i<u.uniq.length;i++){
    const eff=UNIQ_EFFECTS[u.uniq[i]];
    if(eff && typeof eff[hook]==='function'){
      try{ eff[hook](ctx); }catch(err){ /* 静默：单件未录效果异常不应中断战斗 */ }
    }
  }
  return ctx;
}
/* 龙裔判定：只读怪物定义（family / art.body / 名字），不改 MONSTERS 与美术枚举 */
function isDragonkin(u){
  if(!u) return false;
  if(u.family==='drakeborn') return true;
  if(u.art && /drake|wyrm|dragon/i.test(u.art.body||'')) return true;
  return /龙/.test(u.name||'');
}
function mythLog(txt){ pushLog('player','🔴 '+txt, {color:'#e6443b'}); }

/* ---- 未录数值常量（GDD 05b §6）：全部数据驱动，调参不改逻辑 ----
   🔴 §6 的审计结论：④熔印锻律锤 与 ⑧初录缚龙牌 存在【跨战斗永久叠加】(mythicStr/mythicHp)，
      绕过 T1 上界体系；⑥削籍失名印的【越级穿装】击穿 ilv 门控。三件全量重设计，
      收益一律收敛回"仅本场战斗"（反无敌闸门 G4）。 */
const UNIQ_TUNING = {
  /* ④ 锻痕：每层 +4% 攻击 / +5% 受伤，上限 8 层，战斗开始清零。
     8×4% = +32% 与一条 T1「敕锋」(42~50%) 同档 —— 它是"一条会自己长出来的顶级词缀"，
     而不是一个绕过词缀系统的外挂；+40% 受伤则要求你必须在满层前把对方打死。 */
  MYTH_FORGE:  {maxStacks:8, atkPerStack:0.04, takenPerStack:0.05},
  /* ⑧ 缚龙：每杀 1 只龙裔 → 本场最大生命 +2%(cap 20%) / 攻击 +1.5%(cap 15%)，
     代价是受非龙裔伤害 +3%/层(cap 30%) —— 把"必刷的永久 buff"变成"专精屠龙 vs 通用"的流派选择。 */
  MYTH_DRAGON: {dmgVsDragon:0.40, hpPerKill:0.02, hpCap:0.20, atkPerKill:0.015, atkCap:0.15,
                nonDragonTakenPerKill:0.03, nonDragonTakenCap:0.30},
  /* ⑨ 执印玺：对 BOSS 的追加伤害每场上限 6 次（原为无限次，与判押 eliteBossDmg 叠乘） */
  MYTH_SEAL:   {procChance:0.25, bossProcCap:6, executeThreshold:0.15},
  /* ① 锈冠：必暴时暴伤按 ≤3.5 结算（满 T1 时 critDmg 可达 4.6+，双重乘算会一穿三） */
  MYTH_RUST:   {critDmgCap:3.5},
  /* ② 脱籍戒：999 回合会在 UI/序列化上出问题，收到 99（体感等同"整场不衰减"） */
  MYTH_OZ:     {maxStacks:5, dotTurns:99, atkCut:0.15},
};

/* ---- 10 件未录的独有机制（键 = mythic.id，逐条对应 GDD 04b §9.5 / 05b §6） ---- */
const UNIQ_EFFECTS = {
  /* 1 锈冠·褪印（界桩之怒）：不进CD，改耗15%当前最大生命；下次攻击无视防御且必暴 */
  myth_rust_crown:{
    postCast:function(c){
      if(!c.sk || c.sk.id!=='boundary_wrath') return;
      c.sk.cd=0;
      const pay=Math.round(c.a.maxHp*0.15);
      c.a.hp=Math.max(1, c.a.hp-pay);
      c.a.buffs.push({type:'edictPierce', turns:2});
      mythLog('初敕余响：自损 '+pay+' 生命，下一击无视防御且必暴');
    },
    preDamage:function(c){
      const b=(c.a.buffs||[]).find(function(x){ return x.type==='edictPierce'&&x.turns>0; });
      if(!b) return;
      /* GDD 05b §6.5 微调：无视防御 + 必暴已是双重乘算，暴伤在此夹到 3.5 —— 仍是全游戏最高单发 */
      c.ignoreDef=true; c.forceCrit=true; c.critDmgCap=UNIQ_TUNING.MYTH_RUST.critDmgCap; b.turns=0;
    },
  },
  /* 2 三指·脱籍戒（黑市毒刃）：毒可叠5层且不衰减；满层敌方攻击-15%；代价见 generateLoot */
  myth_oz_ring:{
    postCast:function(c){
      if(!c.sk || c.sk.id!=='blackmarket_toxin') return;
      const t=c.t; if(!t || !t.buffs) return;
      const TU=UNIQ_TUNING.MYTH_OZ;
      t.buffs.forEach(function(x){ if(x.type==='dot' && !x.oz){ x.oz=true; x.turns=TU.dotTurns; } });
      const stacks=t.buffs.filter(function(x){ return x.type==='dot' && x.oz; });
      while(stacks.length>TU.maxStacks){ stacks.shift().turns=0; }
      const n=stacks.length;
      /* 层数按 t.buffs 存 → 切换目标时旧目标的层不迁移（"仅当前目标"由数据结构天然保证，勿改） */
      if(n>=TU.maxStacks && !t._ozCut){ t._ozCut=true; t.atk=Math.round(t.atk*(1-TU.atkCut));
        mythLog('脱籍：毒层满 '+TU.maxStacks+'，'+t.name+' 攻击 -'+Math.round(TU.atkCut*100)+'%'); }
      else mythLog('脱籍：'+t.name+' 毒层 '+n+'/'+TU.maxStacks+'（不再衰减）');
    },
  },
  /* 3 缄口·逆咏牌符（无声圣咏）：伤害转护盾；未受击则下回合炸为全场真伤（≤30%最大生命） */
  myth_edna_charm:{
    battleStart:function(c){ c.u.noHeal=true; c.u._ednaStore=0; c.u._ednaWatch=false; },
    postCast:function(c){
      if(!c.sk || c.sk.id!=='silent_hymn') return;
      const got=c.a._dmgAcc||0; if(got<=0) return;
      c.a.shield+=got;
      c.a._ednaStore=got; c.a._ednaWatch=true;
      c.a._ednaHpMark=c.a.hp; c.a._ednaShMark=c.a.shield;
      mythLog('逆咏：'+got+' 点伤害转为护盾');
    },
    turnStart:function(c){
      const u=c.u; if(!u._ednaWatch) return;
      u._ednaWatch=false;
      const untouched=(u.hp>=(u._ednaHpMark||0)) && (u.shield>=(u._ednaShMark||0));
      if(!untouched) return;
      const val=Math.min(u._ednaStore||0, Math.round(u.maxHp*0.30));
      if(val<=0) return;
      ((c.b&&c.b.enemies)||[]).forEach(function(e){ if(e.hp>0) e.hp=Math.max(0, e.hp-val); });
      mythLog('逆咏爆发：全场真名伤害 '+val);
    },
  },
  /* 4 熔印·锻律锤（狂暴）· GDD 05b §6.2 全量重设计
     旧：G.player.mythicStr += 1，整局永久，cap 30 —— 跨战斗叠加、绕过 T1 上界，且 cd=0 让它一场刷满。
     新：每次施放叠 1 层「锻痕」，仅本场战斗，cap 8；每层 攻击 +4% / 受伤 +5%；战斗开始清零。
     「锻律 = 每一次暴怒，都是把自己再放回炉里锤一遍。越锤越硬，也越脆。」
     注：原「狂暴期受伤 +30%」判定已取消，代价改由锻痕层数承担，避免双重惩罚。 */
  myth_forge_hammer:{
    battleStart:function(c){ c.u._forgeStacks=0; },
    postCast:function(c){
      if(!c.sk || c.sk.id!=='blood_frenzy') return;
      c.sk.cd=0;                                   /* 循环引擎：血怒不进 CD（保留） */
      const TU=UNIQ_TUNING.MYTH_FORGE;
      const cur=c.a._forgeStacks||0;
      if(cur<TU.maxStacks){
        c.a._forgeStacks=cur+1;
        mythLog('锻痕 '+(cur+1)+'/'+TU.maxStacks+'（攻击 +'+Math.round((cur+1)*TU.atkPerStack*100)
          +'%，受伤 +'+Math.round((cur+1)*TU.takenPerStack*100)+'%）');
      }
    },
    preDamage:function(c){
      const n=c.a._forgeStacks||0; if(n<=0) return;
      c.bonusMult *= (1 + n*UNIQ_TUNING.MYTH_FORGE.atkPerStack);
    },
    incoming:function(c){
      const n=c.t._forgeStacks||0; if(n<=0) return;
      c.dmg=Math.round(c.dmg*(1 + n*UNIQ_TUNING.MYTH_FORGE.takenPerStack));
    },
  },
  /* 5 掌典·禁页杖（闪电链）：标"已归档"3回合（受伤+25%、死亡必掉装备）；代价：其出手更快 */
  myth_codex_staff:{
    postDamage:function(c){
      if(c.a._curSkill!=='chain_lightning') return;
      const t=c.t; if(!t || t.hp<=0) return;
      if((t.buffs||[]).some(function(x){ return x.archived && x.turns>0; })) return;
      t.buffs.push({type:'vuln', val:0.25, turns:3, archived:true});
      t.buffs.push({type:'spdBoost', val:0.10, turns:3});
      t._archived=true;
      mythLog('禁页：'+t.name+' 已归档（受伤 +25%，3 回合）');
    },
  },
  /* 6 削籍·失名印（通用·守护）· GDD 05b §6.4 全量重设计
     盾量 ×2 与盾破代价【不变】；🔴【越级穿装已彻底移除】（见 canEquip）——
     新体系下越级穿装 = 提前拿到高阶词缀 = 65% 毕业度门当场作废，那不是强，是打穿了系统。
     新效果：无视所有装备的【五属性需求】（reqStr/reqAgi/reqInt/reqCon/reqSpi 全跳过），
     但 reqLv 照常生效。叙事完全贴合「它不认得你，也懒得问你有没有资格」，
     且解决了混搭流派的真实痛点（力量流卡 reqInt 30 穿不上好戒指）。 */
  myth_erase_seal:{
    preCast:function(c){ c._shBefore=c.a.shield; },
    postCast:function(c){
      if(!c.sk || c.sk.id!=='uni_guard') return;
      const gain=c.a.shield-(c._shBefore||0);
      if(gain>0){ c.a.shield+=gain; mythLog('失名：护盾翻倍（+'+gain+'）'); }
    },
    incoming:function(c){
      const t=c.t;
      if(t.shield>0 && c.dmg>=t.shield){
        t.buffs.push({type:'atkBoost', val:-0.25, turns:2});
        t.buffs.push({type:'vuln',     val:0.25,  turns:2});
        mythLog('盾破：随机 1 件装备失效 2 回合（攻击 -25%、受伤 +25%）');
      }
    },
  },
  /* 7 初墨·涌源杯（圣光术）：改耗8%当前最大生命换回35%最大生命+净化；首触写初墨印记（本场治疗+50%） */
  myth_ink_cup:{
    preCast:function(c){ c._hpBefore=c.a.hp; },
    postCast:function(c){
      if(!c.sk || c.sk.id!=='heal_light') return;
      const a=c.a;
      a.hp=c._hpBefore;                                   /* 撤销原版治疗，改写为未录版本 */
      const pay=Math.round(a.maxHp*0.08);
      a.hp=Math.max(1, a.hp-pay);                         /* 代价：治疗先自损 */
      if(!a._wellMark){ a._wellMark=true; a.healEff=(a.healEff||0)+0.50; mythLog('初墨印记：本场治疗 +50%'); }
      if(!a.noHeal){
        const amt=Math.round(a.maxHp*0.35*(1+(a.healEff||0)));
        a.hp=Math.min(a.maxHp, a.hp+amt);
        mythLog('涌源：自损 '+pay+'，回复 '+amt+' 并净化');
      }
      a.buffs=a.buffs.filter(function(x){ return x.type!=='dot'&&x.type!=='vuln'&&x.type!=='slow'&&x.type!=='stun'; });
    },
  },
  /* 8 初录·缚龙牌（破甲击）· GDD 05b §6.3 全量重设计
     旧：G.player.mythicHp += 2，整局永久，cap 500 —— 龙冢挂机 250 场就永久 +500 生命，且带出这张图。
     新：每杀 1 只龙裔 → 【仅本场】最大生命 +2%(cap 20%)、攻击 +1.5%(cap 15%)，
         代价：本场每叠 1 层，受到【非龙裔】伤害 +3%(cap 30%)——"你越沉迷登记龙，越忽略背后的东西"。
     G.dragonTally 只作为角色面板的收藏计数，零数值收益。
     ⚠️ maxHp 的战斗内变动只改 unit.maxHp（战斗实例），绝不回写 G.player；战斗结束 playerUnit() 重建自然清零。 */
  myth_dragon_brand:{
    battleStart:function(c){ c.u._dragonStacks=0; c.u._dragonBaseMaxHp=c.u.maxHp; },
    preDamage:function(c){
      const TU=UNIQ_TUNING.MYTH_DRAGON;
      if(isDragonkin(c.t)) c.bonusMult*=(1+TU.dmgVsDragon);
      const n=c.a._dragonStacks||0;
      if(n>0) c.bonusMult*=(1 + Math.min(TU.atkCap, TU.atkPerKill*n));
    },
    postDamage:function(c){
      if(c.a._curSkill!=='sunder_strike') return;
      if(!isDragonkin(c.t) || c.t.hp<=0) return;
      c.t.buffs.push({type:'vuln', val:0.25, turns:2});
      mythLog('缚龙：'+c.t.name+' 必定易伤');
    },
    onKill:function(c){
      if(!isDragonkin(c.t)) return;
      const TU=UNIQ_TUNING.MYTH_DRAGON, a=c.a;
      const n=(a._dragonStacks||0)+1; a._dragonStacks=n;
      const base=a._dragonBaseMaxHp||a.maxHp;
      a.maxHp=Math.round(base*(1+Math.min(TU.hpCap, TU.hpPerKill*n)));
      G.dragonTally=(G.dragonTally||0)+1;          /* 仅收藏计数，无数值收益 */
      mythLog('缚龙 '+n+' 号：本场最大生命 +'+Math.round(Math.min(TU.hpCap,TU.hpPerKill*n)*100)
        +'%、攻击 +'+Math.round(Math.min(TU.atkCap,TU.atkPerKill*n)*100)+'%（战斗结束清零）');
    },
    incoming:function(c){
      const TU=UNIQ_TUNING.MYTH_DRAGON;
      const n=c.t._dragonStacks||0; if(n<=0) return;
      if(!c.a) return;                              /* 来源未知（DoT/真名伤害）：不施加惩罚 */
      if(isDragonkin(c.a)) return;
      c.dmg=Math.round(c.dmg*(1 + Math.min(TU.nonDragonTakenCap, TU.nonDragonTakenPerKill*n)));
    },
  },
  /* 9 掌玺·执印玺（通用·重击）：25% 判"已批准" —— 处决<15%生命的非BOSS；对BOSS该次伤害×2 */
  myth_seal_ring:{
    battleStart:function(c){ c.u._sealProcs=0; },
    postDamage:function(c){
      const TU=UNIQ_TUNING.MYTH_SEAL;
      if(c.a._curSkill!=='uni_strike') return;
      if(Math.random()>=TU.procChance) return;            /* 代价：处决看脸 */
      const t=c.t; if(!t || t.hp<=0) return;
      if(t.isBoss){
        /* GDD 05b §6.6 微调：对 BOSS 的追加伤害每场上限 6 次。
           原实现无次数上限，与 判押(eliteBossDmg) 纯乘算叠乘，长 Boss 战里收益无界。 */
        if((c.a._sealProcs||0) >= TU.bossProcCap) return;
        c.a._sealProcs=(c.a._sealProcs||0)+1;
        const extra=c.res.dmg;
        applyDamage(t, extra, c.a);
        mythLog('已批准：对 '+t.name+' 追加 '+extra+' 伤害（该次×2，本场 '+c.a._sealProcs+'/'+TU.bossProcCap+'）');
      } else if(t.hp < t.maxHp*TU.executeThreshold){
        t.hp=0;
        mythLog('已批准：处决 '+t.name+'！');
      }
    },
  },
  /* 10 初敕·名轮（通咒光环）：按敌人当前生命%追加等量真名伤害（上限50%）；自身永不被治疗 */
  myth_name_wheel:{
    battleStart:function(c){ c.u.noHeal=true; },
    postDamage:function(c){
      const t=c.t; if(!t || t.hp<=0 || !c.res || c.res.dmg<=0) return;
      /* 按「挨这一下之前」的完整度结算：名字越完整，抹除越重（读快照，避免被本次伤害自我稀释） */
      const hp0=(c.tHp0!=null?c.tHp0:t.hp), mx=(c.tMaxHp0!=null?c.tMaxHp0:t.maxHp);
      const pct=Math.min(0.50, mx>0 ? hp0/mx : 0);
      const extra=Math.round(c.res.dmg*pct);
      if(extra<=0) return;
      t.hp=Math.max(0, t.hp-extra);                       /* 真名伤害：无视防御与护盾，不写日志以免刷屏 */
    },
  },
  /* 11 铁证·不破壁垒（坦克专属）：uni_guard 盾量×1.5；盾破全队减伤30% */
  myth_bulwark_armor:{
    battleStart:function(c){ c.u._bulwarkBroken=false; },
    postCast:function(c){
      if(!c.sk || c.sk.id!=='uni_guard') return;
      c.a.shield=Math.round(c.a.shield*1.5);
      mythLog('不破壁垒：守护盾量 ×1.5');
    },
    incoming:function(c){
      if(!c.t._bulwarkBroken && c.t.shield<=0){
        c.t._bulwarkBroken=true;
        const party=Array.isArray(c.b.player)?c.b.player:[c.b.player];
        party.forEach(function(al){
          if(al.hp>0){ al.buffs.push({type:'dmgReduce',val:0.30,turns:3,src:'bulwark'}); }
        });
        mythLog('壁垒破碎！全队减伤 30%（2回合）');
      }
    },
  },
  /* 12 无照·永续慈悲（治疗专属）：heal_light 全体化；额外复活 */
  myth_mercy_amulet:{
    battleStart:function(c){ c.u._mercyReviveUsed=false; },
    postCast:function(c){
      if(!c.sk || c.sk.id!=='heal_light') return;
      const hpCost=Math.round(c.a.maxHp*0.08);
      c.a.hp=Math.max(1, c.a.hp-hpCost);
      /* 全体治疗 10% + 净化 */
      const party=Array.isArray(c.b.player)?c.b.player:[c.b.player];
      party.forEach(function(al){
        if(al.hp<=0) return;
        const h=Math.round(al.maxHp*0.10*(1+(c.a.healEff||0)));
        al.hp=Math.min(al.maxHp, al.hp+h);
        al.buffs=(al.buffs||[]).filter(function(b){ return !isDebuff(b.type); });
      });
      mythLog('永续慈悲：全体恢复 10% 并净化（自耗 '+hpCost+' 生命）');
    },
    /* 额外复活：每场首死队友以 40% 复活 */
    postDamage:function(c){
      if(c.a._mercyReviveUsed) return;
      const t=c.t;
      if(!t || t.side!=='player' || t.hp>0) return;
      c.a._mercyReviveUsed=true;
      t.hp=Math.round(t.maxHp*0.40);
      t.buffs=(t.buffs||[]).filter(function(b){ return !isDebuff(b.type); });
      mythLog('永续慈悲·复活！'+t.name+' 以 40% 生命归来并净化负面');
    },
  },
};

function monsterSVGInner(def, sz){
  const a=(def&&def.art)||{};
  const c1=a.c1||'#6b7a5a', c2=a.c2||'#3e4a30', eye=a.eye||'#ffd24a';
  const body=MON_BODIES[a.body]||MON_BODIES.beast_quad;
  const feat=(a.feature&&MON_FEATURES[a.feature])?MON_FEATURES[a.feature]:MON_FEATURES.none;
  const feat2=(a.feature2&&MON_FEATURES[a.feature2])?MON_FEATURES[a.feature2]:MON_FEATURES.none;
  let inner=body(c1,c2,eye)+feat(c1,c2,eye)+feat2(c1,c2,eye);
  return '<svg viewBox="0 0 24 24" width="'+sz+'" height="'+sz+'" style="vertical-align:middle;">'+inner+'</svg>';
}
function monsterSVGFallback(key, sz){
  return monsterSVGInner(MONSTERS[key]||null, sz||'1em');
}
function monImgTag(img, def, sz, fbSolidKey){
  let onerr;
  if(fbSolidKey){
    /* 透明图缺失：回落实底，杜绝空位（实底必存在） */
    onerr = "this.onerror=null;this.src='assets/monsters/"+fbSolidKey+".png?v=9';";
  } else {
    onerr = "this.onerror=null;this.insertAdjacentHTML('afterend', monsterSVGFallback(this.getAttribute('data-key'), this.getAttribute('data-sz'))); this.remove();";
  }
  return '<img class="mon-img" src="'+img+'" alt="'+esc(def.name||'')+'" data-key="'+(def.key||'')+'" data-sz="'+sz+'" style="width:'+sz+';height:'+sz+';object-fit:contain;" onerror="'+onerr+'">';
}
function monsterSVG(def, px, transparent, thumb){
  const sz=px?px+'px':'1em';
  if(def && def.key && thumb){
    /* 列表缩略图：仍走独立小图（已快），变动最小 */
    return monImgTag('assets/monsters_thumb/'+def.key+'.png?v=9', def, sz, def.key);
  }
  if(def && def.key && window.ATLAS_OK!==false){
    /* 雪碧图：从大图 background-position 抠对应一格，0 次额外网络请求 */
    const atlas = transparent ? ATLAS_ALPHA : ATLAS_MON;
    const r = (atlas && atlas.map) ? atlas.map[def.key] : null;
    if(r){
      const dw = px ? px : r[2];
      const sc = dw / r[2];
      const bw = atlas.w*sc, bh = atlas.h*sc;
      const bx = -(r[0]*sc), by = -(r[1]*sc);
      return '<span class="mon-img" style="display:inline-block;width:'+dw+'px;height:'+(r[3]*sc)+'px;background-image:url(\''+atlas.url+'\');background-repeat:no-repeat;background-size:'+bw+'px '+bh+'px;background-position:'+bx+'px '+by+'px;"></span>';
    }
  }
  /* 兜底：雪碧图缺失/未命中 -> 单只图（透明图回落实底，杜绝空位） */
  let img=null;
  if(def && def.key){ img = transparent ? 'assets/monsters_alpha/'+def.key+'.png?v=9' : ((def.img||'assets/monsters/'+def.key+'.png')+'?v=9'); }
  else if(def && def.img){ img = def.img+'?v=9'; }
  if(img){ return monImgTag(img, def, sz, transparent ? def.key : null); }
  return monsterSVGInner(def, sz);
}

/* ==================== 药水瓶（非消耗品 · 能量制） ====================
   两类：生命瓶(hp) / 法力瓶(mp)。固定容量，击杀怪物充能，战斗中低血/低蓝自动消耗能量回复。
   等级按地图难度产出：难度 t 掉落等级 2t 与 2t+1 的药水瓶。 */
const FLASK_TIERS = [
  {name:'简易', cap:120,  rate:1.2},   /* 难度0 */
  {name:'普通', cap:180,  rate:1.5},
  {name:'中级', cap:260,  rate:1.9},   /* 难度1 */
  {name:'高级', cap:360,  rate:2.4},
  {name:'精良', cap:480,  rate:3.0},   /* 难度2 */
  {name:'卓越', cap:620,  rate:3.7},
  // V1: {name:'宗师', cap:800, rate:4.5}, {name:'传奇', cap:1000, rate:5.4}, 等
];
const FLASK_KINDS = {hp:{name:'生命', color:'#e85d4c'}, mp:{name:'法力', color:'#4a9eff'}};
const FLASK_AFFIXES = [
  {key:'instant',   name:'急涌的', desc:'立即回复：低于阈值时一次性爆发回复', min:0,    max:0},
  {key:'potency',   name:'充盈的', desc:'回复量提升', min:0.15, max:0.45},
  {key:'killCharge',name:'汲取的', desc:'击杀怪物后额外充能', min:0.30, max:0.80},
];
function genFlask(level, kind, noAffix){
  const li=clamp(level,0,FLASK_TIERS.length-1), ft=FLASK_TIERS[li], kd=FLASK_KINDS[kind];
  const affixes=[];
  if(!noAffix){
    const r=Math.random(), n=r<0.30?2:r<0.80?1:0;
    const pool=FLASK_AFFIXES.slice();
    for(let i=0;i<n&&pool.length;i++){
      const a=pool.splice(rand(0,pool.length-1),1)[0];
      const v=+(a.min+Math.random()*(a.max-a.min)).toFixed(2);
      affixes.push({key:a.key, val:v, name:a.name, desc:a.desc});
    }
  }
  const prefix=affixes.length?affixes[0].name:'';
  return {uid:itemUid++, type:'flask', kind, level:li, cap:ft.cap, rate:ft.rate,
    charge:Math.round(ft.cap*(noAffix?0.5:0.35)), affixes,
    name:prefix+ft.name+kd.name+'药水瓶'};
}
function flaskAffix(f,key){ const a=((f&&f.affixes)||[]).find(x=>x.key===key); return a?a.val:0; }
function flaskHas(f,key){ return !!((f&&f.affixes)||[]).find(x=>x.key===key); }
function flaskIconSVG(kind,px){
  var key=kind==='mp'?'flask_mp':'flask_hp';

/* ==================== 工具函数 ==================== */
function rand(a,b){ return Math.floor(a + Math.random()*(b-a+1)); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function pushLog(side, text, opts){
  const o=(typeof opts==='object'&&opts)?opts:(opts?{hl:!!opts}:{});
  G.log.push({side,text,time:Date.now(), hl:!!o.hl, color:o.color||''});
  if(G.log.length>300) G.log.shift();
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600); }
function rarObj(key){ return RARITY.find(r=>r.key===key)||RARITY[0]; }

/* ==================== 属性计算（核心） ==================== */
/* 🔴 BUG-3 修复（GDD 05b §12 #1）：旧实现在末尾用 `s.str = totalStr + (s.strAdd||0)` 覆写，
   而 strAdd 从未被任何代码赋值 —— 装备循环累加进 s.str 的值被整段丢弃，
   五属性词缀（力/敏/体/智/精 × 6 槽 = 30 组配对，占词缀池 32%）全部是死词缀。
   改为三遍法：
     Pass 1  先把装备上的【属性词缀】收进 add.*，得到真正的五主属性；
     Pass 2  用「基础 + 等级成长 + 装备属性」一次性推导 hp/mp/atk/def/crit/…（衍生量能吃到词缀）；
     Pass 3  再叠加【非属性词缀】与装备 base、套装。
   顺序是关键：属性词缀必须在衍生公式【之前】结算，否则 +30 力量不会变成 +72 攻击。 */

function totalStats(){
  const p = G.player;
  const lv = p.level - 1;
  const ATTR_KEYS = ['str','agi','con','int','spi'];

  /* ===== Pass 1：装备上的五属性词缀 ===== */
  const add = {str:0, agi:0, con:0, int:0, spi:0};
  for(const slot of ALL_SLOTS){
    const it = p.equip[slot]; if(!it) continue;
    (it.affixes||[]).forEach(function(a){
      if(!a || typeof a.val!=='number' || !isFinite(a.val)) return;
      if(ATTR_KEYS.indexOf(a.stat)>=0) add[a.stat] += a.val;
      if(a.stat2 && ATTR_KEYS.indexOf(a.stat2)>=0 && typeof a.val2==='number') add[a.stat2] += a.val2;
    });
    /* 装备 base 里的五属性（部分专属装备直接给属性） */
    if(it.base) ATTR_KEYS.forEach(function(k){ if(typeof it.base[k]==='number') add[k]+=it.base[k]; });
  }

  /* 五主属性 = 基础 + 装备加成（无自动成长，纯靠手动分配） */
  const totalStr = p.str + add.str;
  const totalAgi = p.agi + add.agi;
  const totalCon = (p.con||0) + add.con;
  const totalInt = p.int + add.int;
  const totalSpi = (p.spi||0) + add.spi;

  /* 次级属性核心值（按五属性公式推导） */
  const s = {
    hp:0, def:0, crit:0.02, critP:0.02, critS:0.02, critDmg:0,
    lifesteal:0, dmgReduce:0, goldFind:0,
    atk:0, matk:0, spd:35, /* atk/matk/spd 由武器和装备决定 */
    skillDmg:0, eliteBossDmg:0, healEff:0, shieldPct:0, reflectDmg:0, triggerCrit:0, triggerThorns:0, triggerDual:0, triggerShadow:0, triggerMercy:0,
    atkPct:0, spdPct:0, cdr:0, /* GDD 05b 新增：全局乘区，在 playerUnit 出口生效并夹取 */
    str:totalStr, agi:totalAgi, con:totalCon, int:totalInt, spi:totalSpi,
  };

  /* ===== Pass 2：基础衍生属性公式（核心，已吃到属性词缀） ===== */
  /* 生命：80 + 体质×12 + 等级×18 */
  s.hp  = 80 + totalCon*12 + p.level*18;
  /* 魔力：60 + 精神×9 + 等级×12 */
  s.mp  = 60 + totalSpi*9 + p.level*12;
  /* 物理攻击：力量×2.4 + 敏捷×0.6 */
  s.atk = totalStr*2.4 + totalAgi*0.6;
  /* 魔法攻击：智力×2.4 + 精神×0.6 */
  s.matk = totalInt*2.4 + totalSpi*0.6;
  /* 物理防御：体质×1.2 + 敏捷×0.4 */
  s.def = totalCon*1.2 + totalAgi*0.4;
  /* 魔法防御：精神×1.2 + 智力×0.4 */
  s.mdef = totalSpi*1.2 + totalInt*0.4;
  /* 命中率：75% + 敏捷×0.35%（上限95%） */
  s.hit = Math.min(0.95, 0.75 + totalAgi*0.0035);
  /* 闪避率：敏捷×0.30%（上限35%） */
  s.eva = Math.min(0.35, totalAgi*0.0030);
  /* 暴击率：2% + 敏捷×0.22%（上限30%） */
  s.crit = Math.min(0.30, 0.02 + totalAgi*0.0022);
  s.critP = s.crit; s.critS = s.crit;
  /* 暴击伤害：150% + 力量×0.4% + 智力×0.4% */
  s.critDmg = 1.5 + totalStr*0.004 + totalInt*0.004;

  /* ===== Pass 3：装备 base + 非属性词缀 + 套装 =====
     （护甲/饰品加次级，武器攻/法由 weaponPower 单独路由） */
  const setCount = {};
  /* defPct 是【本地】词缀：只放大该件装备自身的 base.def，绝不进全局 s.defPct 求和。
     护甲三型（板/布/皮）本就刻意不等价（GDD 02 §3.4 = 势力站队表达），无等价性约束需要保护。 */
  const applyAffixStat = function(it, stat, val){
    if(stat==='skillLv') return;                        /* 走 skillLevel()，不进属性表 */
    if(ATTR_KEYS.indexOf(stat)>=0) return;              /* 已在 Pass 1 结算 */
    if(stat==='defPct'){ s.def += ((it.base&&it.base.def)||0) * val; return; }
    s[stat] = (s[stat]||0) + val;
  };
  for(const slot of ALL_SLOTS){
    const it = p.equip[slot]; if(!it) continue;
    if(slot==='weapon'){
      /* 武器只贡献攻速与词缀；其基础攻击/法强在 weaponPower 中按绑定属性结算 */
      if(it.base && it.base.spd) s.spd = (s.spd||0) + it.base.spd;
    } else {
      for(const k in it.base){ if(ATTR_KEYS.indexOf(k)>=0) continue; s[k] = (s[k]||0) + it.base[k]; }
    }
    (it.affixes||[]).forEach(function(a){
      if(!a || typeof a.stat!=='string') return;
      if(typeof a.val==='number' && isFinite(a.val)) applyAffixStat(it, a.stat, a.val);
      if(a.stat2 && typeof a.val2==='number' && isFinite(a.val2)) applyAffixStat(it, a.stat2, a.val2);
    });
    if(it.setId) setCount[it.setId] = (setCount[it.setId]||0)+1;
  }

  /* 套装效果 */
  for(const sid in setCount){
    const set = SETS[sid], n = setCount[sid], b = set.bonuses;
    if(b[2]) applyBonus(s,b[2]);
    if(n>=4 && b[4]) applyBonus(s,b[4]);
  }

  /* 五主属性取整输出（数值已在 Pass 1 结清，此处只做展示层取整） */
  s.str = Math.round(totalStr); s.agi = Math.round(totalAgi); s.con = Math.round(totalCon);
  s.int = Math.round(totalInt); s.spi = Math.round(totalSpi);
  return s;

}
function applyBonus(s,b){
  for(const k in b){
    if(['spd','atk','def','hp'].includes(k)) s[k]=(s[k]||0)*(1+b[k]);
    else s[k]=(s[k]||0)+b[k];
  }
}

/* 武器实际攻/法值 = 基础 + 绑定属性 × 加成系数。
   str/agi 武器贡献物理攻击；int 武器贡献魔法攻击（基础攻击同时计入魔法）。 */
function weaponPower(stats){
  const wp = G.player.equip.weapon;
  if(!wp) return {atk:0, matk:0};
  const wt = WEAPON_TYPES[wp.wType];
  if(!wt) return {atk:0, matk:0};
  const attrVal = stats[wt.attr] || 8;
  const bonus = Math.round(attrVal * (wt.attr==='str'?1.5 : wt.attr==='agi'?1.3 : 1.8));
  const flat = (wp.base && wp.base.atk) ? wp.base.atk : 0;
  if(wt.attr==='int') return {atk: flat, matk: flat + bonus}; /* 法杖类：基础攻击转魔法 */
  return {atk: flat + bonus, matk: 0};
}

function skillLevel(id){
  let lv = G.player.skills[id]||0;
  for(const slot of ALL_SLOTS){
    const it=G.player.equip[slot]; if(!it) continue;
    (it.affixes||[]).forEach(a=>{ if(a.stat==='skillLv' && a.skill===id) lv+=a.val; });
    /* 未录·敕令共鸣：绑定技能永久 +1 级（沿用同一 10 级封顶） */
    if(it.mythic && it.mythic.skill===id) lv+=1;
  }
  return Math.min(10, lv);
}

/* 检查装备需求是否满足（等级 + 三属性双重门槛） */
/* ---- 越级穿装的 tier 判定（GDD §9.7 R9 缓解方案：失名印仅桥接 1 个 tier） ----
   playerTier：存档里没有"最高已通关地图"字段（无 clearedMaps/maxTier），G.mapTier 只是当前所选地图、
   会随选图上下跳，拿它当进度会被"进高级图刷一下再退出"白嫖。故采用等级映射：
   Lv60 / 10 档 ≈ 6 级一档，每份存档都有、单调不可逆、确定可测。 */
function playerTier(){
  const lv = (G.player && G.player.level) || 1;
  return clamp(Math.floor((lv-1)/6), 0, MAPS.length-1);
}
function bossTierOf(bossKey){
  for(let i=0;i<MAPS.length;i++){ if(MAPS[i].boss===bossKey) return MAPS[i].tier; }
  return null;
}
/* 物品等级 ilv（GDD 05b §3.1）：决定这件装备能开到哪一阶词缀。
   优先级：落盘字段 ilv > 来源 BOSS 所在地图 tier > 旧档从 reqLv 反推。 */
function ML_map(tier){ return 6 * (clamp(Math.round(tier||0), 0, MAPS.length-1) + 1); }
function itemIlv(item){
  if(!item) return ML_map(0);
  if(typeof item.ilv==='number' && isFinite(item.ilv)) return clamp(Math.round(item.ilv), 1, MAX_LEVEL);
  const bk = (item.mythic && item.mythic.bossKey) || item.bossKey || null;
  if(bk){ const t = bossTierOf(bk); if(t!=null) return ML_map(t); }
  /* 旧档：genEquip 曾用 reqLv=tier*8+rand(0,4)，floor(reqLv/8) 是其精确逆运算 */
  return ML_map(clamp(Math.floor((item.reqLv||1)/8), 0, MAPS.length-1));
}
/* 装备归属 tier：未录/敕造按其来源 BOSS 所在地图 tier（null_seventh=5 等）；
   普通装优先读 ilv（ML_map 的逆运算），旧档回退到 reqLv 反推。 */
function itemTier(item){
  if(!item) return 0;
  const bk = (item.mythic && item.mythic.bossKey) || item.bossKey || null;
  if(bk){ const t = bossTierOf(bk); if(t!=null) return t; }
  if(typeof item.ilv==='number' && isFinite(item.ilv)) return clamp(Math.round(item.ilv/6)-1, 0, MAPS.length-1);
  return clamp(Math.floor((item.reqLv||1)/8), 0, MAPS.length-1);
}
function canEquip(item){
  const s = totalStats();
  let ok = true;
  const reqs = [];
  /* 🔴 GDD 05b §6.4：削籍·失名印的「越级穿装」已【彻底移除】。
     理由：新体系下 ilv=ML_map(tier) 决定词缀开阶，越级穿装 = 在 tier5 就戴上 tier7 掉的装备
     → 拿到 T2 词缀 → 65% 毕业度门当场作废。那不是"强"，那是打穿了系统。
     reqLv 在任何情况下照常生效，对所有装备一视同仁。 */
  if(item.reqLv && G.player.level < item.reqLv){
    ok=false; reqs.push({attr:'lv', need:item.reqLv, have:G.player.level});
  }
  /* 失名印的新效果：无视【五属性需求】（"它不认得你，也懒得问你有没有资格"）。
     解决的是混搭流派的真实痛点——力量流捡到好戒指却卡 reqInt 30。等级与 ilv 门控完全不动。 */
  const nameless = (typeof hasMythic==='function') && hasMythic('myth_erase_seal');
  if(!nameless){
    if(item.reqStr && s.str < item.reqStr){ ok=false; reqs.push({attr:'str', need:item.reqStr, have:s.str}); }
    if(item.reqAgi && s.agi < item.reqAgi){ ok=false; reqs.push({attr:'agi', need:item.reqAgi, have:s.agi}); }
    if(item.reqInt && s.int < item.reqInt){ ok=false; reqs.push({attr:'int', need:item.reqInt, have:s.int}); }
    if(item.reqCon && s.con < item.reqCon){ ok=false; reqs.push({attr:'con', need:item.reqCon, have:s.con}); }
    if(item.reqSpi && s.spi < item.reqSpi){ ok=false; reqs.push({attr:'spi', need:item.reqSpi, have:s.spi}); }
  }
  return {ok, reqs};
}

/* ==================== 锻造系统：分解 / 锻造 / 重铸 ==================== */
/* 碎片材料（按品质分类）：装备分解产出、锻造/重铸消耗 */
const SHARD_TYPES = {
  common:  {name:'白印屑', icon:'🪨', color:'#9aa0a6'},
  refined: {name:'绿印屑', icon:'🔩', color:'#45d98e'},
  blue:    {name:'蓝印屑',   icon:'💠', color:'#4a9eff'},
  purple:  {name:'紫印屑',   icon:'🔮', color:'#b06bff'},
  orange:  {name:'橙印屑',   icon:'🔶', color:'#ff9f3a'},
};
/* 分解产出：按装备品质 + 品质对应碎片 + 数量区间（白=普通碎片2-3、绿=精炼碎片3-6，以此类推） */
const DECOMP_YIELD = {
  common:    {common: [2,3]},
  uncommon:  {refined:[3,6]},
  rare:      {blue:   [4,7]},
  epic:      {purple: [5,9]},
  legendary: {orange: [6,12]},
  unrecorded:{orange: [14,24]}, /* 未录可分解，但需二次确认且分解后永不再掉（§9.3②） */
};
/* 锻造配方：目标品质 → 所需碎片组合 + 金币（锻造必定产出对应品质的随机装备） */
const FORGE_RECIPES = {
  common:    {shards:{common:10},                              gold:50},
  uncommon:  {shards:{refined:25},                            gold:300},
  rare:      {shards:{blue:35, refined:15},                   gold:1500},
  epic:      {shards:{purple:45, blue:20, refined:10},        gold:6000},
  legendary: {shards:{orange:60, purple:30, blue:20, refined:15}, gold:25000},
};
/* 重铸配方：刷新一件装备全部词条，消耗随品质递增的大量碎片 + 金币（持续消耗资源） */
const REFORGE_COST = {
  common:    {shards:{common:15},                                  gold:50},
  uncommon:  {shards:{refined:20, common:10},                     gold:200},
  rare:      {shards:{blue:25, refined:15},                        gold:800},
  epic:      {shards:{purple:30, blue:15},                         gold:3000},
  legendary: {shards:{orange:40, purple:20, blue:10},              gold:12000},
};
/* 单词条重铸配方：刷新一件装备随机单个词条，材料要求是全部重铸的 2 倍（更高精准度代价） */
const SINGLE_REFORGE_COST = {
  common:    {shards:{common:30},                                  gold:100},
  uncommon:  {shards:{refined:40, common:20},                     gold:400},
  rare:      {shards:{blue:50, refined:30},                        gold:1600},
  epic:      {shards:{purple:60, blue:30},                         gold:6000},
  legendary: {shards:{orange:80, purple:40, blue:20},              gold:24000},
};
/* 锻造短冷却（毫秒），禁止疯狂连续点击 */
const FORGE_COOLDOWN = 1500;

/* ---- 材料读写 ---- */
function matGet(t){ return (G.player.materials && G.player.materials[t])||0; }
function matAdd(t,n){ if(n>0){ G.player.materials[t]=(G.player.materials[t]||0)+n; } }
function matCost(shards){ for(const t in shards){ if(matGet(t) < shards[t]) return false; } return true; }
function matSpend(shards){ for(const t in shards){ G.player.materials[t]=matGet(t)-shards[t]; } }
/* 按 uid 在背包与身上查找装备（重铸支持已装备装备） */
function findItem(uid){
  const it=G.player.inventory.find(i=>i.uid===uid); if(it) return it;
  for(const k in G.player.equip){ const e=G.player.equip[k]; if(e&&e.uid===uid) return e; }
  return null;
}
/* 出售估价：按品质基础值 × 难度系数 */
function sellValue(it){
  const base={common:8,uncommon:20,rare:50,epic:120,legendary:300,unrecorded:900}[it.rarity]||10;
  return Math.round(base*(1+G.mapTier*0.6));
}
/* 单件分解实际产出（随机在区间内） */
function decompActual(it){
  const y=DECOMP_YIELD[it.rarity]; if(!y) return null;
  const got={}; for(const t in y){ got[t]=rand(y[t][0],y[t][1]); matAdd(t,got[t]); }
  return got;
}
/* 单件分解区间文本 */
function yieldText(it){
  const y=DECOMP_YIELD[it.rarity]; if(!y) return '不可分解';
  return Object.keys(y).map(t=>SHARD_TYPES[t].icon+SHARD_TYPES[t].name+'×'+y[t][0]+'-'+y[t][1]).join(' ');
}

/* ---- 分解 ---- */
let MYTHIC_DECOMP_ARM=null; /* 未录分解的二次确认标记（记录上一次点击的 uid） */
function decompose(uid){
  const idx=G.player.inventory.findIndex(i=>i.uid===uid); if(idx<0) return;
  const it=G.player.inventory[idx]; if(it.type){ toast('该物品不可分解'); return; }
  /* 未录：可分解，但需二次确认；且 ownedMythic 不回收——分解后该 Boss 永不再掉 */
  if(it.mythic && MYTHIC_DECOMP_ARM!==uid){
    MYTHIC_DECOMP_ARM=uid;
    toast('⚠️ 未录为全局唯一，分解后该 BOSS 永不再掉！再次点击确认');
    return;
  }
  const got=decompActual(it); if(!got){ toast('无法分解该物品'); return; }
  MYTHIC_DECOMP_ARM=null;
  if(it.mythic) pushLog('sys','🔴 未录【'+it.name+'】已被分解，其来源 BOSS 不会再次掉落', {hl:true, color:'#e6443b'});
  G.player.inventory.splice(idx,1);
  const txt=Object.keys(got).map(t=>SHARD_TYPES[t].icon+got[t]).join(' ');
  pushLog('sys','⚒️ 分解 '+it.name+' → '+txt); toast('分解获得 '+txt);
  forgeTutorialMaybe(); /* 首次分解获得印屑后触发锻造教学 */
  save();renderAll();
}
function decomposeByRarity(rar){
  /* 批量分解永远跳过未录（唯一物品必须单件二次确认） */
  const list=G.player.inventory.filter(i=>!i.type && i.rarity===rar && !i.mythic);
  if(list.length===0){ toast('没有可分解的'+rarObj(rar).name+'装备'); return; }
  const tot={};
  list.forEach(it=>{ const g=decompActual(it); for(const t in g) tot[t]=(tot[t]||0)+g[t]; });
  const ids=new Set(list.map(i=>i.uid));
  G.player.inventory=G.player.inventory.filter(i=>!ids.has(i.uid));
  const txt=Object.keys(tot).map(t=>SHARD_TYPES[t].icon+tot[t]).join(' ');
  pushLog('sys','⚒️ 批量分解 '+list.length+' 件 → '+txt); toast('分解 '+list.length+' 件，获得 '+txt);
  forgeTutorialMaybe(); /* 批量分解同样触发 */
  save();renderAll();
}
function decomposeAllWhite(){ decomposeByRarity('common'); }

/* ---- 锻造 ---- */
function canForge(rar){
  const rec=FORGE_RECIPES[rar]; if(!rec) return {ok:false, reason:'未知品质'};
  if(!matCost(rec.shards)) return {ok:false, reason:'碎片不足'};
  if(G.player.gold < rec.gold) return {ok:false, reason:'金币不足'};
  if(G.forgeCd && Date.now()<G.forgeCd) return {ok:false, reason:'冷却中'};
  return {ok:true};
}
function doForge(rar, slot){
  const res=canForge(rar); if(!res.ok){ toast(res.reason); return; }
  const rec=FORGE_RECIPES[rar];
  matSpend(rec.shards); G.player.gold-=rec.gold;
  const it=genEquip(G.mapTier, rar, (slot==='random'?null:slot));
  G.player.inventory.push(it);
  G.forgeCd=Date.now()+FORGE_COOLDOWN;
  pushLog('sys','🔨 锻造出 '+rarObj(rar).name+'装备：'+it.name); toast('锻造成功：'+it.name);
  save();renderAll();
  setTimeout(()=>{ if(G && G.navTab==='forge') renderContent(); }, FORGE_COOLDOWN);
}

/* ==================== 词缀生成（POE 显式词缀 · GDD 05b §2-§4） ====================
   🔴 affixScale() 已废除。旧式 `(1+tier*0.3)*(0.6+0.4*rarity.mult)` 在 tier9 未录能给到 6.068 倍，
      词缀数值没有上界 —— 那是"后期无敌"的根源。现在：
        · 数值 = 族×槽位×阶 的固定区间内均匀 roll，绝对上界 = 该族 T1 的 max；
        · 地图 tier 只决定"能开到哪一阶"，开满（tier9）后再刷只能刷更好的 roll，不会变强；
        · 稀有度只决定条数 + 掷阶权重。
   入口签名已改为 generateAffixes(rarity, ilv, slot, wType)。                       */

/* 稀有度 → 前后缀条数分配（GDD 05b §2.2）。硬上限 3P+3S。 */
function affixSplit(rarity){
  const n = (rarity && rarity.affixes) | 0;
  if(n<=0) return {p:0, s:0};
  if(n===1) return Math.random()<0.5 ? {p:1,s:0} : {p:0,s:1};
  if(n===2) return {p:1, s:1};
  if(n===3) return Math.random()<0.5 ? {p:2,s:1} : {p:1,s:2};
  if(n===4) return {p:2, s:2};
  if(n===5) return Math.random()<0.5 ? {p:3,s:2} : {p:2,s:3};
  return {p:3, s:3};                                   /* 未录 6 条 = 3P+3S（结构上限） */
}
/* 该族在给定 ilv 下的合法阶集合（高 ilv 仍能掉低阶 —— 这正是"追求更好 roll"的来源） */
function affixLegalTiers(def, ilv){
  const out=[];
  for(const T of AFFIX_TIER_ORDER){ if(def.tiers[T] && ilv >= AFFIX_TIER_ILV[T]) out.push(T); }
  return out;
}
function rollAffixTier(def, rarityKey, ilv){
  const legal = affixLegalTiers(def, ilv);
  if(!legal.length) return null;
  const w = AFFIX_TIER_WEIGHT[rarityKey] || AFFIX_TIER_WEIGHT.rare;
  let tot=0; legal.forEach(function(T){ tot += (w[T]||0); });
  if(!(tot>0)) return legal[legal.length-1];           /* 兜底：取最低合法阶 */
  let r = Math.random()*tot;
  for(const T of legal){ r -= (w[T]||0); if(r<=0) return T; }
  return legal[legal.length-1];
}
/* 区间内均匀 roll。弓的「疾·械」区间 ×1.25 —— POE「额外箭矢」的落点（GDD 05b §5） */
function rollAffixValue(def, tier, wType, useSecond){
  const table = useSecond ? def.tiers2 : def.tiers;
  const r = table && table[tier]; if(!r) return null;
  let lo=r[0], hi=r[1];
  if(def.bowMult && WCLASS_BOW.indexOf(wType)>=0){ lo*=def.bowMult; hi*=def.bowMult; }
  if(def.pct && !useSecond) return +(lo + Math.random()*(hi-lo)).toFixed(4);
  return Math.round(lo + Math.random()*(hi-lo));
}
/* 技能等级词缀的取样约束（GDD 05b §4.2）：
   授械 只抽当前 wType 释放得了的技能；敕名·牌 抽任意非光环技能。
   这修掉了旧 generateAffixes 从 Object.keys(SKILLS) 全随机抽（会抽到光环、抽到用不了的武器系技能）。 */
function pickAffixSkill(def, wType){
  const ids = Object.keys(SKILLS).filter(function(id){
    const d = SKILLS[id];
    if(!d || d.type==='aura') return false;
    if(def.skillPick==='weapon') return (d.weapons==null) || (d.weapons.indexOf(wType)>=0);
    return true;
  });
  return ids.length ? ids[rand(0, ids.length-1)] : null;
}
function affixDisplayName(def, tier, val, val2, skillId){
  const tp = (AFFIX_TIER_PREFIX[tier] || '') + ' ';
  const head = tp + def.name;
  if(def.stat==='skillLv') return head + ' +' + val + ' ' + ((SKILLS[skillId]&&SKILLS[skillId].name)||'技能') + '等级';
  const fmt = function(v, pct){ return pct ? (Math.round(v*1000)/10).toFixed(1).replace(/\.0$/,'')+'%' : ''+v; };
  if(def.combo) return head + ' +' + fmt(val, def.pct) + ' 护甲 / +' + val2 + ' 生命';
  return head + ' +' + fmt(val, def.pct);
}
/* 造一条具体词缀。返回 null = 该族在此 ilv/wType 下开不出（调用方应换一族）。 */
function makeAffix(def, rarityKey, ilv, slot, wType){
  const tier = rollAffixTier(def, rarityKey, ilv);
  if(!tier) return null;
  const val = rollAffixValue(def, tier, wType, false);
  if(val==null) return null;
  const a = {id:def.id, family:def.family, kind:def.kind, stat:def.stat, tier:tier, val:val, pct:!!def.pct, slot:slot};
  if(def.combo){
    const v2 = rollAffixValue(def, tier, wType, true);
    if(v2==null) return null;
    a.stat2 = def.stat2; a.val2 = v2;
  }
  if(def.stat==='skillLv'){
    const sk = pickAffixSkill(def, wType);
    if(!sk) return null;
    a.skill = sk;
  }
  a.name = affixDisplayName(def, tier, a.val, a.val2, a.skill);
  return a;
}
/* 该槽位（+武器类）下某一类（前/后缀）能开出的全部族 */
function affixCandidates(slot, wType, kind, ilv){
  return AFFIX_DEFS.filter(function(d){
    if(d.kind!==kind) return false;
    if(d.slots.indexOf(slot)<0) return false;
    if(slot==='weapon' && d.wTypes && d.wTypes.indexOf(wType)<0) return false;
    return affixLegalTiers(d, ilv).length>0;
  });
}
/* 单条 roll（重铸单词条用）：excl = 已占用的 family 列表（R2 同族单件最多 1 条） */
function rollOneAffix(rarity, ilv, slot, wType, excl, kind){
  const kinds = kind ? [kind] : ['prefix','suffix'];
  let pool = [];
  kinds.forEach(function(k){
    pool = pool.concat(affixCandidates(slot, wType, k, ilv).filter(function(d){ return (excl||[]).indexOf(d.family)<0; }));
  });
  while(pool.length){
    const i = rand(0, pool.length-1);
    const a = makeAffix(pool[i], rarity.key, ilv, slot, wType);
    if(a) return a;
    pool.splice(i,1);
  }
  return null;
}
function generateAffixes(rarity, ilv, slot, wType){
  const rar = (typeof rarity==='string') ? rarObj(rarity) : (rarity || RARITY[0]);
  const lv  = clamp(Math.round(ilv||1), 1, MAX_LEVEL);
  const n   = affixSplit(rar);
  const out = [], used = [];
  [['prefix',n.p], ['suffix',n.s]].forEach(function(pair){
    const kind = pair[0];
    for(let i=0; i<pair[1]; i++){
      const a = rollOneAffix(rar, lv, slot, wType, used, kind);
      if(!a) break;                                     /* 该槽该类已抽干（低 ilv 可能发生） */
      used.push(a.family);
      out.push(a);
    }
  });
  return out;
}

/* ==================== 词缀毕业度（Affix Graduation）与 65% 阶级进度门禁 ====================
   规格来源：GDD 05b §10（毕业度）+ §11（门禁）。#14 的 AFFIX_DEFS / T1-T5 阶级模型已落地，
   本节直接按 GDD 原式实现：

       ap(a)   = min(1, a.val / T1upper(a.id))          ← 绝对 T1 上界，现读 AFFIX_DEFS
       毕业度  = clamp( (Σ ap / 21) / R(Tcap(tier)), 0, 1 )
       R(T)    = TIER_NORM = {T1:1.000, T2:0.800, T3:0.667, T4:0.533, T5:0.400}

   分母 21 = 7 槽 × 3 条 =「全身特许（3 词缀）· 每条都达到当前 Tcap 上界」：
       全身批准 ≈40% · 全身特许 ≈60% · 特许+少量重铸/1~2 件敕造 ≈65~70%（门槛落点） · 全身敕造 ≈88%
   用敕造 4 条作分母的话，全身敕造平均 roll 才 63%，等于每次升档都要求全身敕造，节奏过苦。

   关键取舍：分子直接遍历 equip[slot].affixes 原始数据，【不走 totalStats()】——
   毕业度衡量的是"装备本身的成色"，不该被属性点、光环、套装这些非装备来源污染。 */

const GRAD_DEN        = 21;           /* 分母 = 7 槽 × 3 条（GDD 05b §10.1） */
const GRAD_GATE       = 0.65;         /* 门禁阈值 65% */
/* 门禁生效的最低【地图 tier】。GDD §11.3 只豁免 idx0，但 §14 H4 记录了风险：
   tier0-2 玩家只有 Lv6-18、几件白绿装，rollRarity 在 tier0/1 只给 4%/8% 特许，
   65% 会变成劝退墙。team-lead 决策：tier0-2 全豁免，只从 tier3 起强制。 */
const GATE_MIN_TIER   = 3;

/* 该 tier 能掉到的最高阶（GDD 05b §3.2 Tcap 速查表） */
function tierCapOf(mapTier){
  const ML = ML_map(mapTier);
  if(ML>=55) return 'T1';
  if(ML>=43) return 'T2';
  if(ML>=31) return 'T3';
  if(ML>=19) return 'T4';
  return 'T5';
}
/* 单条词缀成色 ap ∈ 0..1 = val / 该族在该槽的【绝对 T1 上界】（GDD 05b §10.1/§10.2）。
   用绝对 T1 而不是当前 Tcap：否则 tier0 玩家戴一件满 T5 就是 100%，门槛失去纵向意义。
   低 tier 够不到 65% 的问题由 affixGradDetail 里的 TIER_NORM 归一化解决，不在这里补偿。
   返回 null = 不计入分子（豁免项）；返回 undefined = 无法识别（门禁 fail-open 用）。 */
function affixAP(a){
  if(!a || typeof a.stat!=='string') return undefined;
  if(a.stat==='goldFind') return null;            /* 经济轴豁免（GDD 02 §7.4 / 05b §10.1） */
  if(a.stat==='skillLv')  return 1.0;             /* 技能等级词缀 T1 独占，只有一档 */
  const def = a.id ? AFFIX_DEFS_BY_ID[a.id] : null;
  if(def && def.tiers && def.tiers.T1){
    if(def.combo){                                /* 铸魂：两个分量各自归一后取平均 */
      const p1 = Math.min(1, Math.abs(a.val||0)  / def.tiers.T1[1]);
      const p2 = Math.min(1, Math.abs(a.val2||0) / def.tiers2.T1[1]);
      return clamp((p1+p2)/2, 0, 1);
    }
    if(typeof a.val!=='number' || !isFinite(a.val)) return undefined;
    /* 弓的 疾·械 上界为基表 ×1.25，min(1,…) 会自然夹住，不需要额外分支 */
    return clamp(Math.abs(a.val)/def.tiers.T1[1], 0, 1);
  }
  /* 旧存档词缀（无 id）：按 stat 兜底（GDD 05b §10.4）。旧值被已废除的 affixScale 放大过，
     可能超过 T1 上界 → min(1,…) 自动夹到 1，不会异常。 */
  if(typeof a.val!=='number' || !isFinite(a.val)) return undefined;
  const cap = LEGACY_T1_UPPER[a.stat];
  if(!(cap>0)) return undefined;                  /* 认不出这个 stat，不白送分 */
  return clamp(Math.abs(a.val)/cap, 0, 1);
}
/* 「参与毕业度的词缀来源」注册表。
   刻意做成列表而不是在函数里硬编码遍历 7 个槽——技能书当前是消耗品（不占槽、不计入），
   但「消耗品学会 vs 装备学会」这个口径 team-lead 尚未拍板。若改判为占槽学会，
   在这里把 skillbook 的 enabled 改 true 并同步调 GRAD_DEN 即可，主逻辑一行不用动。
   约定：collect() 返回 [{key, label, affixes:[...]}, ...]。 */
const GRAD_SOURCES = [
  { id:'equip', enabled:true, collect:function(){
      return ALL_SLOTS.map(function(slot){
        const it = G.player.equip[slot];
        return {key:slot, label:slotLabel(slot),
                affixes:(it&&Array.isArray(it.affixes))?it.affixes:[]};
      });
    }
  },
  /* 技能书：当前为消耗品（inventory 里 type:'book'，用后转成 G.player.skills[id]，上限 10 级），
     不占装备槽 → 不计入。毕业度的语义是「装备词缀的完整度」，把技能书算进来会让
     "书刷得多"直接顶开地图门禁，那不是这道门想衡量的东西。（与 affix-designer 对齐） */
  { id:'skillbook', enabled:false, collect:function(){ return []; } },
];

/* 毕业度明细。tier 省略时取 G.mapTier。
   边界：未登录 / 无装备 / 无词缀 / tier 越界 → 安全返回 0，任何情况都不抛错。 */
function affixGradDetail(tier){
  const empty = {pct:0, absPct:0, sum:0, known:0, unknown:0, bySlot:{}, byPair:{}, weakest:null, gaps:[], gapText:''};
  if(!G || !G.player || !G.player.equip) return empty;
  const raw = (typeof tier==='number' && isFinite(tier)) ? tier : ((G.mapTier)||0);
  const t = clamp(Math.round(raw), 0, MAPS.length-1);
  let sum=0, known=0, unknown=0;
  const bySlot={}, byPair={}, labels={};
  const groups=[];
  for(const srcDef of GRAD_SOURCES){
    if(!srcDef.enabled) continue;
    let got=[]; try{ got=srcDef.collect()||[]; }catch(err){ got=[]; }
    for(const g of got) groups.push(g);
  }
  for(const g of groups){
    const key = g.key;
    let slotSum = 0;
    labels[key] = g.label || key;
    if(byPair[key+'|prefix']===undefined){ byPair[key+'|prefix']=0; byPair[key+'|suffix']=0; }
    for(const a of (g.affixes||[])){
      const ap = affixAP(a);
      if(ap===null) continue;                      /* 豁免：不进分子也不算未识别 */
      if(ap===undefined){ unknown++; continue; }
      known++; slotSum += ap;
      /* 旧档词缀没有 kind，按后缀记账（旧池以属性/暴击类为主，落在后缀侧更贴近事实） */
      byPair[key+'|'+(a.kind==='prefix'?'prefix':'suffix')] += ap;
    }
    bySlot[key] = (bySlot[key]||0) + slotSum;
    sum += slotSum;
  }
  /* 🔴 归一化（GDD 05b §10.2）：绝对 T1 做分母的话，tier0-2 的理论上限只有 ~27%，
     65% 门会把低 tier 玩家永远锁死。除以 R(Tcap) 后，毕业度衡量的是
     「相对于当前地图能拿到的最好装备，你达成了多少」。 */
  const absPct = clamp(sum/GRAD_DEN, 0, 1);          /* 副指标：绝对强度（纵向进度） */
  const norm   = TIER_NORM[tierCapOf(t)] || 1;
  /* 缺口提示：得分最低的两个「槽位×前后缀」格（基准 = 每槽 3 条 ≈ 前缀 1.5 + 后缀 1.5） */
  const gaps = Object.keys(byPair).map(function(k){
    const p=k.split('|'); return {slot:p[0], kind:p[1], v:byPair[k]};
  }).sort(function(a,b){ return a.v-b.v; }).slice(0,2);
  let weakest=null, worst=Infinity;
  for(const k in bySlot){ if(bySlot[k]<worst){ worst=bySlot[k]; weakest=k; } }
  return {
    pct: clamp((sum/GRAD_DEN)/norm, 0, 1),
    absPct: absPct,
    sum, known, unknown, bySlot, byPair, labels, weakest, gaps,
    gapText: gaps.map(function(g){ return (labels[g.slot]||slotLabel(g.slot))+(g.kind==='prefix'?'前缀':'后缀'); }).join(' / '),
    tierCap: tierCapOf(t), norm: norm
  };
}
/* 词缀毕业度主指标：0.0 ~ 1.0 */
function computeAffixCompletion(tier){ return affixGradDetail(tier).pct; }
function affixCompletionPct(tier){ return Math.round(computeAffixCompletion(tier)*100); }
/* 槽位中文名（缺口提示用） */
function slotLabel(slot){
  return ({weapon:'武器', head:'头部', armor:'护甲', hands:'护手', feet:'鞋履', ring:'印戒', amulet:'牌符'})[slot] || slot;
}

/* 进阶闸门：判定能否进入地图 idx。GDD §11.3。
   量尺用【上一张图的 tier】而不是要进的那档：你的装备是在上一档掉的、开阶上限由上一档的
   ML_map 钉死，拿下一档的 Tcap 当归一化基准会凭空抬高门槛，造成软锁。
   三重防死档：① 单向棘轮 passedTier，通过一次永久通过；② 已通关旧图永远自由进出；
   ③ 装备词缀全部无法识别时 fail-open（#14 换池过渡期的保险，宁可漏放也不能把人锁死）。 */
function gradeGateState(){
  if(!G.gradeGate || typeof G.gradeGate.passedTier!=='number') G.gradeGate={passedTier:0};
  return G.gradeGate;
}
function mapGateCheck(idx){
  if(!G) return {ok:false, reason:'请先登录账号'};
  if(!MAPS[idx]) return {ok:false, reason:'无效地图'};
  if(idx>G.unlocked) return {ok:false, reason:'该地图尚未解锁，请先击败前一张地图的 BOSS'};
  const gs = gradeGateState();
  /* 豁免：首图 / tier0-2（team-lead 决策，见 GATE_MIN_TIER）/ 已通关旧图 / 棘轮已记录通过。
     🔴 棘轮 passedTier 是防死档的核心：没有它，玩家通过门进了新图、把旧装备卖掉换成
     新图掉的低阶装备后毕业度可能瞬间掉回 55%，退出地图就再也进不来。通过一次 = 永久通过。 */
  if(idx<=0 || MAPS[idx].tier < GATE_MIN_TIER || idx<G.unlocked || idx<=gs.passedTier){
    return {ok:true, gate:false, exempt:true, gateTier:null, pct:1};
  }
  const gateTier = MAPS[idx-1].tier;
  const d = affixGradDetail(gateTier);
  /* fail-open：有词缀但一条都识别不了（词缀池已被 #14 换掉而本函数未同步） */
  if(d.known===0 && d.unknown>0){
    gs.passedTier = Math.max(gs.passedTier, idx);
    return {ok:true, gate:false, exempt:true, failOpen:true, gateTier, pct:d.pct, detail:d};
  }
  if(d.pct >= GRAD_GATE){
    gs.passedTier = Math.max(gs.passedTier, idx);   /* 单向棘轮：通过一次永久通过 */
    return {ok:true, gate:false, pct:d.pct, gateTier, detail:d};
  }
  return {ok:false, gate:true, pct:d.pct, gateTier, detail:d,
    reason:'词缀毕业度不足 65%（当前 '+Math.round(d.pct*100)+'%）'
      +(d.gapText?'，最缺：'+d.gapText:'')+'，请继续打磨装备'};
}

/* ---- 重铸（刷新词条） ----
   新体系下重铸的意义变了：从"洗一个更大的随机数"变成"洗一个更高的阶"，有明确进度感。
   ilv 取装备自身的 ilv（不是当前地图）—— 装备的开阶上限由它掉落的那张图钉死，重铸不能提纯。 */
function rerollAffixes(it){
  const rarity=rarObj(it.rarity);
  it.affixes=generateAffixes(rarity, itemIlv(it), it.slot, it.wType);
  it.name=equipName(it);
}
function canReforge(uid){
  const it=findItem(uid); if(!it||it.type) return {ok:false, reason:'无效目标'};
  /* BUG-4：专属（敕造 unique / 未录 mythic）装备的词条为设计钉死内容，禁止重铸 */
  if(it.unique||it.mythic) return {ok:false, reason:'专属装备无法重铸'};
  const cost=REFORGE_COST[it.rarity]; if(!cost) return {ok:false, reason:'无法重铸'};
  if(!matCost(cost.shards)) return {ok:false, reason:'碎片不足'};
  if(G.player.gold<cost.gold) return {ok:false, reason:'金币不足'};
  return {ok:true, it, cost};
}
function doReforge(uid){
  const res=canReforge(uid); if(!res.ok){ toast(res.reason); return; }
  const it=res.it, cost=res.cost;
  matSpend(cost.shards); G.player.gold-=cost.gold;
  rerollAffixes(it);
  pushLog('sys','✨ 重铸 '+it.name+' 的全部词条'); toast('重铸完成：'+it.name);
  save();renderAll();
}
/* ---- 单词条重铸（随机刷新一个词条，材料翻倍） ----
   保持前后缀身份不变（R3：前缀/后缀不可互换，否则单词条重铸会绕过 3P+3S 的结构上限），
   并排除装备上已有的其它 family（R2 同族单件最多 1 条）。 */
function reforgeOneAffix(it){
  if(!it.affixes||it.affixes.length===0){ return false; }
  const idx=rand(0,it.affixes.length-1);
  const oldAff=it.affixes[idx];
  const ri=rarObj(it.rarity);
  const ilv=itemIlv(it);
  /* 已占用的 family（不含被替换的那条）；旧档词缀无 family，用 stat 兜底占位 */
  const excl=[];
  for(let i=0;i<it.affixes.length;i++){
    if(i===idx) continue;
    const f=it.affixes[i] && (it.affixes[i].family || it.affixes[i].stat);
    if(f) excl.push(f);
  }
  const kind = (oldAff && oldAff.kind==='prefix') ? 'prefix' : (oldAff && oldAff.kind==='suffix' ? 'suffix' : null);
  /* 先尝试换一个【不同族】的；若该槽该类已被抽干，则退回同族重 roll 数值（至少刷新阶与 roll） */
  let aff = rollOneAffix(ri, ilv, it.slot, it.wType, excl.concat(oldAff && oldAff.family ? [oldAff.family] : []), kind);
  if(!aff) aff = rollOneAffix(ri, ilv, it.slot, it.wType, excl, kind);
  if(!aff) return false;
  it.affixes[idx]=aff;
  it.name=equipName(it);
  return true;
}
function canReforgeOne(uid){
  const it=findItem(uid); if(!it||it.type) return {ok:false, reason:'无效目标'};
  if(it.unique||it.mythic) return {ok:false, reason:'专属装备无法重铸'}; /* BUG-4 */
  if(!it.affixes||it.affixes.length===0) return {ok:false, reason:'无词条可重铸'};
  const cost=SINGLE_REFORGE_COST[it.rarity]; if(!cost) return {ok:false, reason:'无法重铸'};
  if(!matCost(cost.shards)) return {ok:false, reason:'碎片不足'};
  if(G.player.gold<cost.gold) return {ok:false, reason:'金币不足'};
  return {ok:true, it, cost};
}

/* ==================== 装备生成 ==================== */
function rollRarity(tier){
  const w = tier===0 ? [0.5,0.3,0.15,0.04,0.01]
        : tier===1 ? [0.3,0.35,0.25,0.08,0.02]
        :            [0.15,0.3,0.35,0.17,0.03];
  let r=Math.random(), cum=0;
  for(let i=0;i<w.length;i++){ cum+=w[i]; if(r<=cum) return RARITY[i]; }
  return RARITY[0];
}

function genEquip(tier, forceRarity, forceSlot){
  const rarity = forceRarity ? rarObj(forceRarity) : rollRarity(tier);

  var slot, wType=null, armorType=null, tierIdx=null, baseMult=rarity.mult*(1+tier*0.4), base;
  var isWeapon;

  if(forceSlot){
    /* 锻造指定部位 */
    slot=forceSlot;
    if(slot==='weapon'){ isWeapon=true; }
    else if(slot==='head'||slot==='armor'||slot==='feet'){
      isWeapon=false;
      const atKeys=Object.keys(ARMOR_TYPES);
      armorType=atKeys[rand(0,atKeys.length-1)];
      const baseTier=Math.min(tier,3);
      tierIdx=(Math.random()<0.2)?Math.min(3,baseTier+1):baseTier;
    } else { isWeapon=false; /* 护手/戒指/护符 */ }
  } else {
    isWeapon = Math.random()<0.32;
    if(isWeapon){ slot='weapon'; }
    else {
      const r=Math.random();
      if(r<0.62){ /* 三大护甲槽（板/布/皮） */
        const big=['head','armor','feet'];
        slot=big[rand(0,2)];
        const atKeys=Object.keys(ARMOR_TYPES);
        armorType=atKeys[rand(0,atKeys.length-1)];
        /* 难度分层：难度t只掉对应阶位（t4与t3同为最高阶），约20%越阶+1 */
        const baseTier=Math.min(tier,3);
        tierIdx=(Math.random()<0.2)?Math.min(3,baseTier+1):baseTier;
      } else { /* 护手/戒指/护符 */
        const acc=['hands','ring','amulet'];
        slot=acc[rand(0,2)];
      }
    }
  }

  if(isWeapon){
    const wKeys=Object.keys(WEAPON_TYPES);
    if(!wType) wType=wKeys[rand(0,wKeys.length-1)];
    const wt=WEAPON_TYPES[wType];
    base={atk:Math.round(wt.baseAtk*baseMult), spd:Math.round(wt.baseSpd*baseMult*0.5)};
  } else {
    const sb=SLOT_BASE[slot];
    base={};
    for(const k in sb) base[k]=Math.round(sb[k]*baseMult);
    /* 材质倾向：板甲重防御/生命，布甲轻量偏法，皮甲偏攻速 */
    if(armorType==='plate'){ base.def=Math.round((base.def||0)*1.3); base.hp=Math.round((base.hp||0)*1.15); }
    else if(armorType==='cloth'){ base.hp=Math.round((base.hp||0)*0.8); base.crit=Math.round((base.crit||0)*1.2); }
    else if(armorType==='leather'){ base.spd=Math.round((base.spd||0)*1.3); }
  }

  /* 需求：等级门槛（按地图难度） + 三属性（基于品质、阶位与装备材质）
     🔴 旧式 reqLv = tier*8 + rand(0,4) 在 tier9 会生成 72~76 > MAX_LEVEL 60 —— 装备永远穿不上。
     新式绑定 ML_map：tier0 → 1~6；tier9 → 55~60，正好落在"进图落后 5 级、毕业时追平"的节奏上。 */
  const ML = ML_map(tier);
  const reqLv = clamp(ML - rand(0,5), 1, MAX_LEVEL);
  const tierReq = Math.max(1, tier*3+2);
  let reqStr=0, reqAgi=0, reqInt=0, reqCon=0, reqSpi=0;
  if(isWeapon){
    const wa=WEAPON_TYPES[wType].attr;
    if(wa==='str') reqStr=tierReq+rand(0,3);
    else if(wa==='agi') reqAgi=tierReq+rand(0,3);
    else reqInt=tierReq+rand(0,3);
  } else if(armorType){
    if(armorType==='plate')      { reqStr=tierReq+rand(0,3); reqCon=tierReq+rand(0,3); }
    else if(armorType==='cloth') { reqInt=tierReq+rand(0,3); reqSpi=tierReq+rand(0,3); }
    else                         { reqAgi=tierReq+rand(0,3); }
  } else {
    if(Math.random()<0.4) reqStr=tierReq+rand(-1,3);
    if(Math.random()<0.4) reqAgi=tierReq+rand(-1,3);
    if(Math.random()<0.4) reqInt=tierReq+rand(-1,3);
    if(Math.random()<0.4) reqCon=tierReq+rand(-1,3);
    if(Math.random()<0.4) reqSpi=tierReq+rand(-1,3);
  }

  /* 词缀：ilv = ML_map(掉落地图 tier) 决定能开到哪一阶；条数与掷阶权重来自稀有度 */
  const affixes = generateAffixes(rarity, ML, slot, wType);
  let setId=null;
  if(rarity.affixes>=2 && Math.random()<0.30) setId=Object.keys(SETS)[rand(0,Object.keys(SETS).length-1)];

  /* 名称：前缀 + 阶位/材质基础名（如「勇敢的骑士长靴」「智慧的士兵头盔」） */
  const name = equipName({slot, rarity:rarity.key, wType, affixes, armorType, tierIdx});

  return {
    uid:itemUid++, slot, name, rarity:rarity.key, rarityName:rarity.name,
    base, affixes, setId, wType, ilv:ML,   /* ilv 落盘：itemTier 不再从 reqLv 脆弱反推 */
    armorType:armorType||undefined, tierIdx:(tierIdx!=null?tierIdx:undefined),
    reqLv:reqLv||undefined,
    reqStr:reqStr||undefined, reqAgi:reqAgi||undefined, reqInt:reqInt||undefined,
    reqCon:reqCon||undefined, reqSpi:reqSpi||undefined, wear:0, socketOpen:false, runes:[],
  };
  /* 装备磨损衰减 */
  var _wearMult=1;
  for(const _sl in G.player.equip){
    const _it=G.player.equip[_sl]; if(_it&&typeof _it.wear==='number'&&_it.wear>0){
      _wearMult=Math.min(_wearMult, 1-_it.wear*0.006);
    }
  }
  s.atk=Math.round(s.atk*_wearMult); s.matk=Math.round(s.matk*_wearMult);
  s.def=Math.round(s.def*_wearMult); s.mdef=Math.round(s.mdef*_wearMult);
  s.hp=Math.round(s.hp*_wearMult);
  return s;
}

/* ==================== 战斗单位 ==================== */

/* 特性觉醒等级阈值（15 级前无职业特性；达到后二选一，之后可用特性石改换） */
const LEVEL_AWAKEN = 15;

/* 由特性 type 派生该场战斗的被动状态位（含所需参数，避免引擎再查 ORIGINS） */
function traitState(type){
  const M={
    armorBreak:   {type:'armorBreak', armorStacks:0},
    lethalRhythm: {type:'lethalRhythm', comboCnt:0, critDmgBonus:0.30},
    dualCast:     {type:'dualCast', dualCastCd:2},
    teamBulwark:  {type:'teamBulwark', shieldCd:1},
    teamMercy:    {type:'teamMercy', healTeamPct:0.03, reviveUsed:false},
    bloodthirst:  {type:'bloodthirst', lifesteal:0.08, atkMul:0.12},
    shadowStrike: {type:'shadowStrike', extraMul:0.5},
    glassCannon:  {type:'glassCannon', skillDmgBonus:0.35, hpMul:0.25, dmgTakenMul:0.20},
    thorns:       {type:'thorns', reflect:0.20, reduce:0.15},
    benediction:  {type:'benediction', atkBuff:0.15, buffTurns:3}
  };
  return M[type]?Object.assign({},M[type]):{type:null};
}

function playerUnit(){
  const s=totalStats();
  const aura=auraBonuses(); /* 光环常驻加成 */
  const wp=weaponPower(s);
  /* GDD 05b §12 #9/#11/#12/#14：三个新乘区在出口生效
     atkPct 是【全局】乘区 */
  /* 符文加成 */
  var reff=runeComboEffect(); for(var rk in reff){ if(reff[rk]) s[rk]=(s[rk]||0)+reff[rk]; }
  const atkPct = Math.max(0, s.atkPct||0);
  const spdPct = clamp(s.spdPct||0, 0, AFFIX_CAPS.spdPct);
  const cdr = clamp((s.cdr||0) + (aura.cdr||0), 0, AFFIX_CAPS.cdr);
  const atk=Math.round((s.atk+wp.atk)*(1+aura.atk)*(1+atkPct));
  const matk=Math.round((s.matk+wp.matk)*(1+aura.atk)*(1+atkPct));
  /* 可释放技能：仅已装备的 5 个主动技能（排除光环 / 武器不匹配）。
     cdr 生效点：CD 是整数、按行动次数递减，effCd = max(1, ceil(cd/(1+cdr)))；
     castSkill 赋 CD 时读 cdBase（缺省回退 def.cd，保证外部构造的技能对象仍可用）。 */
  const equipped=(G.player.equippedSkills||[]).filter(function(id){
    const d=SKILLS[id]; return d && skillWeaponOk(d) && skillLevel(id)>0;
  });
  const skills=equipped.map(function(id){ return {
    id, lv:skillLevel(id), cd:0, def:SKILLS[id],
    cdBase:Math.max(1, Math.ceil((SKILLS[id].cd||1)/(1+cdr))),
    cost:8+(SKILLS[id].cd||1)*3
  }; });
  const maxMp=Math.round(s.mp);
  var p = {
    name:G.player.name, side:'player', emoji:'🗡️',
    maxHp:Math.round(s.hp*(1+(aura.hp||0))), hp:Math.min(Math.round(G.player.hp>0?G.player.hp:s.hp), Math.round(s.hp*(1+(aura.hp||0)))),
    maxMp, mp:Math.min(Math.round(typeof G.player.mp==='number'?G.player.mp:maxMp), maxMp),
    atk, matk, def:Math.round(s.def*(1+(aura.def||0))), mdef:Math.round(s.mdef),
    spd:Math.round(s.spd*(1+aura.spd)*(1+spdPct)),
    crit:clamp(s.crit, 0, AFFIX_CAPS.crit),
    critP:clamp(s.crit+aura.crit, 0, AFFIX_CAPS.crit), critS:clamp(s.crit+aura.crit, 0, AFFIX_CAPS.crit),
    critDmg:Math.min(AFFIX_CAPS.critDmg, s.critDmg||0),
    hit:s.hit, eva:Math.min(0.35, s.eva+(aura.eva||0)),
    lifesteal:Math.min(AFFIX_CAPS.lifesteal, s.lifesteal||0),
    dmgReduce:Math.min(AFFIX_CAPS.dmgReduce, s.dmgReduce||0),
    skillDmg:Math.min(AFFIX_CAPS.skillDmg, (s.skillDmg||0)+aura.skillDmg),
    eliteBossDmg:Math.min(AFFIX_CAPS.eliteBossDmg, s.eliteBossDmg||0), healEff:s.healEff||0,
    shieldPct:Math.min(AFFIX_CAPS.shieldPct, s.shieldPct||0), reflectDmg:Math.min(AFFIX_CAPS.reflectDmg, s.reflectDmg||0), triggerCrit:Math.min(AFFIX_CAPS.triggerCrit, s.triggerCrit||0), triggerThorns:Math.min(AFFIX_CAPS.triggerThorns, s.triggerThorns||0), triggerDual:Math.min(AFFIX_CAPS.triggerDual, s.triggerDual||0), triggerShadow:Math.min(AFFIX_CAPS.triggerShadow, s.triggerShadow||0), triggerMercy:Math.min(AFFIX_CAPS.triggerMercy, s.triggerMercy||0),
    atkPct:atkPct, spdPct:spdPct, cdr:cdr,
    time:0, skills, shield:0, buffs:[], str:s.str, agi:s.agi, int:s.int, con:s.con, spi:s.spi,
    _regenPct:aura.regen||0,  /* 恢复光环：每回合自动回血 */
    /* 未录·敕令共鸣：本次战斗生效的未录 id 列表 + 效果状态位 */
    uniq:mythicIds(), noHeal:false, _dmgAcc:0, _curSkill:null,
    /* 职业特性：由 G.player.trait（15 级觉醒选定，存盘）派生；未选则无特性 */
    origin:(G.account&&G.account.origin)||null,
    passive:(function(){
      const tk=(G.player&&G.player.trait)||null;
      if(!tk) return {type:null};
      const o=ORIGINS.find(function(x){ return x.key===(G.account&&G.account.origin); });
      const td=o&&o.traits.find(function(t){ return t.key===tk; });
      return traitState(td?td.type:null);
    })(),
    forceNextCrit:false,
  };
  /* 特性附加属性（玻璃大炮/嗜血等需在建单位时落地的修正） */
  (function(){
    const t=p.passive; if(!t||!t.type) return;
    if(t.type==='glassCannon'){
      p.maxHp=Math.round(p.maxHp*(1-(t.hpMul||0.25))); p.hp=p.maxHp;
      p.skillDmg=(p.skillDmg||0)+(t.skillDmgBonus||0.35);
      p.dmgTakenMul=(t.dmgTakenMul||0.20);
    } else if(t.type==='bloodthirst'){
      /* 嗜血狂战 trait 吸血不受 AFFIX_CAPS.lifesteal 上限（装备部分仍受 cap，避免两套都浪费） */
      const baseLS=p.lifesteal||0;
      p.lifesteal=Math.min(AFFIX_CAPS.lifesteal, baseLS)+(t.lifesteal||0.08);
      p.atk=Math.round(p.atk*(1+(t.atkMul||0.12)));
    }
  })();
  if(G.player._godMode){ p.maxHp=999999; p.hp=999999; p.atk=999999; p.matk=999999; }
  return p;
}
function enemyUnit(def, tier){
  /* 🔴 难度冻结（GDD 05b §8.2，反无敌闸门 G2）：scale 改用每图固定的怪物等级 ML_map(tier)，
     不再读 G.player.level。旧式下 Lv60 玩家回 tier0 会把 55hp 的野狗拉到 380hp —— 荒诞；
     且"玩家变强 → 怪同步变强"让装备进步不可感知。
     新式等价于"用旧公式在该图的毕业等级处取值后冻结"，终局 tier9 仍是 10.05，
     不需要重做 GDD 04b §2.3 的数值骨架与经济。 */
  const ML=ML_map(tier);
  const scale=1+tier*0.35+(ML-1)*0.10;
  const u={
    name:def.name, emoji:def.emoji, art:def.art, img:def.img, side:'enemy',
    maxHp:Math.round(def.hp*scale), hp:Math.round(def.hp*scale),
    atk:Math.round(def.atk*scale),
    matk:Math.round((def.matk||Math.round(def.atk*0.6))*scale),
    def:Math.round(def.def*scale),
    mdef:Math.round((def.mdef||Math.round(def.def*0.7))*scale),
    spd:def.spd, crit:def.crit||0.05, critP:def.crit||0.05, critS:def.crit||0.05,
    critDmg:def.critDmg||1.5,
    hit:def.hit||0.85, eva:def.eva||0.08,
    lifesteal:0, dmgReduce:0, maxMp:200, mp:200,
    time:0, skills:[], shield:0, buffs:[],
    isElite:!!def.elite, isBoss:!!def.boss,
    monKey:def.key||null, family:def.family||null /* key 直传：Boss 掉落与龙裔判定不再依赖名字 */
  };
  /* 专属技能（每只怪固定，见 MONSTER_SKILL_SET，按身份设定）；漏配则回退类型通用池 */
  let picks, lv = def.boss?2:(def.elite?2:1);
  const fixed = MONSTER_SKILL_SET[def.key||''];
  if(fixed && fixed.length){ picks = fixed.slice(); }
  else { const fb = monSkillPool(def.boss?'boss':def.elite?'elite':'normal'); picks = fb.keys; lv = fb.lv; }
  u.skills=picks.map(function(k){ return {def:MONSTER_SKILLS[k], lv:lv, cd:0, cost:0}; });
  if(picks.indexOf('mboss_drain')>=0) u.lifesteal=0.35; /* 生命汲取：技能吸血 */
  return u;
}
function effSpd(u){
  let s=u.spd;
  const boost=u.buffs.find(x=>x.type==='spdBoost'&&x.turns>0);
  if(boost) s*=(1+boost.val);
  const sl=u.buffs.find(x=>x.type==='slow'&&x.turns>0);
  if(sl) s*=(1-sl.val);
  return s;
}

/* ==================== ATB 自动战斗引擎 ==================== */
function startBattle(enemyDefOrList, label){
  const defs = Array.isArray(enemyDefOrList) ? enemyDefOrList : [enemyDefOrList];
  /* 图鉴：记录已遭遇的怪物（用于问号未解锁态） */
  if(G.seenMonsters){
    let _seenChanged=false;
    defs.forEach(function(_d){ const _k=_d&&_d.key; if(_k && G.seenMonsters.indexOf(_k)<0){ G.seenMonsters.push(_k); _seenChanged=true; } });
    if(_seenChanged) scheduleSave();
  }
  const enemies = defs.map(function(d){ return enemyUnit(d, G.mapTier); });
  const b={
    player:playerUnit(), enemies:enemies,
    over:false, result:null, turn:0, label:label||''
  };
  G.battle=b;
  fireHook(b.player,'battleStart',{u:b.player, b:b}); /* 未录钩子：开战 */
  const names = enemies.map(function(e){ return e.name+(e.isElite?'【精英】':e.isBoss?'【BOSS】':''); }).join('、');
  pushLog('sys','⚔️ 遭遇 '+names+'！（共 '+enemies.length+' 只）');
  showBattleView();
  if(G.battleTimer) clearInterval(G.battleTimer);
  G.battleTimer=setInterval(tickBattle, 650);
}
function tickBattle(){
  if(!G||!G.battle) return;
  const b=G.battle; if(!b||b.over) return;
  b.player.time+=effSpd(b.player);
  b.enemies.forEach(function(e){ e.time+=effSpd(e); });
  let guard=0;
  while(!b.over && guard<80){
    guard++;
    /* 取 time 最高的存活单位出手（平局玩家优先，保证 ATB 公平） */
    const cand=[b.player].concat(b.enemies).filter(function(u){ return u.hp>0 && u.time>=100; });
    cand.sort(function(a,c){ return (c.time-a.time) || (a.side==='player'?-1:1); });
    const actor=cand[0];
    if(!actor) break;
    actor.time-=100;
    if(actor.side==='player'){
      const foe=b.enemies.find(function(e){ return e.hp>0; });
      if(foe) unitAct(actor,foe);
    } else {
      /* 嘲讽：若敌方有 taunt buff，优先攻击施放嘲讽的玩家（组队时有用） */
      var target=b.player;
      if(G.battle && G.battle.player){
        const party=Array.isArray(G.battle.player)?G.battle.player:[G.battle.player];
        party.forEach(function(u){
          if(u.buffs) u.buffs.forEach(function(bu){
            if(bu.type==='taunt' && bu.taunter && bu.taunter.hp>0) target=bu.taunter;
          });
        });
      }
      unitAct(actor,target);
    }
  }
  if(!b.over) applyFlasks(b.player);   /* 药水瓶自动回复（血/蓝） */
  b.turn++;
  renderBattleScreen();
  checkBattleEnd();
  if(!b.over){
    G.player.hp=b.player.hp;            /* 即时同步当前血量 */
    G.player.mp=b.player.mp;            /* 即时同步当前法力 */
    if(b.turn%3===0) scheduleSave();   /* 每约2秒实时存档（不依赖遭遇结算） */
  }
}
/* 药水瓶：低血/低蓝时自动消耗能量回复。
   默认为逐渐回复；带「急涌」词缀则改为阈值触发的一次性爆发回复。 */
function applyFlasks(u){
  const fl=(G.player&&G.player.flasks)||{};
  const fh=fl.hp;
  if(fh&&fh.charge>0&&u.hp>0&&u.hp<u.maxHp*0.7&&!u.noHeal){ /* 未录代价：noHeal 单位血瓶失效 */
    const pot=1+flaskAffix(fh,'potency');
    if(flaskHas(fh,'instant')){
      if(fh._cd>0) fh._cd--;
      else if(u.hp<u.maxHp*0.4){
        const drain=Math.min(45,fh.charge); fh.charge-=drain;
        const heal=Math.round(drain*fh.rate*pot);
        u.hp=Math.min(u.maxHp,u.hp+heal); fh._cd=6;
        pushLog('sys','🧪 '+fh.name+' 急涌回复 '+heal+' 生命（余 '+fh.charge+'）');
      }
    } else {
      const drain=Math.min(5,fh.charge); fh.charge-=drain;
      u.hp=Math.min(u.maxHp,u.hp+Math.round(drain*fh.rate*pot));
    }
  }
  const fm=fl.mp;
  if(fm&&fm.charge>0&&typeof u.mp==='number'&&u.mp<u.maxMp*0.5){
    const pot=1+flaskAffix(fm,'potency');
    if(flaskHas(fm,'instant')){
      if(fm._cd>0) fm._cd--;
      else if(u.mp<u.maxMp*0.25){
        const drain=Math.min(45,fm.charge); fm.charge-=drain;
        const rec=Math.round(drain*fm.rate*pot);
        u.mp=Math.min(u.maxMp,u.mp+rec); fm._cd=6;
        pushLog('sys','🧪 '+fm.name+' 急涌回复 '+rec+' 法力（余 '+fm.charge+'）');
      }
    } else {
      const drain=Math.min(4,fm.charge); fm.charge-=drain;
      u.mp=Math.min(u.maxMp,u.mp+Math.round(drain*fm.rate*pot));
    }
  }
}
function processStartBuffs(u){
  for(const buf of u.buffs){
    if(buf.type==='dot'&&buf.turns>0){
      const d=Math.round(buf.dmg); u.hp-=d;
      pushLog(u.side,(u.side==='player'?'🗡️':'💀')+' '+u.name+' 受到持续伤害 '+d);
    }
  }
  u.buffs.forEach(x=>x.turns--);
  u.buffs=u.buffs.filter(x=>x.turns>0);
}
/* 技能动态优先级（GDD 03 §3.3）：buff/heal 不再因无 mult 而永居末位 */
function skillPrio(actor, sk){
  const d=sk.def, hpPct=actor.hp/actor.maxHp;
  if(d.type==='heal'){
    if(hpPct>=0.85) return 99;          /* 满血不浪费治疗 */
    if(hpPct<0.40) return 0;            /* 危险线优先治疗 */
    return 3;                           /* 中等血量与伤害技同档，按 mult 竞争 */
  }
  if(d.type==='buff'){
    if(d.shield){                       /* 护盾技 */
      if(actor.shield>0) return 99;     /* 已有护盾不重复 */
      return hpPct<0.70 ? 1 : 3;        /* 血量低于70%优先护盾 */
    }
    /* 增益技：已生效则跳过 */
    const hasAtk=actor.buffs.some(x=>x.type==='atkBoost'&&x.turns>0);
    const hasSpd=actor.buffs.some(x=>x.type==='spdBoost'&&x.turns>0);
    if((d.val&&hasAtk)||(d.spdBoost&&hasSpd)) return 99;
    return 2;                           /* 未生效则施放 */
  }
  return 3;                             /* dmg/dot 默认档 */
}
function unitAct(actor,foe){
  processStartBuffs(actor);
  if(actor.hp<=0) return;
  /* 眩晕：本回合无法行动（stun 回合数由 processStartBuffs 递减） */
  if(actor.buffs.some(x=>x.type==='stun'&&x.turns>0)){
    pushLog(actor.side,(actor.side==='player'?'🗡️':'💀')+' '+actor.name+' 被眩晕，无法行动！');
    return;
  }
  if(actor.side==='player'){
    fireHook(actor,'turnStart',{u:actor, foe:foe, b:G.battle}); /* 未录钩子：回合开始 */
    /* —— 职业被动：出手前计数 / 叠层（仅玩家、按 origin 标记隔离） —— */
    if(actor.passive){
      const P=actor.passive;
      if(P.type==='lethalRhythm'){ P.comboCnt=(P.comboCnt||0)+1; if(P.comboCnt%3===0) actor.forceNextCrit=true; }
      if(P.type==='armorBreak' && (P.armorStacks||0)<5){ P.armorStacks++; }
    }
    actor.skills.forEach(sk=>{if(sk.cd>0)sk.cd--;});
    const ready=actor.skills.filter(sk=>sk.cd<=0 && actor.mp>=sk.cost && skillPrio(actor,sk)<99)
      .sort((a,b)=>skillPrio(actor,a)-skillPrio(actor,b) || (b.def.mult||0)-(a.def.mult||0));
    if(ready.length){
      actor.mp-=ready[0].cost; castSkill(actor,foe,ready[0]);
      /* 法师·双重施法：本次施法成功后，若冷却就绪则额外再施放一次技能 */
      if(actor.passive && actor.passive.type==='dualCast'){
        if(actor.passive.dualCastCd>0) actor.passive.dualCastCd--;
        else {
          const r2=actor.skills.filter(sk=>sk.cd<=0 && actor.mp>=sk.cost && skillPrio(actor,sk)<99)
            .sort((a,b)=>skillPrio(actor,a)-skillPrio(actor,b) || (b.def.mult||0)-(a.def.mult||0));
          if(r2.length){ actor.mp-=r2[0].cost; pushLog(actor.side,'🔁 '+actor.name+' 禁卷共鸣·双重施法！'); castSkill(actor,foe,r2[0]); actor.passive.dualCastCd=2; }
        }
      }
    }
    else basicAttack(actor,foe);
    /* —— 职业被动：行动后团队效果 —— */
    if(actor.passive){
      const P=actor.passive;
      if(P.type==='teamBulwark'){
        if(P.shieldCd>0) P.shieldCd--;
        else { P.shieldCd=1; grantTeamShield(G.battle, actor, 0.08); pushLog(actor.side,'🛡 '+actor.name+' 铁证壁垒·护盾展开'); }
      }
      if(P.type==='teamMercy' && P.healTeamPct>0){
        alliesInclSelf(G.battle, actor).forEach(function(al){ if(al.hp>0 && !al.noHeal) al.hp=Math.min(al.maxHp, al.hp+Math.round(al.maxHp*P.healTeamPct)); });
      }
      /* 净化真言：全队攻击 +15% 增益（3 回合刷新）+ 每行动净化 1 个负面 */
      if(P.type==='benediction'){
        alliesInclSelf(G.battle, actor).forEach(function(al){
          if(al.hp>0){
            al.buffs.push({type:'atkBoost', val:(P.atkBuff||0.15), turns:(P.buffTurns||3)});
            if(al.buffs){
              const di=al.buffs.findIndex(function(b){ return isDebuff(b.type); });
              if(di>=0) al.buffs.splice(di,1);
            }
          }
        });
        pushLog(actor.side,'✨ '+actor.name+' 净化真言·全队增益');
      }
    }
    actor.mp=Math.min(actor.maxMp, actor.mp+3); /* 每次行动自然回蓝 */
    /* 恢复光环：每回合自动回血 */
    if(actor._regenPct && actor._regenPct>0 && actor.hp>0 && !actor.noHeal){
      actor.hp=Math.min(actor.maxHp, actor.hp+Math.round(actor.maxHp*actor._regenPct));
    }
  } else {
    /* 怪物：有可用技能则施放（独立于玩家技能池），否则普通攻击 */
    actor.skills.forEach(sk=>{if(sk.cd>0)sk.cd--;});
    const ready=actor.skills.filter(sk=>sk.cd<=0 && (actor.mp>=(sk.cost||0)) && skillPrio(actor,sk)<99)
      .sort((a,b)=>skillPrio(actor,a)-skillPrio(actor,b) || (b.def.mult||0)-(a.def.mult||0));
    if(ready.length){ actor.mp-=ready[0].cost||0; castSkill(actor,foe,ready[0]); }
    else basicAttack(actor,foe);
    actor.mp=Math.min(actor.maxMp, actor.mp+3);
  }
}
/* 统一伤害结算：命中/闪避 → 暴击 → 防御/魔抗衰减（DEF/(DEF+220) 平滑曲线） */
function dealDamage(a,t,power,magical){
  /* 未录钩子：伤害前（可改倍率 / 无视防御 / 必暴） */
  /* tHp0/tMaxHp0：命中结算「之前」的目标生命快照。postDamage 里 t.hp 已被本次伤害扣减，
     若效果要按「挨这一下之前目标有多完整」计算，必须读快照，否则会被自身伤害稀释。 */
  const hk = (a.uniq&&a.uniq.length)
    ? fireHook(a,'preDamage',{a:a,t:t,power:power,magical:magical,bonusMult:1,ignoreDef:false,forceCrit:false,tHp0:t.hp,tMaxHp0:t.maxHp})
    : null;
  if(hk) power = hk.power * hk.bonusMult;
  /* BUG-1 修复：攻击方的 atkBoost 增益此前从未被任何伤害公式读取（狂暴/鼓舞类技能形同虚设） */
  const ab=(a.buffs||[]).find(function(x){ return x.type==='atkBoost' && x.turns>0; });
  if(ab) power = power * (1 + ab.val);
  /* 诅咒降攻（atkDown）：怪物的「降攻诅咒」通过此通道真正削弱攻击 */
  const ad=(a.buffs||[]).find(function(x){ return x.type==='atkDown' && x.turns>0; });
  if(ad) power = power * (1 - ad.val);
  const hitCh = clamp((a.hit!=null?a.hit:0.85) - (t.eva||0), 0.05, 1);
  if(Math.random() > hitCh){
    applyDamage(t,0);
    return {dmg:0, miss:true, crit:false};
  }
  let defense = (hk&&hk.ignoreDef) ? 0 : (magical ? (t.mdef||0) : (t.def||0));
  /* 战士·破阵执戟：累计破甲无视目标部分防御（满 5 层 = 20%），对高防 BOSS 增伤显著 */
  if(a.passive && a.passive.type==='armorBreak'){
    const ig=(a.passive.armorStacks||0)*0.04;
    defense = defense*(1-ig);
  }
  let raw = power * (1 - defense/(defense+220));
  let dmg = Math.max(1, Math.round(raw));
  let crit=false;
  const _forceCrit=(hk&&hk.forceCrit) || a.forceNextCrit;
  const _critBuff=(a.buffs||[]).find(function(x){ return x.type==='critBuff' && x.turns>0; });
  const effCrit=(a.crit||0)+(_critBuff?_critBuff.val:0);
  if(_forceCrit || Math.random() < effCrit){
    /* critDmgCap：未录①锈冠·褪印的必暴走这里夹取（GDD 05b §6.5）。满 T1 时 critDmg 可达 4.6+，
       而"无视防御 + 必暴"本身已是双重乘算，不夹的话对 tier9 Boss 单发可达 2.6 万。 */
    let _cd=(a.critDmg||1.5);
    /* 刺客·致命韵律：必暴那下额外 +30% 暴伤（装备暴击词条给不了此维度，满暴流仍有价值） */
    if(a.forceNextCrit && a.passive && a.passive.type==='lethalRhythm' && a.passive.critDmgBonus) _cd=_cd*(1+a.passive.critDmgBonus);
    const cdCap=(hk&&hk.critDmgCap)?hk.critDmgCap:Infinity;
    crit=true; dmg=Math.round(dmg*Math.min(_cd, cdCap));
    if(a.forceNextCrit){ a.forceNextCrit=false; if(a.side==='player') pushLog(a.side,'🔥 '+a.name+' 致命韵律·必暴！'); }
    /* 破绽触发：暴击时概率叠 1 层破甲（armorBreak trait） */
    if(a.side==='player' && a.triggerCrit && Math.random()<a.triggerCrit && a.passive && a.passive.type==='armorBreak' && (a.passive.armorStacks||0)<5){
      a.passive.armorStacks++; pushLog(a.side,'⚡ 破绽触发·叠层 '+a.passive.armorStacks+'/5');
    }
  }
  const vuln=t.buffs.find(x=>x.type==='vuln'&&x.turns>0);
  if(vuln) dmg=Math.round(dmg*(1+vuln.val));
  applyDamage(t,dmg,a);
  /* 即时击杀奖励：每只怪死后立刻给经验和道具 */
  if(t.hp<=0&&t.side==='enemy') killEnemy(t);
  if(a.lifesteal && !a.noHeal){
    let heal=Math.round(dmg*a.lifesteal);
    /* 单次回复 ≤ 3% 最大生命（GDD 02 §7.5 H1）：只约束玩家侧，
       怪物的技能吸血（mboss_drain 0.35）是设计好的 Boss 机制，不在此列 */
    if(a.side==='player') heal=Math.min(heal, Math.round(a.maxHp*AFFIX_CAPS.lifestealPerHit));
    a.hp=Math.min(a.maxHp, a.hp+heal);
  }
  /* 触发类词缀：攻击方装备概率触发特性效果 */
  if(a.side==='player' && dmg>0){
    if(a.triggerShadow && Math.random()<a.triggerShadow){
      const r2=dealDamage(a,t,Math.round(dmg*0.6),a.passive&&a.passive.type==='shadowStrike');
      if(!r2.miss) pushLog(a.side,'⚡ 影袭触发·追加 '+r2.dmg+' 伤害');
    }
  }
  const res={dmg, miss:false, crit};
  /* 未录钩子：伤害后 / 击杀 */
  if(hk){
    if(a._curSkill!=null) a._dmgAcc=(a._dmgAcc||0)+dmg;
    fireHook(a,'postDamage',{a:a,t:t,res:res,dmg:dmg,crit:crit,b:G.battle,tHp0:hk.tHp0,tMaxHp0:hk.tMaxHp0});
    if(t.hp<=0) fireHook(a,'onKill',{a:a,t:t,b:G.battle});
  }
  return res;
}
function basicAttack(a,t){
  const r = dealDamage(a,t,a.atk,false);
  if(r.miss) pushLog(a.side,(a.side==='player'?'🗡️':'💀')+' '+a.name+' 攻击 '+t.name+' 落空！');
  else pushLog(a.side,(a.side==='player'?'🗡️':'💀')+' '+a.name+' 攻击 '+t.name+' 造成 '+r.dmg+(r.crit?' 暴击!':''));
  /* 影袭连击：每次攻击追加 1 段 50% 伤害 */
  if(!r.miss && a.passive && a.passive.type==='shadowStrike'){
    const r2=dealDamage(a,t,Math.round(a.atk*(a.passive.extraMul||0.5)),false);
    if(!r2.miss) pushLog(a.side,(a.side==='player'?'🗡️':'💀')+' '+a.name+' 影袭连击追加 '+r2.dmg+(r2.crit?' 暴击!':''));

}
function castSkill(a,t,sk){
  /* 未录钩子：施法前后共用同一 ctx（供效果记录施法前状态并在施法后改写结果） */
  const _hc = (a.uniq&&a.uniq.length) ? {a:a,t:t,sk:sk,b:G.battle} : null;
  if(_hc){ a._dmgAcc=0; a._curSkill=sk.id||null; fireHook(a,'preCast',_hc); }
  const def=sk.def,lv=sk.lv;
  /* dualCast + chain_lightning synergy：双重施法时不扣 MP */

  /* 禁疗诅咒：施法者自身带 noHeal buff（或单位标记）则无法回血 */
